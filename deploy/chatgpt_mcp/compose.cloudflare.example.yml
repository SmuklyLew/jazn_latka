services:
  jazn-mcp:
    build:
      context: ../..
      dockerfile: deploy/chatgpt_mcp/Dockerfile
    restart: unless-stopped
    env_file:
      - ./jazn-mcp.env
    environment:
      JAZN_MCP_REQUIRE_SUPERVISOR: "1"
      JAZN_MEMORY_ROOT: /opt/jazn/memory
    volumes:
      - jazn-runtime:/opt/jazn/workspace_runtime
      - jazn-memory:/opt/jazn/memory
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          r=urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3);
          raise SystemExit(0 if r.status == 200 else 1)
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:?set CLOUDFLARED_IMAGE to a reviewed tag or immutable digest}
    restart: unless-stopped
    depends_on:
      jazn-mcp:
        condition: service_healthy
    secrets:
      - cloudflare_tunnel_token
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token

secrets:
  cloudflare_tunnel_token:
    file: ${CLOUDFLARE_TUNNEL_TOKEN_FILE:?set CLOUDFLARE_TUNNEL_TOKEN_FILE to a private absolute path}

volumes:
  jazn-runtime:
  jazn-memory:
