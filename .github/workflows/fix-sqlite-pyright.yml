name: fix-sqlite-pyright

on:
  push:
    branches:
      - fix/sqlite-runtime-io-hardening
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-sqlite-pyright
  cancel-in-progress: false

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[sqlite-pyright-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: fix/sqlite-runtime-io-hardening
      - name: Narrow sqlite isolation_level type
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('latka_jazn/db/runtime_sqlite.py')
          text = path.read_text(encoding='utf-8')
          old_import = 'from typing import Any, Iterator\n'
          new_import = 'from typing import Any, Iterator, Literal\n'
          old_type = '    isolation_level: str | None = "DEFERRED",\n'
          new_type = '    isolation_level: Literal["DEFERRED", "EXCLUSIVE", "IMMEDIATE"] | None = "DEFERRED",\n'
          if text.count(old_import) != 1 or text.count(old_type) != 1:
              raise SystemExit('expected sqlite typing targets not found exactly once')
          path.write_text(text.replace(old_import, new_import).replace(old_type, new_type), encoding='utf-8')
          PY
          rm -f .github/workflows/fix-sqlite-pyright.yml
          git add -A
          git diff --cached --check
      - name: Commit typing fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix SQLite isolation level typing [sqlite-pyright-fixed]"
          git push origin HEAD:fix/sqlite-runtime-io-hardening
