name: Finalize v16.2.4 refinements

on:
  pull_request:
    branches:
      - master
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  refine-and-test:
    if: github.head_ref == 'fix/v16.2.4-host-tool-provenance-memory-autoload'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/v16.2.4-host-tool-provenance-memory-autoload
          fetch-depth: 0

      - name: Reassemble and verify final refinement patch
        shell: bash
        run: |
          cat .github/.v1624-refine/refine.patch.00 \
              .github/.v1624-refine/refine.patch.01 > /tmp/v16_2_4_refinements.patch
          echo 'd5b653bebaa05ebe8428acbab5fd0c61ef95bf5d4f5c582751cb19babf2b6fa9  /tmp/v16_2_4_refinements.patch' | sha256sum -c -
          git apply --check --index /tmp/v16_2_4_refinements.patch
          git apply --index /tmp/v16_2_4_refinements.patch
          git diff --cached --check

      - name: Install project test environment
        shell: bash
        run: python -m pip install -e . pytest

      - name: Compile Python sources
        shell: bash
        run: python -X utf8 -m compileall -q latka_jazn tests main.py run.py

      - name: Run targeted regression tests
        shell: bash
        run: |
          python -m pytest -q \
            tests/test_v1624_host_tool_provenance.py \
            tests/test_v1624_runtime_memory_autoload.py \
            tests/test_chatgpt_mcp_two_phase_protocol.py \
            tests/test_runtime_package_loader_contract.py \
            tests/test_v160_single_canonical_workspace_contract.py

      - name: Remove one-shot staging and commit refinements
        shell: bash
        run: |
          git rm .github/.v1624-refine/refine.patch.00 \
                 .github/.v1624-refine/refine.patch.01 \
                 .github/workflows/v1624-refine-final.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: finalize v16.2.4 host provenance and memory autoload'
          git push origin HEAD:fix/v16.2.4-host-tool-provenance-memory-autoload
