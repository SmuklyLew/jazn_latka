name: apply-sqlite-runtime-hardening

on:
  push:
    branches:
      - fix/sqlite-runtime-io-hardening
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-sqlite-runtime-hardening
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[sqlite-hardening-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: fix/sqlite-runtime-io-hardening

      - name: Apply verified SQLite hardening patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/sqlite-hardening/part-*.patch > "$RUNNER_TEMP/sqlite-runtime-io-hardening.patch"
          git apply --check "$RUNNER_TEMP/sqlite-runtime-io-hardening.patch"
          git apply "$RUNNER_TEMP/sqlite-runtime-io-hardening.patch"
          rm -rf .github/sqlite-hardening
          rm -f .github/workflows/apply-sqlite-runtime-hardening.yml
          git add -A
          git diff --cached --check
          git diff --cached --name-status

      - name: Commit production update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden runtime SQLite I/O and failure isolation [sqlite-hardening-applied]"
          git push origin HEAD:fix/sqlite-runtime-io-hardening
