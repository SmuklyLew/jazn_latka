name: persistent-runtime-e2e

on:
  pull_request:
    branches:
      - master
    paths:
      - "latka_jazn/core/runtime_daemon.py"
      - "latka_jazn/core/daemon_autostart.py"
      - "latka_jazn/core/epistemic_decision_ledger.py"
      - "latka_jazn/core/chatgpt_host_recovery.py"
      - "latka_jazn/bridge/secure_host_runtime_gateway.py"
      - "latka_jazn/mcp/server.py"
      - "latka_jazn/mcp/tools/jazn_resume_visible_reply.py"
      - "latka_jazn/db/runtime_sqlite.py"
      - "latka_jazn/version.py"
      - "tests/test_v1636_persistent_runtime_e2e_hardening.py"
      - "tests/test_v1637_host_finalization_recovery.py"
      - ".github/workflows/persistent-runtime-e2e.yml"
  push:
    branches:
      - master
      - "update/**"
      - "fix/**"
      - "hotfix/**"
      - "upgrade/**"
    paths:
      - "latka_jazn/core/runtime_daemon.py"
      - "latka_jazn/core/daemon_autostart.py"
      - "latka_jazn/core/epistemic_decision_ledger.py"
      - "latka_jazn/core/chatgpt_host_recovery.py"
      - "latka_jazn/bridge/secure_host_runtime_gateway.py"
      - "latka_jazn/mcp/server.py"
      - "latka_jazn/mcp/tools/jazn_resume_visible_reply.py"
      - "latka_jazn/db/runtime_sqlite.py"
      - "latka_jazn/version.py"
      - "tests/test_v1636_persistent_runtime_e2e_hardening.py"
      - "tests/test_v1637_host_finalization_recovery.py"
      - ".github/workflows/persistent-runtime-e2e.yml"

permissions:
  contents: read

jobs:
  persistent_runtime_e2e:
    name: persistent runtime E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      JAZN_NETWORK_TIME_FIRST: "0"
      JAZN_NETWORK_TIME_IN_TURN: "0"
      JAZN_ALLOW_NETWORK: "0"
      JAZN_DICTIONARY_ALLOW_NETWORK: "0"
      JAZN_MODEL_ADAPTER: "null"
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile persistent-runtime paths
        run: >-
          python -X utf8 -m compileall -q
          latka_jazn/core/runtime_daemon.py
          latka_jazn/core/daemon_autostart.py
          latka_jazn/core/epistemic_decision_ledger.py
          latka_jazn/core/chatgpt_host_recovery.py
          latka_jazn/bridge/secure_host_runtime_gateway.py
          latka_jazn/mcp/server.py
          latka_jazn/mcp/tools/jazn_resume_visible_reply.py
          latka_jazn/db/runtime_sqlite.py
          tests/test_v1636_persistent_runtime_e2e_hardening.py
          tests/test_v1637_host_finalization_recovery.py

      - name: Persistent runtime E2E regression suite
        run: >-
          python -X utf8 -m pytest
          -q -ra --tb=short --durations=20
          tests/test_v1636_persistent_runtime_e2e_hardening.py
          tests/test_v1637_host_finalization_recovery.py

      - name: Clean checkout guard
        if: always()
        shell: bash
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
