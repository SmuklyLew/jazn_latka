      - "tests/test_runtime_stability_daemon_status.py"
      - "tests/test_chatgpt_mcp_two_phase_protocol.py"
      - "tests/test_v1607_host_finalization_lifecycle.py"
      - "tests/test_memory_recall_timeout_hardening.py"
      - "tests/test_v1631_host_finalization_provenance_polish_nlp.py"
      - ".github/workflows/persistent-runtime-e2e.yml"

permissions:
  contents: read

jobs:
  persistent_runtime_e2e:
    name: persistent runtime E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      JAZN_NETWORK_TIME_FIRST: "0"
      JAZN_NETWORK_TIME_IN_TURN: "0"
      JAZN_ALLOW_NETWORK: "0"
      JAZN_DICTIONARY_ALLOW_NETWORK: "0"
      JAZN_MODEL_ADAPTER: "null"
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile runtime, gate, and regression paths
        run: python -X utf8 -m compileall -q latka_jazn tests main.py run.py

      - name: v16.3.23 host gate and persistent lifecycle E2E
        run: >-
          python -X utf8 -m pytest
          -q -ra --tb=short --durations=20
          tests/test_v16323_host_pre_response_gate.py
          tests/test_v16323_persistent_runtime_lifecycle_transport.py
          tests/test_v16323_active_memory_recall_e2e.py
          tests/test_v16322_active_runtime_subject_root.py
          tests/test_v16321_chatgpt_runtime_fallback_hardening.py
          tests/test_v1636_persistent_runtime_e2e_hardening.py
          tests/test_v1637_host_finalization_recovery.py

      - name: Daemon identity, security, atomicity, and timeout matrix
        run: >-
          python -X utf8 -m pytest
          -q -ra --tb=short --durations=20
          tests/test_runtime_daemon_security_contract.py
          tests/test_runtime_stability_daemon_status.py
          tests/test_memory_recall_timeout_hardening.py
          tests/test_v163252_live_voice_readiness.py

      - name: Presentation and finalization fail-closed matrix
        run: >-
          python -X utf8 -m pytest
          -q -ra --tb=short --durations=20
          tests/test_chatgpt_mcp_two_phase_protocol.py
          tests/test_v1607_host_finalization_lifecycle.py
          tests/test_v1631_host_finalization_provenance_polish_nlp.py
          tests/test_v163251_host_finalization_gate.py

      - name: Clean checkout guard
        if: always()
        shell: bash
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
