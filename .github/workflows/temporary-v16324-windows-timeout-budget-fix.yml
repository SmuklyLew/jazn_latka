name: temporary-v16324-windows-timeout-budget-fix

on:
  push:
    branches:
      - upgrade/v16.3.24-package-provenance-bootstrap-hardening
    paths:
      - .github/workflows/temporary-v16324-windows-timeout-budget-fix.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: upgrade/v16.3.24-package-provenance-bootstrap-hardening

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[memory-rebuild-ui]" pytest

      - name: Patch daemon timeout phase boundaries
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("latka_jazn/core/runtime_daemon.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '''        with self._chat_jobs_lock:\n            if job.terminal():\n                return\n            job.status = "running"\n            job.worker_generation = worker_generation\n            job.started_at_utc = utc_now_iso()\n''',
                  '''        with self._chat_jobs_lock:\n            if job.terminal():\n                return\n            # Queue latency is telemetry, not part of the per-turn execution\n            # budget. Arm a fresh watchdog window when a queue worker actually\n            # picks the job up; this window still covers orchestration stalls\n            # such as a blocked get_session() call.\n            if job.turn_context is not None:\n                job.turn_context.deadline_monotonic = (\n                    pickup_started + job.turn_context.timeout_seconds\n                )\n            job.status = "running"\n            job.worker_generation = worker_generation\n            job.started_at_utc = utc_now_iso()\n''',
              ),
              (
                  '''            with self._chat_jobs_lock:\n                terminalized_while_initializing = job.terminal()\n                if not terminalized_while_initializing:\n                    job.active_session_worker = session\n''',
                  '''            with self._chat_jobs_lock:\n                terminalized_while_initializing = job.terminal()\n                if not terminalized_while_initializing:\n                    job.active_session_worker = session\n                    # Session acquisition has its own orchestration watchdog\n                    # window. Once it succeeds, the runtime turn receives the\n                    # full advertised execution budget instead of inheriting\n                    # scheduler/session-startup latency.\n                    if job.turn_context is not None:\n                        job.turn_context.deadline_monotonic = (\n                            time.monotonic() + job.turn_context.timeout_seconds\n                        )\n''',
              ),
              (
                  '''            for job in self.chat_jobs.values():\n                if job.terminal() or job.status == DAEMON_CHAT_JOB_HOST_PENDING_STATE or job.turn_context is None:\n                    continue\n''',
                  '''            for job in self.chat_jobs.values():\n                # execution_timeout owns active execution only. A queued job has\n                # not started its execution budget yet; queue latency is tracked\n                # separately by the queue_wait stage.\n                if job.terminal() or job.status != "running" or job.turn_context is None:\n                    continue\n''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one source match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          '@ | python -

      - name: Compile changed runtime
        shell: pwsh
        run: python -X utf8 -m compileall -q latka_jazn/core/runtime_daemon.py

      - name: Repeat exact Windows regression
        shell: pwsh
        run: |
          1..12 | ForEach-Object {
            Write-Host "Regression repetition $_/12"
            python -X utf8 -m pytest -q --tb=short tests/test_runtime_stability_daemon_status.py::test_execution_timeout_is_terminal_and_worker_accepts_next_job
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run timeout replacement regressions
        shell: pwsh
        run: |
          python -X utf8 -m pytest -q -ra --tb=short `
            tests/test_runtime_stability_daemon_status.py::test_execution_timeout_is_terminal_and_worker_accepts_next_job `
            tests/test_runtime_stability_daemon_status.py::test_execution_timeout_replaces_poisoned_session_worker_for_same_session `
            tests/test_runtime_stability_daemon_status.py::test_watchdog_terminalizes_orchestration_stall_and_replaces_queue_worker

      - name: Run full Windows atomicity timeout target
        shell: pwsh
        run: |
          python -X utf8 -m pytest -q -ra --tb=short --durations=20 `
            tests/test_turn_atomicity.py `
            tests/test_turn_timeout_audit_nonblocking.py `
            tests/test_runtime_stability_daemon_status.py

      - name: Commit verified source fix and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-v16324-windows-timeout-budget-fix.yml
          git add latka_jazn/core/runtime_daemon.py
          git diff --cached --check
          git commit -m "fix(v16.3.24): isolate daemon queue and execution deadlines"
          git push origin HEAD:upgrade/v16.3.24-package-provenance-bootstrap-hardening
