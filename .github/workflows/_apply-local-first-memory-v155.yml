name: apply-local-first-memory-v155

on:
  push:
    branches:
      - upgrade/local-first-memory-cloud-v155

permissions:
  contents: write

concurrency:
  group: apply-local-first-memory-v155
  cancel-in-progress: false

jobs:
  apply_verified_upgrade:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      EXPECTED_BASE64_SHA256: 0d3a9b02a253d3607f631ed6f8ab9ed9b8fd028334eb82b3ab32610c4e2a4e44
      EXPECTED_GZIP_SHA256: 6a135ceb63991025612edc4a94eb1e92cf78558d34b474a4015758974960480d
      EXPECTED_PATCH_SHA256: 803b4fc6bcdb3cda4ca35a0418cf711b4dbb666d1ada8326ae40047883a3c511
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: upgrade/local-first-memory-cloud-v155

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          for f in .jazn_upgrade_transport/local-first-memory-v155/chunk-*; do
            printf 'TRANSPORT %s size=%s sha256=%s\n' "$(basename "$f")" "$(wc -c < "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"
          done
          cat .jazn_upgrade_transport/local-first-memory-v155/chunk-* > "$RUNNER_TEMP/upgrade.b64"
          ACTUAL_B64=$(sha256sum "$RUNNER_TEMP/upgrade.b64" | cut -d' ' -f1)
          printf 'TRANSPORT combined_size=%s combined_sha256=%s expected=%s\n' "$(wc -c < "$RUNNER_TEMP/upgrade.b64")" "$ACTUAL_B64" "$EXPECTED_BASE64_SHA256"
          echo "${EXPECTED_BASE64_SHA256}  $RUNNER_TEMP/upgrade.b64" | sha256sum --check --strict
          base64 --decode "$RUNNER_TEMP/upgrade.b64" > "$RUNNER_TEMP/upgrade.patch.gz"
          ACTUAL_GZIP=$(sha256sum "$RUNNER_TEMP/upgrade.patch.gz" | cut -d' ' -f1)
          printf 'TRANSPORT gzip_size=%s gzip_sha256=%s expected=%s\n' "$(wc -c < "$RUNNER_TEMP/upgrade.patch.gz")" "$ACTUAL_GZIP" "$EXPECTED_GZIP_SHA256"
          gzip -t "$RUNNER_TEMP/upgrade.patch.gz"
          gzip --decompress --stdout "$RUNNER_TEMP/upgrade.patch.gz" > "$RUNNER_TEMP/upgrade.patch"
          ACTUAL_PATCH=$(sha256sum "$RUNNER_TEMP/upgrade.patch" | cut -d' ' -f1)
          printf 'TRANSPORT patch_size=%s patch_sha256=%s expected=%s\n' "$(wc -c < "$RUNNER_TEMP/upgrade.patch")" "$ACTUAL_PATCH" "$EXPECTED_PATCH_SHA256"
          echo "${EXPECTED_GZIP_SHA256}  $RUNNER_TEMP/upgrade.patch.gz" | sha256sum --check --strict
          echo "${EXPECTED_PATCH_SHA256}  $RUNNER_TEMP/upgrade.patch" | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/upgrade.patch"

      - name: Apply upgrade and remove transport scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git apply "$RUNNER_TEMP/upgrade.patch"
          rm -rf .jazn_upgrade_transport
          rm -f .github/workflows/_apply-local-first-memory-v155.yml

      - name: Fast structural gate
        shell: bash
        run: |
          set -euo pipefail
          python -X utf8 -m compileall -q latka_jazn tests main.py run.py
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no | grep '^?? .jazn_upgrade_transport' || true)"

      - name: Commit verified functional tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(memory): add local-first encrypted cloud durability"
          git push origin HEAD:upgrade/local-first-memory-cloud-v155
