name: Finalize package version workflow fix

on:
  push:
    branches:
      - fix/package-version-workflow
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply-test-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/package-version-workflow

      - name: Apply final patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/schema-bridge.patch
          git apply .github/schema-bridge.patch
          git diff --check

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install --disable-pip-version-check -e . pytest

      - name: Validate complete change
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/jazn_pack_generator.py \
            tools/jazn_version_rebuild.py \
            tests/test_package_version_workflow_regression.py \
            tests/test_jazn_pack_generator_v84_contract.py
          python tools/jazn_pack_generator.py self-test
          python -m pytest -q -ra --tb=short -m "not live_model and not live_mcp"

      - name: Commit, rebase and push clean target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/jazn_pack_generator.py \
            tools/jazn_version_rebuild.py \
            tests/test_jazn_pack_generator_v84_contract.py
          git rm .github/schema-bridge.patch
          git rm .github/schema-bridge.trigger
          git rm .github/workflows/apply-schema-bridge-fix.yml
          git diff --cached --check
          git commit -m "Finalize package generator v8.5 and version rebuild v0.2"
          git fetch origin fix/package-version-workflow
          git rebase origin/fix/package-version-workflow
          git push origin HEAD:fix/package-version-workflow
