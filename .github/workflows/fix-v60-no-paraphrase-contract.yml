name: Fix v60 no-paraphrase contract

on:
  push:
    branches:
      - upgrade/v16.3.25.5.60-main-entrypoint-chatgpt-live-convergence
    paths:
      - .github/workflows/fix-v60-no-paraphrase-contract.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Add exact no-paraphrase invariant and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('AGENTS.chatgpt.md')
          text = path.read_text(encoding='utf-8')
          phrase = 'Nie parafrazuj wiadomości przed przekazaniem.'
          anchor = 'Dla każdej następnej wiadomości użytkownika każdą bieżącą wiadomość przekaż w dokładnym brzmieniu przez już otwarty persistent bridge.\n'
          if phrase not in text:
              if anchor not in text:
                  raise SystemExit('expected persistent bridge anchor missing')
              text = text.replace(anchor, anchor + '\n' + phrase + '\n', 1)
              path.write_text(text, encoding='utf-8')
          updated = path.read_text(encoding='utf-8')
          assert phrase in updated
          assert 'nie uruchamiaj nowej komendy CLI' in updated
          assert 'każdą bieżącą wiadomość przekaż w dokładnym brzmieniu' in updated
          PY
          git diff --check
          rm .github/workflows/fix-v60-no-paraphrase-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: forbid host paraphrase before runtime handoff'
          git push origin "HEAD:${GITHUB_REF_NAME}"
