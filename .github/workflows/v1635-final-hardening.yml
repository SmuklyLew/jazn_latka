name: v16.3.5 final hardening gate

on:
  push:
    branches:
      - 16.3.5-complex-dialogue-memory-routing-final-hardening

permissions:
  contents: read

concurrency:
  group: v1635-final-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      should_run: ${{ steps.detect.outputs.run }}
      head_sha: ${{ steps.head.outputs.sha }}
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Detect one-shot transform
        id: detect
        shell: bash
        run: |
          if [ -f .github/v1635_apply.py ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.detect.outputs.run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Apply deterministic v16.3.5 transformations
        if: steps.detect.outputs.run == 'true'
        run: python -X utf8 .github/v1635_apply.py

      - name: Remove one-shot transformation helper
        if: steps.detect.outputs.run == 'true'
        run: rm .github/v1635_apply.py

      - name: Install targeted validation dependencies
        if: steps.detect.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile changed runtime
        if: steps.detect.outputs.run == 'true'
        run: python -X utf8 -m compileall -q latka_jazn tests main.py run.py

      - name: Run v16.3.4 and v16.3.5 dialogue regressions
        if: steps.detect.outputs.run == 'true'
        run: >-
          python -X utf8 -m pytest -q -ra --tb=short
          tests/test_v1634_complex_dialogue_memory_routing.py
          tests/test_v1635_final_hardening.py
          tests/test_conversation_archive_routing_guard.py
          tests/test_quoted_control_text_routing.py

      - name: Commit verified hardened code before metadata sync
        if: steps.detect.outputs.run == 'true'
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete complex dialogue memory routing hardening for 16.3.5"

      - name: Normalize origin for deterministic provenance
        if: steps.detect.outputs.run == 'true'
        run: git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Synchronize canonical release metadata from clean tree
        if: steps.detect.outputs.run == 'true'
        run: >-
          python -X utf8 -m latka_jazn.tools.release_metadata_sync
          --root . --base-branch master --write --json

      - name: Commit canonical metadata and push verified stack
        if: steps.detect.outputs.run == 'true'
        shell: bash
        run: |
          git diff --check
          git add SOURCE_PROVENANCE.json PACKAGE_INTEGRITY_MANIFEST.json
          if ! git diff --cached --quiet; then
            git commit -m "release: synchronize canonical metadata for 16.3.5 [skip ci]"
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Resolve hardened HEAD
        id: head
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify_ubuntu:
    name: full deterministic + static gate
    needs: apply
    if: needs.apply.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout hardened HEAD
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ needs.apply.outputs.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Set up Node.js for Pyright
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[memory-rebuild-ui]" pytest
          npm install --global pyright@1.1.411

      - name: Compile all active Python
        run: python -X utf8 -m compileall -q latka_jazn tests main.py run.py

      - name: Static type audit
        run: pyright latka_jazn main.py run.py

      - name: Static regression-contract audit
        run: >-
          pyright
          tests/test_chatgpt_mcp_end_to_end_v96.py
          tests/test_dialogue_task_state_v154.py
          tests/test_host_finalized_session_continuity_v154.py
          tests/test_memory_cloud_sync_v155.py
          tests/test_memory_recall_timeout_hardening.py
          tests/test_v1635_final_hardening.py
          tools/_jazn_pack_generator_memory_v2.py
          tools/jazn_pack_generator.py

      - name: Independent semantic route audit
        run: python -X utf8 -m latka_jazn.tools.semantic_route_audit --root . --json

      - name: Cognitive architecture audit
        run: python -X utf8 -m latka_jazn.tools.cognitive_architecture_audit --root . --json

      - name: Full deterministic test suite
        run: >-
          python -X utf8 -m pytest
          -q -ra --tb=short --durations=25
          --junitxml="${{ runner.temp }}/pytest-ubuntu.xml"
          -m "not live_model and not live_mcp"

      - name: Upload Ubuntu report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v1635-pytest-ubuntu-failure
          path: ${{ runner.temp }}/pytest-ubuntu.xml
          if-no-files-found: ignore
          retention-days: 3

      - name: Clean checkout guard
        if: always()
        shell: bash
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  verify_windows:
    name: windows runtime + path gate
    needs: apply
    if: needs.apply.outputs.should_run == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout hardened HEAD
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ needs.apply.outputs.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Targeted Windows runtime and path tests
        shell: pwsh
        run: >-
          python -X utf8 -m pytest
          -q -ra --tb=short
          --junitxml="${{ runner.temp }}/pytest-windows.xml"
          tests/test_release_workflow_hardening.py
          tests/test_runtime_stability_rest_cycle_v1542.py
          tests/test_rest_cycle_controller_v1542.py
          tests/test_rest_cycle_store_v1542.py
          tests/test_wake_rest_continuity_v1542.py
          tests/test_cognitive_truth_memory_integration_v15421.py
          tests/test_startup_stability.py
          tests/test_runtime_stability_package_smoke.py
          tests/test_release_hardening_safe_paths.py
          tests/test_zip_resource_limits.py
          tests/test_shard_manifest_fail_closed.py
          tests/test_dialogue_task_state_v154.py
          tests/test_host_finalized_session_continuity_v154.py
          tests/test_reasoning_orchestrator_v154.py
          tests/test_knowledge_fabric_v154.py
          tests/test_lexical_intelligence_v154.py
          tests/test_operational_learning_memory_v154.py
          tests/test_external_dictionary_v154.py
          tests/test_v1635_final_hardening.py

      - name: Turn atomicity and timeout regressions
        shell: pwsh
        run: >-
          python -X utf8 -m pytest
          -q -ra --tb=short --durations=20
          tests/test_turn_atomicity.py
          tests/test_turn_timeout_audit_nonblocking.py
          tests/test_runtime_stability_daemon_status.py

      - name: Upload Windows report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v1635-pytest-windows-failure
          path: ${{ runner.temp }}/pytest-windows.xml
          if-no-files-found: ignore
          retention-days: 3

      - name: Clean checkout guard
        if: always()
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dirty = @(git status --porcelain --untracked-files=all)
          if ($dirty.Count -gt 0) {
            $dirty | ForEach-Object { Write-Host $_ }
            throw "Tests left tracked or untracked files in the checkout."
          }

  finalization:
    name: final clean release gate
    needs: [apply, verify_ubuntu, verify_windows]
    if: needs.apply.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      JAZN_NETWORK_TIME_FIRST: "0"
      JAZN_NETWORK_TIME_IN_TURN: "0"
      JAZN_ALLOW_NETWORK: "0"
      JAZN_DICTIONARY_ALLOW_NETWORK: "0"
      JAZN_MODEL_ADAPTER: "null"
    steps:
      - name: Checkout verified HEAD
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ needs.apply.outputs.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Doctor and system package smoke before final cleanup
        run: |
          python -X utf8 run.py doctor --json
          python -X utf8 run.py package-smoke --profile system --json

      - name: Commit one-shot workflow removal
        shell: bash
        run: |
          rm .github/workflows/v1635-final-hardening.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: remove v16.3.5 one-shot hardening workflow [skip ci]"

      - name: Resynchronize canonical metadata from clean final tree
        shell: bash
        run: |
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          python -X utf8 -m latka_jazn.tools.release_metadata_sync --root . --base-branch master --write --json

      - name: Commit final metadata and push final tree
        shell: bash
        run: |
          git diff --check
          git add SOURCE_PROVENANCE.json PACKAGE_INTEGRITY_MANIFEST.json
          if ! git diff --cached --quiet; then
            git commit -m "release: finalize canonical metadata for 16.3.5 [skip ci]"
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Verify final metadata is idempotent
        run: >-
          python -X utf8 -m latka_jazn.tools.release_metadata_sync
          --root . --base-branch master --check --json

      - name: Doctor on final committed tree
        run: python -X utf8 run.py doctor --json

      - name: Release package smoke on final committed tree
        run: python -X utf8 run.py package-smoke --profile release --json

      - name: Build final release bundle outside checkout
        run: >-
          python -X utf8 run.py release-build
          --root .
          --output "${{ runner.temp }}/jazn_latka_v16.3.5-release.zip"
          --json

      - name: Final clean checkout guard
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
