name: Test Studio finalizer

on:
  push:
    branches:
      - fix/v16.3.25.5.68-tests-studio-live-progress

permissions:
  contents: write

jobs:
  finalize-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[studio-final]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
          ref: fix/v16.3.25.5.68-tests-studio-live-progress
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.12'
      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          npm install --global pyright@1.1.411
      - name: Materialize final Test Studio fixes
        run: python -X utf8 tools/jazn_tests_studio/apply_ci_type_fix.py
      - name: Validate Test Studio implementation
        run: |
          python -m py_compile tools/jazn_tests_studio.py tools/jazn_tests_studio/progress_plugin.py tools/jazn_tests_studio/migrate_stable_test_contracts.py
          python -X utf8 tools/jazn_tests_studio.py self-test
          pyright tools/jazn_tests_studio.py tools/jazn_tests_studio/migrate_stable_test_contracts.py
          python -X utf8 tools/github_actions_node24_audit.py --root . --json
          python -m pytest -q tests/test_test_suite_governance.py
      - name: Run full active test suite
        run: python -X utf8 -m pytest -q tests --ignore=tests/archive
      - name: Commit final materialized update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/jazn_tests_studio.py \
                  tools/jazn_tests_studio/migrate_stable_test_contracts.py \
                  tools/jazn_tests_studio/README.md \
                  tools/jazn_tests_studio/__init__.py \
                  tools/jazn_tests_studio/settings.json \
                  .github/workflows/persistent-runtime-e2e.yml
          git rm tools/jazn_tests_studio/apply_ci_type_fix.py
          git rm .github/workflows/tests-studio-pyright-repair.yml
          git commit -m 'fix: finalize Jaźń - Studio Testów live progress [studio-final]'
          git fetch origin fix/v16.3.25.5.68-tests-studio-live-progress
          git rebase origin/fix/v16.3.25.5.68-tests-studio-live-progress
          git push origin HEAD:fix/v16.3.25.5.68-tests-studio-live-progress
