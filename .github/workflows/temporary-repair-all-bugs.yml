name: Temporary repair-all-bugs applicator

on:
  push:
    branches:
      - update/repair-all-bugs-in-me

permissions:
  contents: write

concurrency:
  group: repair-all-bugs-in-me
  cancel-in-progress: false

jobs:
  apply-validate-and-self-remove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: update/repair-all-bugs-in-me
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply verified repair patch
        shell: bash
        run: |
          cat .repair/patch.b64.* > /tmp/repair_all.patch.b64
          base64 --decode /tmp/repair_all.patch.b64 > /tmp/repair_all.patch
          echo "11c6a2baa9299cd4f5c5164d9ae482e504c21a558e4a57460f028974afe21108  /tmp/repair_all.patch" | sha256sum --check -
          git apply --check /tmp/repair_all.patch
          git apply /tmp/repair_all.patch
          git rm -r .repair
          git rm .github/workflows/temporary-repair-all-bugs.yml
          git diff --check

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile and run full test suite
        run: |
          python -m compileall -q latka_jazn main.py run.py
          python -m pytest -q

      - name: Commit validated repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair runtime bootstrap, memory readiness, and type safety"
          git push origin HEAD:update/repair-all-bugs-in-me
