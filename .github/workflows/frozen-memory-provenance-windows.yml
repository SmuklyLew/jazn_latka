name: frozen-memory-provenance-windows

on:
  pull_request:
    branches:
      - master
    paths:
      - "latka_jazn/tools/memory_rebuild_app/p1_provenance_chain.py"
      - "tests/test_memory_provenance_chain_p1.py"
      - "tests/test_memory_provenance_windows_file_stability.py"
      - ".github/workflows/frozen-memory-provenance-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-artifact-provenance:
    name: Frozen SQLite SHA-256 and Windows stat/fstat regression
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install canonical memory test dependencies
        shell: pwsh
        run: |
          python -m pip install -e ".[archive,memory-rebuild-ui]" pytest
          python -m pip check

      - name: Run all frozen synthetic artifact and stat/fstat regressions
        shell: pwsh
        run: >-
          python -X utf8 -m pytest
          -q -ra --tb=short
          tests/test_memory_provenance_chain_p1.py
          tests/test_memory_provenance_windows_file_stability.py
