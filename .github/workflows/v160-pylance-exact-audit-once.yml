name: v160-pylance-exact-audit-once

on:
  push:
    branches:
      - fix/v160-pylance-type-contracts

permissions:
  contents: write

jobs:
  pyright-exact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: fix/v160-pylance-type-contracts

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install dependencies and Pyright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[memory-rebuild-ui]" pytest
          npm install --global pyright@1.1.411

      - name: Exact Pylance/Pyright audit
        run: >-
          pyright
          latka_jazn/mcp/tools/jazn_generate_visible_reply.py
          tests/test_chatgpt_mcp_end_to_end_v96.py
          tests/test_dialogue_task_state_v154.py
          tests/test_host_finalized_session_continuity_v154.py
          tests/test_memory_cloud_sync_v155.py
          tests/test_memory_recall_timeout_hardening.py
          tools/_jazn_pack_generator_memory_v2.py
          tools/jazn_pack_generator.py

      - name: Targeted regression suite
        run: >-
          python -X utf8 -m pytest -q -ra --tb=short
          tests/test_chatgpt_mcp_end_to_end_v96.py
          tests/test_dialogue_task_state_v154.py
          tests/test_host_finalized_session_continuity_v154.py
          tests/test_memory_cloud_sync_v155.py
          tests/test_memory_recall_timeout_hardening.py
          tests/test_jazn_pack_generator_v84_contract.py
          tests/test_independent_memory_package_contract_v2.py

      - name: Remove one-shot audit after success
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/v160-pylance-exact-audit-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove completed v16 Pylance audit workflow"
          git push origin HEAD:fix/v160-pylance-type-contracts
