name: Jaźń phase-2 conversation finalizer (one-shot)

on:
  push:
    branches:
      - upgrade/v16.6.0-conversation-runtime-state-trace-memory-final
    paths:
      - .github/jazn_phase2_conversation_commit.patch
      - .github/workflows/jazn-phase2-conversation-finalizer-once.yml

permissions:
  contents: write

concurrency:
  group: jazn-phase2-conversation-finalizer-once
  cancel-in-progress: false

jobs:
  apply-test-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Verify and apply bounded phase-2 patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/jazn_phase2_conversation_commit.patch
          git apply .github/jazn_phase2_conversation_commit.patch
          python -m py_compile latka_jazn/core/chat_command_contract.py

      - name: Validate phase-2 and continuity regressions
        run: |
          python -X utf8 -m pytest -q \
            tests/test_host_finalized_conversation_state.py \
            tests/test_host_finalized_session_continuity.py \
            tests/test_turn_settlement_authority_convergence.py \
            tests/test_pending_host_request_continuity.py \
            tests/test_accepted_visible_turn_finalization_convergence.py \
            tests/test_chatgpt_mcp_two_phase_protocol.py

      - name: Persist tested checkpoint and remove one-shot transport
        shell: bash
        run: |
          set -euo pipefail
          rm .github/jazn_phase2_conversation_commit.patch
          rm .github/workflows/jazn-phase2-conversation-finalizer-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(host): bind accepted phase-2 replies to durable conversation state"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
