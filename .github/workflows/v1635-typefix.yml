name: v16.3.5 strict typing repair

on:
  push:
    branches:
      - 16.3.5-complex-dialogue-memory-routing-final-hardening

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Apply strict typing fixes
        run: python -X utf8 .github/v1635_typefix.py
      - name: Remove one-shot repair infrastructure
        shell: bash
        run: |
          rm .github/v1635_typefix.py
          rm -f .github/workflows/v1635-final-hardening.yml
          rm -f .github/workflows/v1635-typefix.yml
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[memory-rebuild-ui]" pytest
      - name: Compile and run dialogue regressions
        run: |
          python -X utf8 -m compileall -q latka_jazn tests main.py run.py
          python -X utf8 -m pytest -q -ra --tb=short tests/test_v1634_complex_dialogue_memory_routing.py tests/test_v1635_final_hardening.py tests/test_conversation_archive_routing_guard.py tests/test_quoted_control_text_routing.py
      - name: Run full main-code Pyright
        run: |
          npm install --global pyright@1.1.411
          pyright latka_jazn main.py run.py
      - name: Commit verified type repairs and infrastructure cleanup
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: satisfy strict typing for 16.3.5 memory routing"
      - name: Synchronize canonical release metadata from clean tree
        shell: bash
        run: |
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          python -X utf8 -m latka_jazn.tools.release_metadata_sync --root . --base-branch master --write --json
      - name: Commit metadata and push
        shell: bash
        run: |
          git add SOURCE_PROVENANCE.json PACKAGE_INTEGRITY_MANIFEST.json
          if ! git diff --cached --quiet; then
            git commit -m "release: synchronize metadata after v16.3.5 type repair [skip ci]"
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
