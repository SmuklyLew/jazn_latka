name: fix-local-first-v155-pyright

on:
  push:
    branches:
      - upgrade/local-first-memory-cloud-v155-full

permissions:
  contents: write

concurrency:
  group: fix-local-first-v155-pyright
  cancel-in-progress: false

jobs:
  apply_type_hardening:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: upgrade/local-first-memory-cloud-v155-full
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply cohesive optional-dependency and contract narrowing fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, got {count}')
              p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          # Optional cloud/server dependencies stay optional for local-only installations.
          path = 'latka_jazn/memory/memory_cloud_gateway.py'
          replace(path, 'import hashlib\nimport json\nimport secrets\n', 'import hashlib\nimport importlib\nimport json\nimport secrets\n')
          replace(path,
              '''            try:\n                import psycopg\n            except Exception as exc:  # pragma: no cover - optional server dependency\n                raise MemoryCloudRepositoryError(\n                    "psycopg is required for PostgreSQL memory gateway; install latka-jazn[memory-cloud-server]"\n                ) from exc\n            con = psycopg.connect(self.dsn)\n''',
              '''            try:\n                psycopg: Any = importlib.import_module("psycopg")\n            except Exception as exc:  # pragma: no cover - optional server dependency\n                raise MemoryCloudRepositoryError(\n                    "psycopg is required for PostgreSQL memory gateway; install latka-jazn[memory-cloud-server]"\n                ) from exc\n            con = psycopg.connect(self.dsn)\n''')
          replace(path,
              '''        if client is None:\n            try:\n                import boto3\n            except Exception as exc:  # pragma: no cover - optional server dependency\n                raise MemoryCloudRepositoryError(\n                    "boto3 is required for S3-compatible memory objects; install latka-jazn[memory-cloud-server]"\n                ) from exc\n            client = boto3.client("s3", endpoint_url=endpoint_url, region_name=region_name)\n        self.client = client\n''',
              '''        resolved_client: Any = client\n        if resolved_client is None:\n            try:\n                boto3: Any = importlib.import_module("boto3")\n            except Exception as exc:  # pragma: no cover - optional server dependency\n                raise MemoryCloudRepositoryError(\n                    "boto3 is required for S3-compatible memory objects; install latka-jazn[memory-cloud-server]"\n                ) from exc\n            resolved_client = boto3.client("s3", endpoint_url=endpoint_url, region_name=region_name)\n        if resolved_client is None:\n            raise MemoryCloudRepositoryError("S3-compatible client construction returned no client")\n        self.client: Any = resolved_client\n''')

          path = 'latka_jazn/memory/memory_sync_crypto.py'
          replace(path, 'import hashlib\nimport os\n', 'import hashlib\nimport importlib\nimport os\n')
          replace(path,
              '''        try:\n            from nacl import bindings\n        except Exception as exc:  # pragma: no cover - depends on optional package\n            raise MemoryCryptoUnavailable(\n                "PyNaCl is required for encrypted memory sync; install latka-jazn[memory-cloud]"\n            ) from exc\n        return bindings\n''',
              '''        try:\n            bindings: Any = importlib.import_module("nacl.bindings")\n        except Exception as exc:  # pragma: no cover - depends on optional package\n            raise MemoryCryptoUnavailable(\n                "PyNaCl is required for encrypted memory sync; install latka-jazn[memory-cloud]"\n            ) from exc\n        return bindings\n''')
          replace(path,
              '''        try:\n            from nacl import bindings, pwhash\n        except Exception as exc:  # pragma: no cover - optional dependency\n            raise MemoryCryptoUnavailable("PyNaCl is required to create a recovery bundle") from exc\n''',
              '''        try:\n            bindings: Any = importlib.import_module("nacl.bindings")\n            pwhash: Any = importlib.import_module("nacl.pwhash")\n        except Exception as exc:  # pragma: no cover - optional dependency\n            raise MemoryCryptoUnavailable("PyNaCl is required to create a recovery bundle") from exc\n''')
          replace(path,
              '''        try:\n            from nacl import bindings, pwhash\n        except Exception as exc:  # pragma: no cover\n            raise MemoryCryptoUnavailable("PyNaCl is required to open a recovery bundle") from exc\n''',
              '''        try:\n            bindings: Any = importlib.import_module("nacl.bindings")\n            pwhash: Any = importlib.import_module("nacl.pwhash")\n        except Exception as exc:  # pragma: no cover\n            raise MemoryCryptoUnavailable("PyNaCl is required to open a recovery bundle") from exc\n''')

          # Snapshot manifest parser narrows unknown JSON values before integer conversion.
          path = 'latka_jazn/memory/memory_sync_contracts.py'
          replace(path,
              '''            chunks.append(MemorySnapshotChunk(\n                object_id=str(item.get("object_id") or ""),\n                logical_path=str(item.get("logical_path") or ""),\n                chunk_index=int(item.get("chunk_index") if item.get("chunk_index") is not None else -1),\n''',
              '''            raw_chunk_index = item.get("chunk_index")\n            chunk_index = -1 if raw_chunk_index is None else int(raw_chunk_index)\n            chunks.append(MemorySnapshotChunk(\n                object_id=str(item.get("object_id") or ""),\n                logical_path=str(item.get("logical_path") or ""),\n                chunk_index=chunk_index,\n''')

          # Avoid a broad **dict that Pyright correctly treats as potentially binding truth_boundary.
          path = 'latka_jazn/memory/memory_sync_store.py'
          replace(path,
              '''            last_error=str(state["last_error"]) if state and state["last_error"] else None,\n            **counts,\n''',
              '''            last_error=str(state["last_error"]) if state and state["last_error"] else None,\n            outbox_pending=counts["outbox_pending"],\n            outbox_failed=counts["outbox_failed"],\n            inbox_pending=counts["inbox_pending"],\n            conflict_count=counts["conflict_count"],\n''')

          # Cursor movement requires an explicitly present remote sequence.
          path = 'latka_jazn/memory/memory_sync_worker.py'
          replace(path,
              '''                        "cursor_before": before,\n                        "cursor_after": store.sync_cursor().remote_seq if store.sync_cursor() else before,\n''',
              '''                        "cursor_before": before,\n                        "cursor_after": _cursor_remote_seq(store, fallback=before),\n''')
          replace(path,
              '''            cursor_now = store.sync_cursor().remote_seq if store.sync_cursor() else 0\n''',
              '''            cursor_now = _cursor_remote_seq(store, fallback=0)\n''')
          replace(path,
              '''        after = store.sync_cursor().remote_seq if store.sync_cursor() else before\n''',
              '''        after = _cursor_remote_seq(store, fallback=before)\n''')
          p = Path(path)
          text = p.read_text(encoding='utf-8')
          marker = '\n\nclass CloudMemorySyncWorker:'
          helper = '''\n\ndef _cursor_remote_seq(store: MemoryTierStore, *, fallback: int) -> int:\n    """Read one coherent sync-cursor snapshot without repeated Optional dereferences."""\n    cursor = store.sync_cursor()\n    return cursor.remote_seq if cursor is not None else int(fallback)\n'''
          if helper.strip() not in text:
              if marker not in text:
                  raise SystemExit('memory_sync_worker.py: class marker not found')
              text = text.replace(marker, helper + marker, 1)
              p.write_text(text, encoding='utf-8', newline='\n')
          PY
          python -X utf8 -m compileall -q latka_jazn tests main.py run.py
          git diff --check
      - name: Commit source fixes only
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latka_jazn/memory/memory_cloud_gateway.py \
                  latka_jazn/memory/memory_sync_crypto.py \
                  latka_jazn/memory/memory_sync_contracts.py \
                  latka_jazn/memory/memory_sync_store.py \
                  latka_jazn/memory/memory_sync_worker.py
          git commit -m "fix(memory): harden optional cloud typing boundaries"
          git push origin HEAD:upgrade/local-first-memory-cloud-v155-full
