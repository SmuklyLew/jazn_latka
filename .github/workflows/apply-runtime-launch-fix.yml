name: Apply runtime launch and integrity fix

on:
  push:
    branches:
      - fix/runtime-launch-no-venv-git-integrity
    paths:
      - .github/workflows/apply-runtime-launch-fix.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: windows-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize verified source payloads
        shell: pwsh
        run: python -X utf8 tools/_apply_runtime_launch_fix_payload.py

      - name: Install test runner
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run focused regressions
        shell: pwsh
        run: >-
          python -X utf8 -m pytest -q
          tests/test_package_integrity_canonical_worktree.py
          tests/test_cli_canonical_root.py
          tests/test_windows_launchers_contract.py

      - name: Commit materialized fix and remove one-shot staging
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md JAZN.cmd latka_jazn/cli.py latka_jazn/tools/package_integrity.py tests/test_package_integrity_canonical_worktree.py tests/test_cli_canonical_root.py tests/test_windows_launchers_contract.py
          git rm -r .github/runtime_fix_payload tools/_apply_runtime_launch_fix_payload.py .github/workflows/apply-runtime-launch-fix.yml
          git commit -m "Fix runtime launch without venv and batch Git integrity checks"
          git push origin HEAD:fix/runtime-launch-no-venv-git-integrity
