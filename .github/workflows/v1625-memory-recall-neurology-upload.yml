name: v16.2.5 memory recall neurology upload

on:
  push:
    branches:
      - 'fix/v16.2.5-memory-recall-neurology-hardening'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout upload branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: fix/v16.2.5-memory-recall-neurology-hardening

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Reconstruct and apply verified patch
        shell: bash
        run: |
          cat .github/.v1625-upload/payload.* > /tmp/v1625.patch
          echo "f878eabe44b08915cb1f6b388dc2f5d9cab2437a935e141ed7acd74dfdd9d1ad  /tmp/v1625.patch" | sha256sum -c -
          git apply --check /tmp/v1625.patch
          git apply /tmp/v1625.patch
          rm -rf .github/.v1625-upload
          rm -f .github/workflows/v1625-memory-recall-neurology-upload.yml
          git diff --check

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[memory-rebuild-ui]' pytest
          npm install --global pyright@1.1.411

      - name: Static type audit
        run: pyright latka_jazn main.py run.py

      - name: Compile Python
        run: python -X utf8 -m compileall -q latka_jazn tests main.py run.py

      - name: Run memory recall regression tests
        run: >-
          pytest -q
          tests/test_v1625_memory_recall_neurology_hardening.py
          tests/test_living_memory_gateway_recall.py
          tests/test_memory_recall_timeout_hardening.py
          tests/test_conversation_archive_routing_guard.py
          tests/test_chatgpt_mcp_two_phase_protocol.py
          tests/test_runtime_session_memory_status.py

      - name: Synchronize canonical release metadata
        run: >-
          python -X utf8 -m latka_jazn.tools.release_metadata_sync
          --root .
          --base-branch master
          --write
          --json

      - name: Commit verified v16.2.5 patch
        shell: bash
        run: |
          test ! -e .github/.v1625-upload
          test ! -e .github/workflows/v1625-memory-recall-neurology-upload.yml
          test ! -e .github/.v1625-type-audit-repair-trigger
          test ! -e .github/workflows/v1625-type-audit-repair.yml
          test ! -e sitecustomize.py
          grep -F 'DISTRIBUTION_VERSION = "16.2.5"' latka_jazn/version.py
          grep -F 'PACKAGE_RELEASE_NAME = "memory-recall-neurology-hardening"' latka_jazn/version.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden memory recall neurology v16.2.5'
          git push origin HEAD:fix/v16.2.5-memory-recall-neurology-hardening
