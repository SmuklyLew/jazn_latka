name: Jaźń GitHub OAuth staging build

on:
  push:
    branches:
      - "upgrade/**"
    paths:
      - ".github/workflows/jazn-github-oauth-staging.yml"
      - "deploy/chatgpt_mcp/workers_github_oauth/**"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/jazn-github-oauth-staging.yml"
      - "deploy/chatgpt_mcp/workers_github_oauth/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oauth_staging:
    name: OAuth Worker Node 24 build (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install exact tracked dependencies with npm ci
        working-directory: deploy/chatgpt_mcp/workers_github_oauth
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run OAuth helper tests
        working-directory: deploy/chatgpt_mcp/workers_github_oauth
        run: npm run check
      - name: Reject unsafe staging template before bundle build
        working-directory: deploy/chatgpt_mcp/workers_github_oauth
        run: npm run preflight:template
      - name: Compile and check Worker bundle without deploying
        working-directory: deploy/chatgpt_mcp/workers_github_oauth
        run: npx --no-install wrangler deploy --dry-run --outdir build-preview
      - name: Assert no tracked source changed
        run: |
          git diff --check
          git diff --exit-code
