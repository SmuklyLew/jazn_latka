name: Temporary Pyright audit

on:
  push:
    branches:
      - diagnostic/repair-all-bugs-pyright

permissions:
  contents: read

jobs:
  pyright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install project and Pyright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          npm install --global pyright
          pyright --version
      - name: Audit active Python source
        run: pyright latka_jazn main.py run.py
