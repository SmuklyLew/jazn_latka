name: Materialize Ollama CI regression fix

on:
  push:
    branches:
      - fix/ollama-chat-terminal-experience

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused regression fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import zlib
          source = Path('.github/patches/fix_ollama_ci_regressions.py.zlib.b64')
          target = Path('/tmp/fix_ollama_ci_regressions.py')
          target.write_bytes(zlib.decompress(base64.b64decode(source.read_text(encoding='utf-8'))))
          PY
          python -X utf8 /tmp/fix_ollama_ci_regressions.py

      - name: Focused structural verification
        shell: bash
        run: |
          python -m compileall -q latka_jazn/core/engine.py latka_jazn/core/runtime_session.py
          python -X utf8 - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path('latka_jazn/core/engine.py').read_text(encoding='utf-8'))
          node = next(n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef) and n.name == 'process_turn')
          size = node.end_lineno - node.lineno + 1
          assert size <= 713, size
          print({'process_turn_lines': size})
          PY

      - name: Remove one-shot materializer and commit source fix
        shell: bash
        run: |
          rm -f .github/patches/fix_ollama_ci_regressions.py.zlib.b64
          rm -f .github/workflows/materialize-ollama-ci-regression-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor Ollama turn helpers for CI compatibility"

      - name: Synchronize canonical release metadata
        run: >-
          python -X utf8 -m latka_jazn.tools.release_metadata_sync
          --root . --base-branch master --write --json

      - name: Commit metadata and publish final branch
        shell: bash
        run: |
          git diff --check
          git add PACKAGE_INTEGRITY_MANIFEST.json SOURCE_PROVENANCE.json
          git commit -m "release: resynchronize Ollama CI fix metadata [skip ci]"
          git push origin HEAD:fix/ollama-chat-terminal-experience
