name: v163255-verify-existing-payload
on:
  push:
    branches:
      - upgrade/v16.3.25.5-package-distribution-convergence
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Verify payload
        shell: bash
        run: |
          cat .jazn-bootstrap/v163255.patch.gz.b64.* > /tmp/p.b64
          base64 -d /tmp/p.b64 > /tmp/p.gz
          sha256sum /tmp/p.gz
          wc -c /tmp/p.gz /tmp/p.b64
