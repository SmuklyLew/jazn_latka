name: Temporary v16.3.25.3.3 package discovery final v3

on:
  push:
    branches:
      - fix/v16.3.25.3.3-chatgpt-package-discovery-bootstrap

permissions:
  contents: write

jobs:
  apply-validate-and-self-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/v16.3.25.3.3-chatgpt-package-discovery-bootstrap
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Apply corrected repair and compatibility adjustments
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          path = Path('.github/workflows/temporary-v1632533-package-discovery-fix-v4.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          marker = '      - name: Apply v2 guarded repair and correct generated indentation'
          start = lines.index(marker)
          run_at = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
          body = []
          for line in lines[run_at + 1:]:
              if line.startswith('      - name:'):
                  break
              body.append(line)
          script = textwrap.dedent('\n'.join(body)) + '\n'
          Path('/tmp/apply-v1632533-v4.sh').write_text(script, encoding='utf-8')
          subprocess.run(['bash', '/tmp/apply-v1632533-v4.sh'], check=True)

          split_path = Path('latka_jazn/packaging/split_zip_package.py')
          rows = split_path.read_text(encoding='utf-8').splitlines()
          idx = rows.index('    all_sidecar_names: set[str] = set()')
          if rows[idx + 1] != '    sidecar_names: set[str] = set()':
              raise SystemExit('sidecar compatibility block drifted')
          rows[idx:idx + 2] = [
              '    canonical_current_names = {',
              '        path.name[: -len(".package.json")]',
              '        for path in sorted(parts_dir.glob("*.zip.package.json"))',
              '    }',
              '    all_sidecar_names: set[str] = set(canonical_current_names)',
              '    sidecar_names: set[str] = set(canonical_current_names)',
          ]
          blocked_idx = rows.index('            blocked_sidecar_names.add(declared_name)', idx)
          rows.insert(blocked_idx + 1, '            sidecar_names.discard(declared_name)')
          split_path.write_text('\n'.join(rows) + '\n', encoding='utf-8')

          recovery_path = Path('latka_jazn/bootstrap/chatgpt_recovery.py')
          rows = recovery_path.read_text(encoding='utf-8').splitlines()
          runtime_idx = rows.index('    runtime_profiles = frozenset({"system", "combined", "unknown"})')
          try_idx = rows.index('    try:', runtime_idx)
          preflight_idx = rows.index('    preflight = runtime_preflight(destination)', try_idx)
          replacement = [
              '    try:',
              '        incoming_zip_name = infer_base_zip_name(',
              '            parts_dir,',
              '            base_zip_name,',
              '            allowed_profiles=runtime_profiles,',
              '        )',
              '    except FileNotFoundError as exc:',
              '        report["incoming_runtime_package"] = {"present": False, "reason": str(exc)}',
              '    except ValueError as exc:',
              '        report["incoming_runtime_package"] = {',
              '            "present": True,',
              '            "ambiguous": True,',
              '            "error": str(exc),',
              '        }',
              '        return RecoveryResult(',
              '            ok=False,',
              '            state="runtime_package_discovery_ambiguous",',
              '            active_root=str(destination),',
              '            report=report,',
              '            exit_code=8,',
              '        )',
              '    if incoming_zip_name is not None:',
              '        incoming_package_set = load_package_set_metadata(parts_dir, incoming_zip_name)',
              '        report["incoming_runtime_package"] = {',
              '            "present": True,',
              '            "base_zip_name": incoming_zip_name,',
              '            "package_set": incoming_package_set,',
              '        }',
              '',
          ]
          rows[try_idx:preflight_idx] = replacement
          recovery_path.write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY

      - name: Compile active Python
        run: python -m compileall -q latka_jazn tests main.py run.py

      - name: Run new package discovery regressions
        run: python -m pytest -q tests/test_v1632533_chatgpt_package_discovery_bootstrap.py

      - name: Run existing runtime package loader contract
        run: python -m pytest -q tests/test_runtime_package_loader_contract.py

      - name: Run related memory autoload regression
        run: python -m pytest -q tests/test_v1624_runtime_memory_autoload.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit validated source repair and clean temporary files
        shell: bash
        run: |
          git rm .github/workflows/temporary-v1632533-package-discovery-fix.yml
          git rm .github/workflows/temporary-v1632533-package-discovery-fix-v2.yml
          git rm .github/workflows/temporary-v1632533-package-discovery-diagnostic.yml
          git rm .github/workflows/temporary-v1632533-package-discovery-fix-v4.yml
          git rm .github/workflows/temporary-v1632533-existing-contract-diagnostic.yml
          git rm .github/workflows/temporary-v1632533-package-discovery-final.yml
          git rm .github/workflows/temporary-v1632533-package-discovery-final-v2.yml
          git rm .github/workflows/temporary-v1632533-package-discovery-final-v3.yml
          git rm .repair-v1632533-diagnostics.txt
          git rm .repair-v1632533-existing-contract.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latka_jazn/packaging/split_zip_package.py latka_jazn/bootstrap/chatgpt_recovery.py latka_jazn/version.py tests/test_v1632533_chatgpt_package_discovery_bootstrap.py
          git diff --cached --check
          git commit -m "fix: repair ChatGPT package discovery bootstrap"
          git push origin HEAD:fix/v16.3.25.3.3-chatgpt-package-discovery-bootstrap
