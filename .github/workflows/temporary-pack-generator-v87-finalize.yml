name: temporary-pack-generator-v87-finalize

on:
  push:
    branches:
      - upgrade/v16.3.25.3.4-pack-generator-v87-studio-portable-zip
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish-validated-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ github.token }}
      FINAL_BRANCH: pr/v16.3.25.3.4-pack-generator-v87-studio-portable-zip
      VALIDATED_RUN_ID: "33425362391"
    steps:
      - name: Checkout publisher source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: upgrade/v16.3.25.3.4-pack-generator-v87-studio-portable-zip

      - name: Download exact validated source artifact
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/validated-v87"
          mkdir -p "$RUNNER_TEMP/validated-v87"
          gh run download "$VALIDATED_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name pack-generator-v87-validated-source \
            --dir "$RUNNER_TEMP/validated-v87"

      - name: Verify validated file manifest
        shell: bash
        run: |
          python -X utf8 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, sys
          root = Path(os.environ['RUNNER_TEMP']) / 'validated-v87'
          manifest = root / 'VALIDATED_FILESET.json'
          payload = json.loads(manifest.read_text(encoding='utf-8'))
          if payload.get('schema') != 'jazn_pack_generator_v87_validated_files/v1':
              raise SystemExit('unexpected validated artifact schema')
          rows = payload.get('files') or []
          if len(rows) != 9:
              raise SystemExit(f'unexpected validated file count: {len(rows)}')
          for row in rows:
              path = root / str(row['path'])
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if len(data) != int(row['size']) or digest != str(row['sha256']):
                  raise SystemExit(f'validated artifact mismatch: {row["path"]}')
          print(f'validated artifact OK: {len(rows)} files')
          PY

      - name: Rebase publication tree onto current master
        shell: bash
        run: |
          git fetch origin master "$FINAL_BRANCH"
          git reset --hard origin/master
          python -X utf8 - <<'PY'
          from pathlib import Path
          import json, os, shutil
          source = Path(os.environ['RUNNER_TEMP']) / 'validated-v87'
          payload = json.loads((source / 'VALIDATED_FILESET.json').read_text(encoding='utf-8'))
          root = Path.cwd()
          for row in payload['files']:
              relative = Path(str(row['path']))
              target = root / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source / relative, target)
          PY
          git rm tests/test_jazn_pack_generator_two_file_bundle_v86.py

      - name: Verify exact clean publication diff
        shell: bash
        run: |
          git add \
            tools/jazn_pack_generator.py \
            latka_jazn/version.py \
            tests/test_independent_memory_package_contract_v2.py \
            tests/test_jazn_pack_generator_v82_contract.py \
            tests/test_jazn_pack_generator_v84_contract.py \
            tests/test_jazn_pack_generator_v16311_profiles.py \
            tests/test_jazn_pack_generator_two_file_bundle_v87.py \
            tests/test_jazn_pack_generator_v87_studio_portability.py \
            docs/runtime/JAZN_PACK_GENERATOR_V87_STUDIO_PORTABILITY.md
          git diff --cached --check
          python -X utf8 - <<'PY'
          from pathlib import Path
          import subprocess
          expected = {
              'docs/runtime/JAZN_PACK_GENERATOR_V87_STUDIO_PORTABILITY.md',
              'latka_jazn/version.py',
              'tests/test_independent_memory_package_contract_v2.py',
              'tests/test_jazn_pack_generator_two_file_bundle_v86.py',
              'tests/test_jazn_pack_generator_two_file_bundle_v87.py',
              'tests/test_jazn_pack_generator_v16311_profiles.py',
              'tests/test_jazn_pack_generator_v82_contract.py',
              'tests/test_jazn_pack_generator_v84_contract.py',
              'tests/test_jazn_pack_generator_v87_studio_portability.py',
              'tools/jazn_pack_generator.py',
          }
          output = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True)
          actual = {line.strip() for line in output.splitlines() if line.strip()}
          if actual != expected:
              raise SystemExit(f'unexpected publication diff: missing={sorted(expected-actual)}, extra={sorted(actual-expected)}')
          print('publication diff OK:', len(actual), 'paths')
          PY

      - name: Commit and publish PR branch
        shell: bash
        run: |
          git config user.name "SmuklyLew"
          git config user.email "smuklylew@gmail.com"
          git commit -m "upgrade: pack generator v8.7 Studio portable ZIP"
          git push origin "HEAD:$FINAL_BRANCH"
