name: temporary-pack-generator-v87-finalize

on:
  push:
    branches:
      - upgrade/v16.3.25.3.4-pack-generator-v87-studio-portable-zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: upgrade/v16.3.25.3.4-pack-generator-v87-studio-portable-zip

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[memory-rebuild-ui]" pytest
          npm install --global pyright@1.1.411

      - name: Align patcher with v8.6 public wrapper
        run: |
          python -X utf8 - <<'PY'
          from pathlib import Path
          path = Path('tools/_apply_pack_generator_v87.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('_bundle_Any', 'Any')
          text = text.replace('_bundle_Sequence', 'Sequence')
          text = text.replace('_bundle_Path', '_BundlePath')
          text = text.replace(
              'import unicodedata as _v87_unicodedata\nfrom dataclasses import replace as _v87_replace',
              'import unicodedata as _v87_unicodedata\nfrom typing import cast as _v87_cast\nfrom dataclasses import replace as _v87_replace',
          )
          text = text.replace(
              'def interoperability_profile(container_format: str, volume_format: str) -> dict[str, object]:',
              'def interoperability_profile(container_format: str, volume_format: str) -> dict[str, Any]:',
          )
          text = text.replace(
              'original_matrix(temp_dir, outputs, archive_format), archive_format',
              '_v87_cast(dict[str, Any], original_matrix(temp_dir, outputs, archive_format)), archive_format',
          )
          text = text.replace(
              'result = original_package_one(plan, options, base_zip_name)',
              'result = _v87_cast(Any, original_package_one(plan, options, base_zip_name))',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply v8.7 patch
        id: apply_patch
        continue-on-error: true
        shell: bash
        run: |
          python -X utf8 tools/_apply_pack_generator_v87.py > pack-v87-patch.log 2>&1
          code=$?
          cat pack-v87-patch.log
          exit "$code"

      - name: Upload patch diagnostic
        if: steps.apply_patch.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pack-v87-patch-diagnostic
          path: pack-v87-patch.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop after patch failure
        if: steps.apply_patch.outcome == 'failure'
        run: exit 1

      - name: Synchronize current generator identity guards
        run: |
          python -X utf8 - <<'PY'
          from pathlib import Path

          paths = (
              Path('tests/test_jazn_pack_generator_v82_contract.py'),
              Path('tests/test_jazn_pack_generator_v84_contract.py'),
              Path('tests/test_jazn_pack_generator_v16311_profiles.py'),
              Path('tests/test_independent_memory_package_contract_v2.py'),
          )
          replacements = (
              ('assert module.GENERATOR_VERSION == "8.6"', 'assert module.GENERATOR_VERSION == "8.7"'),
              ('assert module.SETTINGS_SCHEMA == "jazn_pack_generator_settings/v8.6"', 'assert module.SETTINGS_SCHEMA == "jazn_pack_generator_settings/v8.7"'),
              ('assert generator.GENERATOR_VERSION == "8.6"', 'assert generator.GENERATOR_VERSION == "8.7"'),
              ('assert generator.SETTINGS_SCHEMA == "jazn_pack_generator_settings/v8.6"', 'assert generator.SETTINGS_SCHEMA == "jazn_pack_generator_settings/v8.7"'),
          )
          for path in paths:
              text = path.read_text(encoding='utf-8')
              changed = False
              for old, new in replacements:
                  count = text.count(old)
                  if count > 1:
                      raise SystemExit(f'{path}: ambiguous identity guard {old!r}: {count}')
                  if count == 1:
                      text = text.replace(old, new, 1)
                      changed = True
              if not changed:
                  raise SystemExit(f'{path}: no v8.6 current-identity guard found')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Refresh editable package metadata after version bump
        run: python -m pip install -e ".[memory-rebuild-ui]"

      - name: Compile generator and regressions
        run: >-
          python -X utf8 -m compileall -q
          tools/jazn_pack_generator.py
          tests/test_jazn_pack_generator_two_file_bundle_v87.py
          tests/test_jazn_pack_generator_v87_studio_portability.py

      - name: Pyright generator
        id: pyright_generator
        continue-on-error: true
        shell: bash
        run: |
          pyright tools/jazn_pack_generator.py > pack-v87-pyright.log 2>&1
          code=$?
          cat pack-v87-pyright.log
          exit "$code"

      - name: Upload Pyright diagnostic
        if: steps.pyright_generator.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pack-v87-pyright-diagnostic
          path: pack-v87-pyright.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop after Pyright failure
        if: steps.pyright_generator.outcome == 'failure'
        run: exit 1

      - name: Focused generator suite
        run: >-
          python -X utf8 -m pytest -q -ra --tb=short
          tests/test_jazn_pack_generator_two_file_bundle_v87.py
          tests/test_jazn_pack_generator_v87_studio_portability.py
          tests/test_jazn_pack_generator_v82_contract.py
          tests/test_jazn_pack_generator_v82_dashboard.py
          tests/test_jazn_pack_generator_v84_contract.py
          tests/test_jazn_pack_generator_v16311_profiles.py
          tests/test_pack_generator_archive_io_v1638.py
          tests/test_package_generator_release_version.py
          tests/test_independent_memory_package_contract_v2.py

      - name: System package smoke
        run: python -X utf8 tools/jazn_pack_generator.py package-smoke --profile system

      - name: Full deterministic suite
        run: >-
          python -X utf8 -m pytest -q -ra --tb=short
          -m "not live_model and not live_mcp"

      - name: Diff check
        run: git diff --check

      - name: Commit validated source change
        shell: bash
        run: |
          git rm tools/_apply_pack_generator_v87.py .github/workflows/temporary-pack-generator-v87-finalize.yml
          rm -f pack-v87-patch.log pack-v87-pyright.log
          git config user.name "SmuklyLew"
          git config user.email "smuklylew@gmail.com"
          git add tools/jazn_pack_generator.py latka_jazn/version.py tests docs/runtime/JAZN_PACK_GENERATOR_V87_STUDIO_PORTABILITY.md
          git diff --cached --check
          git commit -m "upgrade: pack generator v8.7 Studio portable ZIP"
          git push origin HEAD:upgrade/v16.3.25.3.4-pack-generator-v87-studio-portable-zip
