name: host-spawn-memory-convergence

on:
  pull_request:
    branches:
      - master
    paths:
      - "latka_jazn/cli.py"
      - "latka_jazn/version.py"
      - "docs/runtime/CHATGPT_PROJECT_INSTRUCTIONS.txt"
      - "AGENTS.chatgpt.md"
      - "tests/test_chatgpt_project_bootstrap_primitive_convergence.py"
      - "docs/reports/JAZN_V16_3_25_5_90_0_CHATGPT_HOST_BOOTSTRAP_PRIMITIVE_CONVERGENCE.md"
      - "latka_jazn/bootstrap/chatgpt_host_preflight_parse.py"
      - "latka_jazn/core/chatgpt_host_executor_failure_codes.py"
      - "latka_jazn/core/chatgpt_host_executor_failure_policy.py"
      - "latka_jazn/core/chatgpt_host_executor_observation.py"
      - "latka_jazn/core/chatgpt_host_executor_aggregate_helpers.py"
      - "latka_jazn/core/host_spawn_diagnostics.py"
      - "latka_jazn/core/host_operation_retry.py"
      - "latka_jazn/core/host_operations.py"
      - "latka_jazn/memory/memory_root.py"
      - "latka_jazn/memory/sentinel_recall.py"
      - "tests/test_chatgpt_host_executor_failure_mapping.py"
      - "tests/test_host_spawn_diagnostics.py"
      - "tests/test_host_operation_memory_converge_retry.py"
      - "tests/test_memory_sentinel_recall.py"
      - "tests/test_autobiographical_memory_readiness_convergence.py"
      - ".github/workflows/host-spawn-memory-convergence.yml"
  push:
    branches:
      - master
      - "upgrade/**"
      - "fix/**"
      - "hotfix/**"
    paths:
      - "latka_jazn/cli.py"
      - "latka_jazn/version.py"
      - "docs/runtime/CHATGPT_PROJECT_INSTRUCTIONS.txt"
      - "AGENTS.chatgpt.md"
      - "tests/test_chatgpt_project_bootstrap_primitive_convergence.py"
      - "docs/reports/JAZN_V16_3_25_5_90_0_CHATGPT_HOST_BOOTSTRAP_PRIMITIVE_CONVERGENCE.md"
      - "latka_jazn/bootstrap/chatgpt_host_preflight_parse.py"
      - "latka_jazn/core/chatgpt_host_executor_failure_codes.py"
      - "latka_jazn/core/chatgpt_host_executor_failure_policy.py"
      - "latka_jazn/core/chatgpt_host_executor_observation.py"
      - "latka_jazn/core/chatgpt_host_executor_aggregate_helpers.py"
      - "latka_jazn/core/host_spawn_diagnostics.py"
      - "latka_jazn/core/host_operation_retry.py"
      - "latka_jazn/core/host_operations.py"
      - "latka_jazn/memory/memory_root.py"
      - "latka_jazn/memory/sentinel_recall.py"
      - "tests/test_chatgpt_host_executor_failure_mapping.py"
      - "tests/test_host_spawn_diagnostics.py"
      - "tests/test_host_operation_memory_converge_retry.py"
      - "tests/test_memory_sentinel_recall.py"
      - "tests/test_autobiographical_memory_readiness_convergence.py"
      - ".github/workflows/host-spawn-memory-convergence.yml"

permissions:
  contents: read

jobs:
  host_contract_matrix:
    name: host spawn contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      JAZN_ALLOW_NETWORK: "0"
      JAZN_NETWORK_TIME_FIRST: "0"
      JAZN_NETWORK_TIME_IN_TURN: "0"
      JAZN_MODEL_ADAPTER: "null"
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp-http]" pytest

      - name: Compile active host paths
        run: >-
          python -X utf8 -m compileall -q
          latka_jazn/bootstrap/chatgpt_host_preflight_parse.py
          latka_jazn/core/chatgpt_host_executor_failure_codes.py
          latka_jazn/core/chatgpt_host_executor_failure_policy.py
          latka_jazn/core/chatgpt_host_executor_observation.py
          latka_jazn/core/chatgpt_host_executor_aggregate_helpers.py
          latka_jazn/core/host_spawn_diagnostics.py
          latka_jazn/core/host_operation_retry.py
          latka_jazn/core/host_operations.py
          latka_jazn/memory/memory_root.py
          latka_jazn/memory/sentinel_recall.py
          latka_jazn/cli.py

      - name: Host spawn, memory root, and sentinel regression matrix
        run: >-
          python -X utf8 -m pytest
          -q -ra --tb=short
          tests/test_chatgpt_host_executor_failure_mapping.py
          tests/test_chatgpt_host_runtime_observability.py
          tests/test_chatgpt_host_discovery_evidence_reporting.py
          tests/test_host_spawn_diagnostics.py
          tests/test_host_operation_memory_converge_retry.py
          tests/test_host_operations.py
          tests/test_autobiographical_memory_readiness_convergence.py
          tests/test_memory_sentinel_recall.py
          tests/test_chatgpt_project_bootstrap_primitive_convergence.py

      - name: Exercise post-spawn CLI diagnostics
        run: python -X utf8 run.py host-diagnose --root . --json

      - name: Verify release identity
        run: >-
          python -X utf8 -c
          "import subprocess, sys;
          from importlib.metadata import version as installed_version;
          from latka_jazn.version import DISTRIBUTION_VERSION, PACKAGE_VERSION, PACKAGE_VERSION_FULL;
          assert installed_version('latka-jazn') == DISTRIBUTION_VERSION == PACKAGE_VERSION;
          observed = subprocess.check_output([sys.executable, '-X', 'utf8', 'run.py', '--version'], text=True).strip();
          assert observed == PACKAGE_VERSION_FULL;
          print(PACKAGE_VERSION_FULL)"

      - name: Clean checkout guard
        if: always()
        shell: bash
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  docker_bind_mount_contract:
    name: docker bind mount truth boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Docker availability
        run: docker version

      - name: Verify RW, RO, missing-source, and UID/GID behavior
        shell: bash
        run: |
          set -euo pipefail
          image="alpine:3.20"
          docker pull "$image"

          rw="$RUNNER_TEMP/jazn-memory-rw"
          ro="$RUNNER_TEMP/jazn-memory-ro"
          denied="$RUNNER_TEMP/jazn-memory-denied"
          missing="$RUNNER_TEMP/jazn-memory-missing"
          mkdir -p "$rw" "$ro" "$denied"
          chmod 700 "$denied"

          docker run --rm             --mount "type=bind,src=$rw,dst=/memory"             "$image" sh -lc 'touch /memory/rw-ok && test -w /memory'

          if docker run --rm             --mount "type=bind,src=$ro,dst=/memory,readonly"             "$image" sh -lc 'touch /memory/should-fail'; then
            echo "read-only bind mount unexpectedly accepted a write" >&2
            exit 1
          fi

          if docker run --rm             --mount "type=bind,src=$missing,dst=/memory"             "$image" true; then
            echo "missing bind source unexpectedly succeeded" >&2
            exit 1
          fi

          if docker run --rm             --user 65534:65534             --mount "type=bind,src=$denied,dst=/memory"             "$image" sh -lc 'touch /memory/should-fail'; then
            echo "UID/GID mismatch unexpectedly accepted a write" >&2
            exit 1
          fi
