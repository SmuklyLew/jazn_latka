name: memory-rebuild-v24-windows

on:
  push:
    branches:
      - master
    paths:
      - "tools/memory_rebuild.py"
      - "tools/memory_rebuild_legacy_v24.py"
      - "latka_jazn/tools/memory_rebuild_app/**"
      - "tests/test_memory_rebuild_v24_*.py"
      - "tests/test_memory_desktop_*.py"
      - ".github/workflows/memory-rebuild-v24-windows.yml"
  pull_request:
    branches:
      - master
    paths:
      - "tools/memory_rebuild.py"
      - "tools/memory_rebuild_legacy_v24.py"
      - "latka_jazn/tools/memory_rebuild_app/**"
      - "tests/test_memory_rebuild_v24_*.py"
      - "tests/test_memory_desktop_*.py"
      - ".github/workflows/memory-rebuild-v24-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Windows Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile Memory Rebuild v2.4
        shell: pwsh
        run: >-
          python -X utf8 -m compileall -q
          latka_jazn/tools/memory_rebuild_app
          tools/memory_rebuild.py
          tools/memory_rebuild_legacy_v24.py
          tests/test_memory_rebuild_v24_unified.py
          tests/test_memory_rebuild_v24_cli.py
          tests/test_memory_rebuild_v24_windows_handles.py
          tests/test_memory_rebuild_v24_studio_reconstruction.py
          tests/test_memory_desktop_workspace.py
          tests/test_memory_desktop_gui_smoke.py
          tests/test_memory_desktop_actions.py
          tests/test_memory_desktop_actions_windows.py

      - name: Run Memory Rebuild v2.4 tests
        shell: pwsh
        run: >-
          python -X utf8 -m pytest
          -q -ra --tb=short
          tests/test_memory_rebuild_v24_unified.py
          tests/test_memory_rebuild_v24_cli.py
          tests/test_memory_rebuild_v24_windows_handles.py
          tests/test_memory_rebuild_v24_studio_reconstruction.py
          tests/test_memory_desktop_workspace.py
          tests/test_memory_desktop_gui_smoke.py
          tests/test_memory_desktop_actions.py
          tests/test_memory_desktop_actions_windows.py

      - name: Clean checkout guard
        if: always()
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dirty = @(git status --porcelain --untracked-files=all)
          if ($dirty.Count -gt 0) {
            $dirty | ForEach-Object { Write-Host $_ }
            throw "Tests left tracked or untracked files in the checkout."
          }

  package-windows:
    name: Build and smoke-test real Windows EXE
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install -e . pyinstaller

      - name: Build one-folder EXE
        shell: pwsh
        run: ./tools/windows/build_memory_studio.ps1

      - name: Run compiled EXE away from repository cwd
        shell: pwsh
        run: |
          $exe = (Resolve-Path "./dist/JaznMemoryStudio/JaznMemoryStudio.exe").Path
          $env:JAZN_ROOT = (Resolve-Path ".").Path
          # A --windowed EXE is a GUI process: pwsh's $LASTEXITCODE may be
          # unset even after the EXE succeeded. Wait explicitly and inspect
          # the actual process exit code to avoid false CI failures/successes.
          $process = Start-Process -FilePath $exe -ArgumentList @("--smoke") -WorkingDirectory $env:RUNNER_TEMP -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Compiled EXE smoke failed with exit code $($process.ExitCode)"
          }

      - name: Publish tested Windows EXE folder
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: JaznMemoryStudio-Windows-Python312
          path: dist/JaznMemoryStudio/
          if-no-files-found: error
