name: memory-rebuild-v24-windows

on:
  push:
    branches:
      - master
    paths:
      - "tools/memory_rebuild.py"
      - "tools/memory_rebuild_legacy_v24.py"
      - "latka_jazn/tools/memory_rebuild_app/**"
      - "tests/test_memory_rebuild_v24_*.py"
      - ".github/workflows/memory-rebuild-v24-windows.yml"
  pull_request:
    branches:
      - master
    paths:
      - "tools/memory_rebuild.py"
      - "tools/memory_rebuild_legacy_v24.py"
      - "latka_jazn/tools/memory_rebuild_app/**"
      - "tests/test_memory_rebuild_v24_*.py"
      - ".github/workflows/memory-rebuild-v24-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Windows Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile Memory Rebuild v2.4
        shell: pwsh
        run: >-
          python -X utf8 -m compileall -q
          latka_jazn/tools/memory_rebuild_app
          tools/memory_rebuild.py
          tools/memory_rebuild_legacy_v24.py
          tests/test_memory_rebuild_v24_unified.py
          tests/test_memory_rebuild_v24_cli.py
          tests/test_memory_rebuild_v24_windows_handles.py

      - name: Run Memory Rebuild v2.4 tests
        shell: pwsh
        run: >-
          python -X utf8 -m pytest
          -q -ra --tb=short
          tests/test_memory_rebuild_v24_unified.py
          tests/test_memory_rebuild_v24_cli.py
          tests/test_memory_rebuild_v24_windows_handles.py

      - name: Clean checkout guard
        if: always()
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dirty = @(git status --porcelain --untracked-files=all)
          if ($dirty.Count -gt 0) {
            $dirty | ForEach-Object { Write-Host $_ }
            throw "Tests left tracked or untracked files in the checkout."
          }
