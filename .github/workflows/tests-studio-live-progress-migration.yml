name: Test Studio live progress migration

on:
  push:
    branches:
      - fix/v16.3.25.5.68-tests-studio-live-progress

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[live-progress-final]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
          ref: fix/v16.3.25.5.68-tests-studio-live-progress
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.12'
      - name: Install test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Apply Test Studio live-progress patch
        run: python -X utf8 tools/jazn_tests_studio/apply_live_progress_patch.py
      - name: Compile Studio surfaces
        run: |
          python -m py_compile tools/jazn_tests_studio.py
          python -m py_compile tools/jazn_tests_studio/progress_plugin.py
      - name: Test streaming engine
        run: python -X utf8 tools/jazn_tests_studio.py self-test
      - name: Audit GitHub Actions pins
        run: python -X utf8 tools/github_actions_node24_audit.py --root . --json
      - name: Test governance
        run: python -m pytest -q tests/test_test_suite_governance.py
      - name: Collect active suite
        run: python -m pytest --collect-only -q tests --ignore=tests/archive
      - name: Commit final Studio implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/jazn_tests_studio.py
          git rm tools/jazn_tests_studio/apply_live_progress_patch.py
          if git diff --cached --quiet; then
            echo 'No materialized Studio changes to commit.'
            exit 0
          fi
          git commit -m 'fix: stream Test Studio progress and keep Tk responsive [live-progress-final]'
          git push origin HEAD:fix/v16.3.25.5.68-tests-studio-live-progress
