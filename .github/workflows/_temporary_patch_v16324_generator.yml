name: temporary-v16324-generator-source-fix

on:
  push:
    branches:
      - upgrade/v16.3.24-package-provenance-bootstrap-hardening

permissions:
  contents: write

jobs:
  patch-generator:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: upgrade/v16.3.24-package-provenance-bootstrap-hardening

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Apply exact bundled-generator fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/jazn_pack_generator.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'def _ensure_package(name: str) -> types.ModuleType:',
                  'def _ensure_package(name: str) -> _bundle_types.ModuleType:',
              ),
              (
                  'def _load_bundled_module(name: str, *, package: bool = False) -> types.ModuleType:',
                  'def _load_bundled_module(name: str, *, package: bool = False) -> _bundle_types.ModuleType:',
              ),
              (
                  'from tools import _jazn_pack_generator_memory_v2 as _impl\n'
                  'from tools._jazn_pack_generator_v1601_policy import apply as _apply_v1601_policy\n'
                  'from tools._jazn_pack_generator_v1638_archive_io import apply as _apply_v1638_archive_io\n'
                  'from tools._jazn_pack_generator_v16311_profiles import apply as _apply_v16311_profiles',
                  '_impl: Any = _load_bundled_module("tools._jazn_pack_generator_memory_v2")\n'
                  '_apply_v1601_policy: Any = getattr(\n'
                  '    _load_bundled_module("tools._jazn_pack_generator_v1601_policy"), "apply"\n'
                  ')\n'
                  '_apply_v1638_archive_io: Any = getattr(\n'
                  '    _load_bundled_module("tools._jazn_pack_generator_v1638_archive_io"), "apply"\n'
                  ')\n'
                  '_apply_v16311_profiles: Any = getattr(\n'
                  '    _load_bundled_module("tools._jazn_pack_generator_v16311_profiles"), "apply"\n'
                  ')',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one replacement target, got {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Verify syntax and bundled import
        run: |
          python -m py_compile tools/jazn_pack_generator.py
          python -X utf8 -c "import tools.jazn_pack_generator as g; assert g.GENERATOR_VERSION == '8.6'; print(g.GENERATOR_VERSION)"

      - name: Verify Pyright contract
        run: |
          npm install --global pyright@1.1.411
          pyright tools/jazn_pack_generator.py

      - name: Commit source fix and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/_temporary_patch_v16324_generator.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/jazn_pack_generator.py
          git diff --cached --check
          git commit -m "fix(v8.6): type bundled generator without legacy helper imports"
          git push origin HEAD:upgrade/v16.3.24-package-provenance-bootstrap-hardening
