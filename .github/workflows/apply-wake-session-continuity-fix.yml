name: Apply wake/session continuity fix

on:
  push:
    branches:
      - fix/wake-session-continuity-decoupling
    paths:
      - .github/workflows/apply-wake-session-continuity-fix.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/wake-session-continuity-decoupling
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Apply guarded source patch
        run: python -X utf8 .github/scripts/apply_wake_session_continuity_fix.py

      - name: Compile
        run: python -X utf8 -m compileall -q latka_jazn tests main.py run.py

      - name: Run continuity regression suite
        run: >-
          python -X utf8 -m pytest -q
          tests/test_wake_session_continuity_decoupling.py
          tests/test_runtime_session_restart_continuity.py
          tests/test_host_finalized_session_continuity_v154.py
          tests/test_dialogue_task_state_v154.py

      - name: Run wake-state compatibility checks
        run: >-
          python -X utf8 -m pytest -q tests/test_runtime_stability_wake_state.py
          -k 'prepare_builds_verified_snapshot_and_is_idempotent or source_change_requires_new_run or runtime_bridge_rejects_snapshot_when_source_run_coverage_is_tampered or runtime_bridge_rejects_snapshot_after_canonical_source_changes or full_prepare_after_partial_run_recovers_complete_coverage'

      - name: Remove one-shot patch machinery
        run: |
          rm .github/scripts/apply_wake_session_continuity_fix.py
          rm .github/workflows/apply-wake-session-continuity-fix.yml

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix wake/session continuity decoupling"
          git push origin HEAD:fix/wake-session-continuity-decoupling
