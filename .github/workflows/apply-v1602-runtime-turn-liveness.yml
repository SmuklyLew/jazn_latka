name: apply-v1603-runtime-turn-liveness-ci-hardening

on:
  push:
    branches:
      - fix/v16.0.2-runtime-turn-liveness

permissions:
  contents: write

concurrency:
  group: apply-v1603-runtime-turn-liveness-ci-hardening
  cancel-in-progress: false

jobs:
  apply_verified_patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      V1602_B64_SHA256: 2dc20bad7d2b46b391247f5689f9f7d8047054ff8645438cd63a4ab04c245606
      V1602_GZIP_SHA256: 40d9c194e23a661aa424528dd9fc3ff28785c04e3e9bbd228cfbc2cde36e9ff5
      V1602_PATCH_SHA256: 23f89cf8adee86aece7db87c4211c24e29612a9c2314787f74d6876af3426f8c
      V1603_B64_SHA256: 68fce6ed37a2938263dc5e519f62c04ffca36ff61af8adc167c05eaf12d07e27
      V1603_GZIP_SHA256: 3814c628df612e9d2d90ef0fa742b8e803b1de1694579ac2935088fc8b180d3a
      V1603_PATCH_SHA256: 51bc0fe755f1539217fdf462b3d0cbcc9c678ba83fac7873448ffc4f4e2f14e2
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: fix/v16.0.2-runtime-turn-liveness

      - name: Reconstruct and verify v16.0.2 payload
        shell: bash
        run: |
          set -euo pipefail
          cat .jazn_upgrade_transport/v1602-runtime-turn-liveness/chunk-* > "$RUNNER_TEMP/v1602.b64"
          echo "${V1602_B64_SHA256}  $RUNNER_TEMP/v1602.b64" | sha256sum --check --strict
          base64 --decode "$RUNNER_TEMP/v1602.b64" > "$RUNNER_TEMP/v1602.patch.gz"
          gzip -t "$RUNNER_TEMP/v1602.patch.gz"
          echo "${V1602_GZIP_SHA256}  $RUNNER_TEMP/v1602.patch.gz" | sha256sum --check --strict
          gzip --decompress --stdout "$RUNNER_TEMP/v1602.patch.gz" > "$RUNNER_TEMP/v1602.patch"
          echo "${V1602_PATCH_SHA256}  $RUNNER_TEMP/v1602.patch" | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/v1602.patch"

      - name: Reconstruct and verify v16.0.3 CI hardening delta
        shell: bash
        run: |
          set -euo pipefail
          cp .jazn_upgrade_transport/v1603-runtime-turn-liveness-ci-hardening/patch.gz.b64 "$RUNNER_TEMP/v1603.b64"
          echo "${V1603_B64_SHA256}  $RUNNER_TEMP/v1603.b64" | sha256sum --check --strict
          base64 --decode "$RUNNER_TEMP/v1603.b64" > "$RUNNER_TEMP/v1603.patch.gz"
          gzip -t "$RUNNER_TEMP/v1603.patch.gz"
          echo "${V1603_GZIP_SHA256}  $RUNNER_TEMP/v1603.patch.gz" | sha256sum --check --strict
          gzip --decompress --stdout "$RUNNER_TEMP/v1603.patch.gz" > "$RUNNER_TEMP/v1603.patch"
          echo "${V1603_PATCH_SHA256}  $RUNNER_TEMP/v1603.patch" | sha256sum --check --strict

      - name: Materialize complete runtime update and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git apply "$RUNNER_TEMP/v1602.patch"
          git apply --check "$RUNNER_TEMP/v1603.patch"
          git apply "$RUNNER_TEMP/v1603.patch"
          git rm -rf .jazn_upgrade_transport/v1602-runtime-turn-liveness
          git rm -rf .jazn_upgrade_transport/v1603-runtime-turn-liveness-ci-hardening
          git rm -f .github/workflows/apply-v1602-runtime-turn-liveness.yml
          python -X utf8 -m compileall -q latka_jazn tests main.py run.py
          git diff --check

      - name: Commit verified materialization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(runtime): materialize v16.0.3 turn liveness CI hardening"
          git fetch origin fix/v16.0.2-runtime-turn-liveness
          git rebase origin/fix/v16.0.2-runtime-turn-liveness
          git push origin HEAD:fix/v16.0.2-runtime-turn-liveness
