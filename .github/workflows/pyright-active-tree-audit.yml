name: pyright-active-tree-audit

on:
  push:
    branches:
      - fix/checkpoint-2026-09-04-master-corrected-pylance-pyright-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full_pyright_1_1_411:
    name: full active-tree Pyright 1.1.411
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Set up Node.js for pinned Pyright
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install project and exact Pyright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[memory-rebuild-ui]" pytest
          npm install --global pyright@1.1.411
          python -m pip check

      - name: Verify exact Pyright version
        shell: bash
        run: |
          set -euo pipefail
          pyright --version
          test "$(pyright --version | awk '{print $2}')" = "1.1.411"

      - name: Run canonical active-tree Pyright audit
        shell: bash
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/pyright-active-tree.json"
          set +e
          pyright --project pyrightconfig.json --outputjson > "$report"
          rc=$?
          set -e
          cat "$report"
          python - "$report" <<'PY'
          import json
          from pathlib import Path
          import sys

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          summary = report.get("summary") or {}
          print(
              "PYRIGHT_SUMMARY "
              f"filesAnalyzed={summary.get('filesAnalyzed')} "
              f"errors={summary.get('errorCount')} "
              f"warnings={summary.get('warningCount')} "
              f"information={summary.get('informationCount')}"
          )
          PY
          exit "$rc"

      - name: Upload complete Pyright diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pyright-active-tree-1.1.411
          path: ${{ runner.temp }}/pyright-active-tree.json
          if-no-files-found: error
          retention-days: 7
