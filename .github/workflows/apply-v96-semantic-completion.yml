name: Apply v96 semantic routing completion

on:
  push:
    branches:
      - fix/semantic-routing-completion-v96
    paths:
      - .github/update_scripts/apply_v96_semantic_completion.py
      - .github/workflows/apply-v96-semantic-completion.yml

permissions:
  contents: write

jobs:
  apply-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply deterministic transformation
        run: python -X utf8 .github/update_scripts/apply_v96_semantic_completion.py

      - name: Normalize generated sources
        run: |
          python -X utf8 - <<'PY'
          from pathlib import Path

          handler_path = Path("latka_jazn/core/handlers/post_update_coverage_audit_handler.py")
          handler_text = handler_path.read_text(encoding="utf-8")
          broken_newline = '            "\n".join(lines),'
          fixed_newline = '            "\\n".join(lines),'
          if broken_newline not in handler_text:
              raise SystemExit("expected generated newline literal was not found")
          handler_path.write_text(handler_text.replace(broken_newline, fixed_newline, 1), encoding="utf-8")

          tool_path = Path("latka_jazn/core/handlers/external_tool_assistance_handler.py")
          tool_text = tool_path.read_text(encoding="utf-8")
          old_tool = "\n".join([
              '        report = ctx.get("dialogue_intent_report") if isinstance(ctx.get("dialogue_intent_report"), dict) else {}',
              '        tool_context = report.get("external_tool_context") if isinstance(report.get("external_tool_context"), dict) else {}',
              '        tools = [str(item) for item in tool_context.get("requested_tools", [])]',
              '',
          ])
          new_tool = "\n".join([
              '        report_value = ctx.get("dialogue_intent_report")',
              '        report: dict[str, Any] = report_value if isinstance(report_value, dict) else {}',
              '        tool_context_value = report.get("external_tool_context")',
              '        tool_context: dict[str, Any] = tool_context_value if isinstance(tool_context_value, dict) else {}',
              '        tools = [str(item) for item in tool_context.get("requested_tools", [])]',
              '',
          ])
          if old_tool not in tool_text:
              raise SystemExit("expected external-tool narrowing anchor was not found")
          tool_path.write_text(tool_text.replace(old_tool, new_tool, 1), encoding="utf-8")

          finalize_path = Path("latka_jazn/mcp/tools/jazn_finalize_reply.py")
          finalize_text = finalize_path.read_text(encoding="utf-8")
          old_finalize = "        bridge = presentation.get('chatgpt_host_bridge') if isinstance(presentation.get('chatgpt_host_bridge'), dict) else {}\n"
          new_finalize = "        bridge_value = presentation.get('chatgpt_host_bridge')\n        bridge: dict[str, Any] = bridge_value if isinstance(bridge_value, dict) else {}\n"
          if old_finalize not in finalize_text:
              raise SystemExit("expected finalizer narrowing anchor was not found")
          finalize_path.write_text(finalize_text.replace(old_finalize, new_finalize, 1), encoding="utf-8")
          PY

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[memory-rebuild-ui]" pytest
          npm install --global pyright@1.1.411

      - name: Compile and type-check changed runtime
        run: |
          python -X utf8 -m compileall -q latka_jazn tests main.py run.py
          pyright latka_jazn main.py run.py

      - name: Run focused regression and independent semantic audit
        run: |
          python -X utf8 -m pytest -q \
            tests/test_semantic_routing_completion_v96.py \
            tests/test_chatgpt_mcp_end_to_end_v96.py \
            tests/test_voice_continuity_neuro_routing.py \
            tests/test_chatgpt_host_contract_hardening.py
          python -X utf8 -m latka_jazn.tools.semantic_route_audit --root . --json
          git diff --check

      - name: Remove staging machinery
        run: |
          rm -rf .github/update_scripts
          rm -f .github/workflows/apply-v96-semantic-completion.yml

      - name: Commit verified update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(runtime): complete semantic routing and bounded host regeneration'
          git push origin HEAD
