name: apply-master-release-metadata-auto-sync

on:
  push:
    branches:
      - fix/master-release-metadata-auto-sync

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: fix/master-release-metadata-auto-sync

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495e4e4022e16d87065
        with:
          python-version: "3.14"

      - name: Apply exact workflow transformation
        run: python -X utf8 tools/apply_master_release_metadata_auto_sync.py

      - name: Remove one-shot materializer
        shell: bash
        run: |
          rm tools/apply_master_release_metadata_auto_sync.py
          rm .github/workflows/apply-master-release-metadata-auto-sync.yml

      - name: Commit workflow fix on a clean source commit
        shell: bash
        run: |
          git config user.name "SmuklyLew"
          git config user.email "216485861+SmuklyLew@users.noreply.github.com"
          git add \
            .github/workflows/release-hardening.yml \
            .github/workflows/release-metadata-sync.yml
          git add -u \
            tools/apply_master_release_metadata_auto_sync.py \
            .github/workflows/apply-master-release-metadata-auto-sync.yml
          git diff --cached --check
          git commit -m "ci: auto-synchronize release metadata on master"

      - name: Normalize origin and synchronize canonical metadata
        shell: bash
        run: |
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          python -X utf8 -m latka_jazn.tools.release_metadata_sync \
            --root . --base-branch master --write --json

      - name: Verify final metadata-only diff
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            PACKAGE_INTEGRITY_MANIFEST.json \
            SOURCE_PROVENANCE.json | sort)"
          test "$changed" = "$expected"
          grep -F 'master|update/*|tools/upgrade-*|hotfix/*|upgrade/*|fix/*)' \
            .github/workflows/release-hardening.yml
          grep -F 'master|update/*|tools/upgrade-*|hotfix/*|upgrade/*|fix/*)' \
            .github/workflows/release-metadata-sync.yml
          grep -F '[skip ci]' .github/workflows/release-hardening.yml
          grep -F '[skip ci]' .github/workflows/release-metadata-sync.yml
          python -X utf8 -m latka_jazn.tools.release_metadata_sync \
            --root . --base-branch master --check --json

      - name: Commit metadata and publish clean branch
        shell: bash
        run: |
          git add \
            PACKAGE_INTEGRITY_MANIFEST.json \
            SOURCE_PROVENANCE.json
          git commit -m "release: synchronize canonical metadata after workflow cleanup"
          git push origin HEAD:fix/master-release-metadata-auto-sync
