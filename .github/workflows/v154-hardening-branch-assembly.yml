name: v154 hardening branch assembly

on:
  push:
    branches:
      - fix/v154-runtime-resilience-neuro-hardening-20260810

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify exact hardening patch
        shell: bash
        run: |
          set -euo pipefail
          cat .jazn-bootstrap/v154-hardening.patch.* > /tmp/v154-hardening.patch
          echo "514cc2c1aa1936b9227f475ff0346e0e48c1482c7cde33a37bb89ac486c85e61  /tmp/v154-hardening.patch" | sha256sum -c -
          git apply --check /tmp/v154-hardening.patch
          git apply --index /tmp/v154-hardening.patch
          git diff --cached --check

      - name: Commit exact source changes to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "harden v15.4 runtime resilience, cancellation, and routing"
          git push origin HEAD:fix/v154-runtime-resilience-neuro-hardening-20260810
