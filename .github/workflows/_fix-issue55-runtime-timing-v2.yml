name: fix-issue55-runtime-timing-v2

on:
  push:
    branches:
      - fix/windows-turn-atomicity-deterministic-sync

permissions:
  contents: write

concurrency:
  group: fix-issue55-runtime-timing-v2
  cancel-in-progress: false

jobs:
  apply_runtime_timing_hardening:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: fix/windows-turn-atomicity-deterministic-sync

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Extract and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/_fix-issue55-runtime-timing.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if "cat > /tmp/issue55-runtime.patch <<'PATCH'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PATCH')
          patch_lines = []
          for line in source[start:end]:
              patch_lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/issue55-runtime.patch').write_text('\n'.join(patch_lines) + '\n', encoding='utf-8')
          PY
          git apply --check /tmp/issue55-runtime.patch
          git apply /tmp/issue55-runtime.patch
          python -X utf8 -m compileall -q tests/test_runtime_stability_daemon_status.py
          python -X utf8 -m pytest -q -ra --tb=short \
            tests/test_release_workflow_hardening.py \
            tests/test_turn_atomicity.py \
            tests/test_turn_timeout_audit_nonblocking.py \
            tests/test_runtime_stability_daemon_status.py
          git diff --check

      - name: Commit source hardening only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_runtime_stability_daemon_status.py
          git commit -m "test(daemon): make timeout synchronization deterministic"
          git push origin HEAD:fix/windows-turn-atomicity-deterministic-sync
