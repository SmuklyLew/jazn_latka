name: v163255-scaffold-probe

on:
  push:
    branches:
      - tmp/v163255-gitdata-probe-2

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Snapshot scaffold tree
        shell: bash
        run: |
          git archive --format=tar HEAD > v163255-scaffold.tar
          sha256sum v163255-scaffold.tar > v163255-scaffold.tar.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v163255-scaffold-snapshot
          path: |
            v163255-scaffold.tar
            v163255-scaffold.tar.sha256
          if-no-files-found: error
          retention-days: 1
