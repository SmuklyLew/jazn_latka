name: package-distribution-cleanroom

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, 'upgrade/v16.3.25.5-package-distribution-convergence', 'upgrade/v16.3.25.5-package-distribution-convergence-final', 'upgrade/package-generator-v10.1.86.0-rewrite']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency_artifact:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x64
            python: "3.12"
          - runner: windows-latest
            target: windows-x64
            python: "3.13"
          - runner: windows-latest
            target: windows-x64
            python: "3.14"
          - runner: ubuntu-latest
            target: linux-x64
            python: "3.12"
          - runner: ubuntu-latest
            target: linux-x64
            python: "3.13"
          - runner: ubuntu-latest
            target: linux-x64
            python: "3.14"
    uses: ./.github/workflows/dependency-artifacts.yml
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      python-version: ${{ matrix.python }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

  cross_target_lock_replay:
    name: replay ${{ matrix.target }} py${{ matrix.python }} lock on ${{ matrix.runner }}
    needs: dependency_artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: linux-x64
            python: "3.12"
          - runner: windows-latest
            target: linux-x64
            python: "3.13"
          - runner: windows-latest
            target: linux-x64
            python: "3.14"
          - runner: ubuntu-latest
            target: windows-x64
            python: "3.12"
          - runner: ubuntu-latest
            target: windows-x64
            python: "3.13"
          - runner: ubuntu-latest
            target: windows-x64
            python: "3.14"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up replay Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependency tooling
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Download native target evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: jazn-package-${{ matrix.target }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/native-evidence

      - name: Replay canonical lock for the foreign target
        shell: bash
        run: |
          set -euo pipefail
          py_digits="${{ matrix.python }}"
          py_digits="${py_digits//./}"
          lock="$RUNNER_TEMP/native-evidence/locks/core+archive/${{ matrix.target }}-py${py_digits}.txt"
          test -f "$lock"
          result="$RUNNER_TEMP/cross-target-download.json"
          set +e
          python -X utf8 -m latka_jazn.tools.dependency_studio \
            --root . --wheelhouse-root "$RUNNER_TEMP/cross-target-wheelhouse" --json \
            download --profile core --profile archive \
            --python-version "${{ matrix.python }}" --platform "${{ matrix.target }}" \
            --lock-file "$lock" > "$result"
          download_rc=$?
          set -e
          cat "$result"
          test "$download_rc" -eq 0
          bundle_dir="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["bundle_dir"])' "$result")"
          python -X utf8 -m latka_jazn.tools.dependency_studio \
            --root . --json verify --bundle "$bundle_dir"
          cmp "$lock" "$bundle_dir/JAZN_WHEELHOUSE_REQUIREMENTS.txt"

          sidecar="$(find "$RUNNER_TEMP/native-evidence" -maxdepth 1 -type f -name '*.dependencies-*.zip' -print -quit)"
          test -n "$sidecar"
          python - "$sidecar" "$bundle_dir" <<'PY'
          import json
          from pathlib import Path
          import sys
          import zipfile

          sidecar = Path(sys.argv[1])
          replay = json.loads((Path(sys.argv[2]) / "JAZN_WHEELHOUSE_MANIFEST.json").read_text(encoding="utf-8"))
          with zipfile.ZipFile(sidecar) as archive:
              native = json.loads(archive.read("JAZN_WHEELHOUSE_MANIFEST.json").decode("utf-8"))

          def inventory(manifest):
              return [
                  (row["name"], row["version"], row["filename"], row["sha256"])
                  for row in manifest.get("resolved_distributions", [])
              ]

          assert replay["materialization_mode"] == "cross-target-locked", replay
          assert replay["target"] == native["target"], (replay["target"], native["target"])
          assert replay["dependency_contract_fingerprint"] == native["dependency_contract_fingerprint"]
          assert inventory(replay) == inventory(native)
          PY

  cleanroom:
    needs: dependency_artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x64
            python: "3.12"
          - runner: windows-latest
            target: windows-x64
            python: "3.13"
          - runner: windows-latest
            target: windows-x64
            python: "3.14"
          - runner: ubuntu-latest
            target: linux-x64
            python: "3.12"
          - runner: ubuntu-latest
            target: linux-x64
            python: "3.13"
          - runner: ubuntu-latest
            target: linux-x64
            python: "3.14"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      PIP_NO_INDEX: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Set up ambient Python only
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}

      - name: Download built package artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: jazn-package-${{ matrix.target }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/jazn-consumer

      - name: Prove ambient Python lacks archive dependencies
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("py7zr") is None
          assert importlib.util.find_spec("pyzipper") is None
          PY

      - name: Extract only the transported system ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/jazn-consumer"
          runtime_dir="$RUNNER_TEMP/jazn-runtime"
          system_zip="$(python - "$package_dir" <<'PY'
          import pathlib, sys, zipfile
          root = pathlib.Path(sys.argv[1])
          matches=[]
          for path in root.glob("*.zip"):
              with zipfile.ZipFile(path) as z:
                  if "run.py" in z.namelist() and "JAZN_DEPENDENCY_SET.json" in z.namelist():
                      matches.append(path)
          assert len(matches) == 1, matches
          print(matches[0])
          PY
          )"
          python - "$system_zip" "$runtime_dir" <<'PY'
          import pathlib, sys, zipfile
          source, target = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          target.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(source) as z:
              z.extractall(target)
          PY
          echo "runtime_dir=$runtime_dir" >> "$GITHUB_OUTPUT"
          echo "package_dir=$package_dir" >> "$GITHUB_OUTPUT"

      - name: Ambient run.py performs verified offline handoff
        shell: bash
        env:
          JAZN_PACKAGE_SOURCE_DIR: ${{ steps.extract.outputs.package_dir }}
        run: |
          set -euo pipefail
          cd "${{ steps.extract.outputs.runtime_dir }}"

          set +e
          python run.py status --json > "$RUNNER_TEMP/status.json"
          status_rc=$?
          set -e
          cat "$RUNNER_TEMP/status.json"
          test "$status_rc" -eq 1
          python -c 'import json,sys; p=json.load(open(sys.argv[1], encoding="utf-8")); d=p.get("daemon") or {}; assert p.get("ok") is False, p; assert d.get("active_state") == "inactive", d; assert d.get("package_integrity_verified") is True, d' "$RUNNER_TEMP/status.json"

          set +e
          python run.py doctor --json > "$RUNNER_TEMP/doctor.json"
          doctor_rc=$?
          set -e
          cat "$RUNNER_TEMP/doctor.json"
          test "$doctor_rc" -eq 0
          python -c 'import json,sys; p=json.load(open(sys.argv[1], encoding="utf-8")); checks=p.get("package_integrity_checks") or {}; assert p.get("ok") is True, p; assert p.get("installation_ok") is True, p; assert p.get("activation_ready") is True, p; assert p.get("release_ready") is True, p; assert p.get("live_runtime_ready") is False, p; assert checks.get("verification_ok") is True, checks' "$RUNNER_TEMP/doctor.json"

          set +e
          python run.py start --json > "$RUNNER_TEMP/start.json"
          start_rc=$?
          set -e
          cat "$RUNNER_TEMP/start.json"
          test "$start_rc" -eq 0
          python -c 'import json,sys; p=json.load(open(sys.argv[1], encoding="utf-8")); assert p.get("ok") is True, p; assert p.get("daemon_instance_id") or (p.get("daemon") or {}).get("daemon_instance_id"), p' "$RUNNER_TEMP/start.json"

          set +e
          python run.py status --json > "$RUNNER_TEMP/status-after-start.json"
          status_after_rc=$?
          set -e
          cat "$RUNNER_TEMP/status-after-start.json"
          test "$status_after_rc" -eq 0
          python -c 'import json,sys; p=json.load(open(sys.argv[1], encoding="utf-8")); d=p.get("daemon") or {}; r=d.get("readiness") or {}; st=p.get("startup") or {}; assert p.get("ok") is True, p; assert p.get("runtime_core_ready") is True, p; assert p.get("runtime_write_ready") is True, p; assert d.get("active_state") == "active_trusted", d; assert d.get("endpoint_reachable") is True, d; assert d.get("heartbeat_fresh") is True, d; assert r.get("ok") is True, r; assert st.get("voice_live_ready") is True, st' "$RUNNER_TEMP/status-after-start.json"

          set +e
          python run.py start --json > "$RUNNER_TEMP/start-again.json"
          start_again_rc=$?
          set -e
          cat "$RUNNER_TEMP/start-again.json"
          test "$start_again_rc" -eq 0
          python -c 'import json,sys; p=json.load(open(sys.argv[1], encoding="utf-8")); assert p.get("ok") is True, p; assert p.get("already_running") is True or (p.get("daemon") or {}).get("already_running") is True, p' "$RUNNER_TEMP/start-again.json"

          set +e
          python run.py stop --json > "$RUNNER_TEMP/stop.json"
          stop_rc=$?
          set -e
          cat "$RUNNER_TEMP/stop.json"
          test "$stop_rc" -eq 0

      - name: Reject package when dependency sidecar is absent
        shell: bash
        env:
          JAZN_PACKAGE_SOURCE_DIR: ${{ steps.extract.outputs.package_dir }}
        run: |
          set -euo pipefail
          package_dir="${{ steps.extract.outputs.package_dir }}"
          sidecar="$(find "$package_dir" -maxdepth 1 -name '*.dependencies-*.zip' -print -quit)"
          test -n "$sidecar"
          mv "$sidecar" "$sidecar.hidden"
          cd "${{ steps.extract.outputs.runtime_dir }}"
          dependency_state="$(python - <<'PY'
          from pathlib import Path
          from latka_jazn.core.runtime_root import workspace_runtime_path
          print(workspace_runtime_path(Path.cwd()) / "local_resources" / "python")
          PY
          )"
          test -n "$dependency_state"
          rm -rf "$dependency_state"
          set +e
          python run.py start --json > "$RUNNER_TEMP/no-sidecar.out" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/no-sidecar.out"
          mv "$sidecar.hidden" "$sidecar"
          test "$rc" -ne 0
          grep -q "no_compatible_verified_dependency_bundle\|dependencies_missing_no_verified_wheelhouse" "$RUNNER_TEMP/no-sidecar.out"

  persist_release_locks:
    name: persist canonical dependency locks and release metadata
    if: github.event_name == 'push' && (github.ref_name == 'upgrade/v16.3.25.5-package-distribution-convergence' || github.ref_name == 'upgrade/v16.3.25.5-package-distribution-convergence-final' || github.ref_name == 'upgrade/package-generator-v10.1.86.0-rewrite')
    needs: [dependency_artifact, cross_target_lock_replay]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python 3.14 for canonical metadata sync
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"

      - name: Download Windows 3.12 package evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: jazn-package-windows-x64-py3.12
          path: ${{ runner.temp }}/release-locks/windows-x64-py312
      - name: Download Windows 3.13 package evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: jazn-package-windows-x64-py3.13
          path: ${{ runner.temp }}/release-locks/windows-x64-py313
      - name: Download Windows 3.14 package evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: jazn-package-windows-x64-py3.14
          path: ${{ runner.temp }}/release-locks/windows-x64-py314
      - name: Download Linux 3.12 package evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: jazn-package-linux-x64-py3.12
          path: ${{ runner.temp }}/release-locks/linux-x64-py312
      - name: Download Linux 3.13 package evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: jazn-package-linux-x64-py3.13
          path: ${{ runner.temp }}/release-locks/linux-x64-py313
      - name: Download Linux 3.14 package evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: jazn-package-linux-x64-py3.14
          path: ${{ runner.temp }}/release-locks/linux-x64-py314

      - name: Persist native locks then synchronize canonical release metadata
        shell: bash
        run: |
          set -euo pipefail
          runtime_version="$(python -X utf8 -c 'from latka_jazn.version import PACKAGE_VERSION_FULL; print(PACKAGE_VERSION_FULL)')"
          destination="latka_jazn/resources/dependencies/locks/core+archive"
          mkdir -p "$destination"
          count=0
          while IFS= read -r lock; do
            name="$(basename "$lock")"
            case "$name" in
              windows-x64-py312.txt|windows-x64-py313.txt|windows-x64-py314.txt|linux-x64-py312.txt|linux-x64-py313.txt|linux-x64-py314.txt) ;;
              *) continue ;;
            esac
            cp "$lock" "$destination/$name"
            count=$((count + 1))
          done < <(find "$RUNNER_TEMP/release-locks" -type f -path '*/locks/core+archive/*.txt' | sort)
          test "$count" -eq 6
          test "$(find "$destination" -maxdepth 1 -type f -name '*.txt' | wc -l)" -ge 6

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- "$destination"; then
            git add "$destination"
            git commit -m "release: lock ${runtime_version} dependency matrix"
          else
            echo "Canonical release locks already match native artifacts."
          fi

          source_commit="$(git rev-parse HEAD)"
          python -X utf8 -m latka_jazn.tools.release_metadata_sync \
            --root . \
            --base-branch master \
            --write \
            --json
          python -X utf8 -m latka_jazn.tools.release_metadata_sync \
            --root . \
            --base-branch master \
            --check \
            --json

          if ! git diff --quiet -- SOURCE_PROVENANCE.json PACKAGE_INTEGRITY_MANIFEST.json; then
            git add SOURCE_PROVENANCE.json PACKAGE_INTEGRITY_MANIFEST.json
            git commit -m "release: synchronize canonical metadata for ${runtime_version} [skip ci]"
          else
            echo "Canonical release metadata already matches source commit ${source_commit}."
          fi

          if [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]; then
            echo "Branch already contains canonical locks and metadata."
            exit 0
          fi
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"
