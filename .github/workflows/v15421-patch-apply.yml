name: v15421-patch-apply

on:
  push:
    branches:
      - update/v15421-cognitive-truth-memory-integration-hardening
    paths:
      - '.github/workflows/v15421-patch-apply.yml'
      - '.jazn_transport/**'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: update/v15421-cognitive-truth-memory-integration-hardening

      - name: Verify base ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 3855065aa5d468541adc1f5b971aaad590983fa4 HEAD

      - name: Verify transport fragments and assemble patch
        shell: bash
        run: |
          set -euo pipefail
          declare -A expected=(
            [00]=000a95247541ea4d72d2a8e783ae50e636117e106212c46bef63bc584aec85c0
            [01]=eb2296ea451679b264e3f63e02c06f180a59c21d8db133f9bceb51f730c85b48
            [02]=8a1f4579418fdb9fd5cbc196e9dd1eb87453c69cb2df5e36778740f51db6fea2
            [03]=8f9886d9e174403d5696fa92ec3e9a054f5c60f67280a051bf884489bcdb71d6
            [04]=8f732844ba399360185e469e080ac2b6cf7cc938d02a710eee88db5cbcbe33da
            [05]=0825f93d7f7ee837c24d3a3c686cfc0c196f8e15d341a66db97bfdf0f2abc157
            [06]=6f9369ce9668ab1f35af59dbf0dd956609cbb7919092f5a63196b026e4c62975
            [07]=1d6a877a6da058a2fe8aa00c33f306512b263ea84a783340f8ff0dcc572b7111
            [08]=7b815b627d65d67d7f3a96fcace946c4e7147d6df3922e3cc268d78476e05b7e
            [09]=7644fea97b944ee4a70d6eed56f71b9bd1099cc925f55fe0668a1c588113f619
            [10]=d503656249838c218c7fb1a4af5d6dfe8f554c8c5fa2b7d165aa177f37eaaebc
            [11]=9d95705073faf70524f3167a815ffb4025013ad6befa3d3989dfd52db1f50d69
            [12]=f850c50c9940b895820e363746800ba160a2b0ad3ab61168ddb30885b18c63a6
            [13]=05f5d2323ffc0402fc6db498f6b12552c71b72139e05952539c74bbcfc5a7199
            [14]=917a9fbba2fb0903332c978f4021597dfc1fb7b51281c4a4cef1d2086fd7ff4d
          )
          : > /tmp/v15421.patch.gz.b64
          for i in $(seq -w 0 14); do
            f=".jazn_transport/v15421.c${i}"
            test -f "$f"
            actual="$(sha256sum "$f" | awk '{print $1}')"
            test "$actual" = "${expected[$i]}"
            cat "$f" >> /tmp/v15421.patch.gz.b64
          done
          test "$(wc -c < /tmp/v15421.patch.gz.b64)" -eq 36360
          test "$(sha256sum /tmp/v15421.patch.gz.b64 | awk '{print $1}')" = "cc55f326e1776531b1314a20fe86cd02da97911e985da666d31c51d3f9b789ac"
          base64 -d /tmp/v15421.patch.gz.b64 > /tmp/v15421.patch.gz
          test "$(sha256sum /tmp/v15421.patch.gz | awk '{print $1}')" = "12c7988b0a87ecf268aa6979d60db9d586defafd4a6793c6c3cfbf384e5503a2"
          gzip -dc /tmp/v15421.patch.gz > /tmp/v15421.patch
          test "$(sha256sum /tmp/v15421.patch | awk '{print $1}')" = "c51eb0ed4d67d52b9ae59e68be0d379a9ee3db9494191d1c623ca7c16f6f2765"
          git apply --check /tmp/v15421.patch

      - name: Apply verified update and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/v15421.patch
          rm -rf .jazn_transport
          git diff --check
          git status --short

      - name: Commit and push verified source update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'apply v15.4.2.1 cognitive truth hardening'
          git push origin HEAD:update/v15421-cognitive-truth-memory-integration-hardening
