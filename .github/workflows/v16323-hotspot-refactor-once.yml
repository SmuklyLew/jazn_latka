name: v16.3.23 one-shot main hotspot refactor

on:
  push:
    branches:
      - upgrade/v16.3.23-persistent-runtime-lifecycle-observability

permissions:
  contents: write

concurrency:
  group: v16323-hotspot-refactor-once
  cancel-in-progress: false

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply narrow helper extraction
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          path = Path("main.py")
          text = path.read_text(encoding="utf-8")
          if "def _handle_failed_daemon_turn_transport(" in text:
              raise SystemExit("helper already present; refusing duplicate refactor")

          runtime_helper_start = text.find("def _runtime_config_for_transport(")
          next_helper = text.find("def _run_chat_command_one_shot(", runtime_helper_start)
          if runtime_helper_start < 0 or next_helper < 0:
              raise SystemExit("runtime helper boundaries not found")
          between = text[runtime_helper_start:next_helper]
          required_tail = "except (OSError, RuntimeError, ValueError):\n        return config"
          if required_tail not in between:
              raise SystemExit("runtime config helper tail not recognized")

          helper = '''def _handle_failed_daemon_turn_transport(
              daemon_ensure: DaemonEnsureResult,
              transport_observability: dict[str, Any],
          ) -> int | None:
              decision = daemon_ensure.decision if isinstance(daemon_ensure.decision, dict) else {}
              if decision.get("explicit_ensure") or decision.get("env_force"):
                  print(json.dumps({
                      "ok": False,
                      "error_code": "daemon_turn_transport_failed_after_explicit_ensure",
                      "transport_observability": transport_observability,
                      "truth_boundary": "Jawne wymaganie persistent daemonu nie może po cichu przejść do one-shot po błędzie transportu tury.",
                  }, ensure_ascii=False, indent=2, sort_keys=True))
                  return 1
              if transport_observability.get("selected_transport") == "persistent_daemon":
                  transport_observability.update({
                      "selected_transport": "verified_one_shot_fallback",
                      "fallback_reason": "daemon_turn_transport_unavailable",
                      "one_shot_allowed": True,
                      "one_shot_verified": False,
                  })
              return None


          '''
          text = text[:next_helper] + helper + text[next_helper:]

          chat_start = text.find("    if ns.chat_gpt:")
          block_start = text.find(
              "            decision = daemon_ensure.decision if isinstance(daemon_ensure.decision, dict) else {}",
              chat_start,
          )
          block_end = text.find("        bridge_stdin = io.StringIO", block_start)
          if chat_start < 0 or block_start < 0 or block_end < 0:
              raise SystemExit("chat-gpt fallback block boundaries not found")
          old_block = text[block_start:block_end]
          for required in (
              "daemon_turn_transport_failed_after_explicit_ensure",
              "daemon_turn_transport_unavailable",
              '"one_shot_verified": False',
          ):
              if required not in old_block:
                  raise SystemExit(f"fallback block missing expected marker: {required}")

          new_block = '''            transport_exit = _handle_failed_daemon_turn_transport(
                          daemon_ensure,
                          transport_observability,
                      )
                      if transport_exit is not None:
                          return transport_exit
          '''
          text = text[:block_start] + new_block + text[block_end:]
          path.write_text(text, encoding="utf-8")

          tree = ast.parse(text)
          main_node = next(
              node for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == "main"
          )
          if main_node.end_lineno is None:
              raise SystemExit("main.end_lineno missing")
          main_lines = main_node.end_lineno - main_node.lineno + 1
          print(f"main_lines={main_lines}")
          if main_lines > 1151:
              raise SystemExit(f"main.py:main still exceeds budget: {main_lines} > 1151")
          PY

          python -m py_compile main.py
          git diff --check
          git diff -- main.py

      - name: Commit narrow refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git diff --cached --check
          git diff --cached --quiet && { echo "No main.py change produced"; exit 1; }
          git commit -m "refactor(v16.3.23): extract daemon fallback from main hotspot"
          git push origin HEAD:${GITHUB_REF_NAME}
