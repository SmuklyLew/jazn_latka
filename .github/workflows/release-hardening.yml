name: release-hardening

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  manifest_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      head_sha: ${{ steps.head.outputs.sha }}
      runtime_version: ${{ steps.version.outputs.full }}
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      JAZN_RELEASE_BASE_BRANCH: master
      JAZN_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
    steps:
      - name: Checkout source branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"

      - name: Resolve runtime version
        id: version
        shell: bash
        run: |
          runtime_version="$(
            python -X utf8 -c \
              'from latka_jazn.version import PACKAGE_VERSION_FULL; print(PACKAGE_VERSION_FULL)'
          )"
          echo "full=${runtime_version}" >> "$GITHUB_OUTPUT"
          echo "Runtime version: ${runtime_version}"

      - name: Normalize origin URL for deterministic provenance
        shell: bash
        run: |
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git remote get-url origin

      - name: Synchronize canonical release metadata
        run: >-
          python -X utf8 -m latka_jazn.tools.release_metadata_sync
          --root .
          --base-branch master
          --write
          --json

      - name: Commit synchronized release metadata on master only
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- \
            SOURCE_PROVENANCE.json \
            PACKAGE_INTEGRITY_MANIFEST.json; then
            echo "Release metadata is already synchronized."
            exit 0
          fi

          target_branch="${GITHUB_REF#refs/heads/}"
          runtime_version="${{ steps.version.outputs.full }}"

          if [ "$JAZN_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "Release metadata drift cannot be committed to a fork: ${JAZN_HEAD_REPOSITORY}." >&2
            exit 2
          fi

          if [ "$target_branch" != "master" ]; then
            echo "Automatic release-metadata commits are forbidden outside master." >&2
            exit 2
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            SOURCE_PROVENANCE.json \
            PACKAGE_INTEGRITY_MANIFEST.json
          git commit -m "release: synchronize canonical metadata for ${runtime_version} [skip ci]"
          git push origin "HEAD:${target_branch}"

      - name: Verify synchronization is idempotent
        run: >-
          python -X utf8 -m latka_jazn.tools.release_metadata_sync
          --root .
          --base-branch master
          --check
          --json

      - name: Upload synchronized PR metadata
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: synchronized-release-metadata-${{ github.event.pull_request.head.sha }}
          path: |
            SOURCE_PROVENANCE.json
            PACKAGE_INTEGRITY_MANIFEST.json
          if-no-files-found: error
          retention-days: 3

      - name: Resolve synchronized HEAD
        id: head
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  verify_ubuntu:
    name: verify (ubuntu-latest)
    needs: [manifest_sync, dependency_contract_matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout synchronized source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ needs.manifest_sync.outputs.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Set up Node.js for Pyright
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[memory-rebuild-ui]" pytest
          npm install --global pyright@1.1.411

      - name: Materialize canonical PR metadata locally
        if: github.event_name == 'pull_request'
        run: >-
          python -X utf8 -m latka_jazn.tools.release_metadata_sync
          --root .
          --base-branch master
          --write
          --json

      - name: Compile all active Python
        run: python -X utf8 -m compileall -q latka_jazn tests main.py run.py

      - name: Static type audit
        run: pyright latka_jazn main.py run.py

      - name: Verify deterministic Pack Generator 8.8 bundle freshness
        run: python -X utf8 tools/build_jazn_pack_generator_bundle.py --check

      - name: Static type audit for regression test and pack-generator contracts
        run: >-
          pyright
          tests/test_chatgpt_mcp_end_to_end_v96.py
          tests/test_dialogue_task_state_v154.py
          tests/test_host_finalized_session_continuity_v154.py
          tests/test_memory_cloud_sync_v155.py
          tests/test_memory_recall_timeout_hardening.py
          tools/jazn_pack_generator.py

      - name: Independent semantic route audit
        run: python -X utf8 -m latka_jazn.tools.semantic_route_audit --root . --json

      - name: Cognitive architecture audit
        run: python -X utf8 -m latka_jazn.tools.cognitive_architecture_audit --root . --json

      - name: Full deterministic test suite
        run: >-
          python -X utf8 -m pytest
          -q -ra --tb=short --durations=25
          --junitxml="${{ runner.temp }}/pytest-ubuntu.xml"
          -m "not live_model and not live_mcp"

      - name: Upload Ubuntu pytest report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pytest-ubuntu-failure
          path: ${{ runner.temp }}/pytest-ubuntu.xml
          if-no-files-found: ignore
          retention-days: 3

      - name: Clean checkout guard
        if: always()
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git checkout -- SOURCE_PROVENANCE.json PACKAGE_INTEGRITY_MANIFEST.json
          fi
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  verify_windows:
    name: verify (windows-latest targeted)
    needs: [manifest_sync, dependency_contract_matrix]
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout synchronized source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ needs.manifest_sync.outputs.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Materialize canonical PR metadata locally
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: >-
          python -X utf8 -m latka_jazn.tools.release_metadata_sync
          --root .
          --base-branch master
          --write
          --json

      - name: Targeted Windows runtime and path tests
        shell: pwsh
        run: >-
          python -X utf8 -m pytest
          -q -ra --tb=short
          --junitxml="${{ runner.temp }}/pytest-windows.xml"
          tests/test_release_workflow_hardening.py
          tests/test_runtime_stability_rest_cycle_v1542.py
          tests/test_rest_cycle_controller_v1542.py
          tests/test_rest_cycle_store_v1542.py
          tests/test_wake_rest_continuity_v1542.py
          tests/test_cognitive_truth_memory_integration_v15421.py
          tests/test_startup_stability.py
          tests/test_runtime_stability_package_smoke.py
          tests/test_release_hardening_safe_paths.py
          tests/test_zip_resource_limits.py
          tests/test_shard_manifest_fail_closed.py
          tests/test_dialogue_task_state_v154.py
          tests/test_host_finalized_session_continuity_v154.py
          tests/test_reasoning_orchestrator_v154.py
          tests/test_knowledge_fabric_v154.py
          tests/test_lexical_intelligence_v154.py
          tests/test_operational_learning_memory_v154.py
          tests/test_external_dictionary_v154.py

      - name: Upload Windows pytest report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pytest-windows-failure
          path: ${{ runner.temp }}/pytest-windows.xml
          if-no-files-found: ignore
          retention-days: 3

      - name: Turn atomicity and timeout regressions
        shell: pwsh
        run: >-
          python -X utf8 -m pytest
          -q -ra --tb=short --durations=20
          --junitxml="${{ runner.temp }}/pytest-windows-turn-atomicity.xml"
          tests/test_turn_atomicity.py
          tests/test_turn_timeout_audit_nonblocking.py
          tests/test_runtime_stability_daemon_status.py

      - name: Upload Windows turn atomicity report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pytest-windows-turn-atomicity-failure
          path: ${{ runner.temp }}/pytest-windows-turn-atomicity.xml
          if-no-files-found: ignore
          retention-days: 3

      - name: Clean checkout guard
        if: always()
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            git checkout -- SOURCE_PROVENANCE.json PACKAGE_INTEGRITY_MANIFEST.json
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dirty = @(git status --porcelain --untracked-files=all)
          if ($dirty.Count -gt 0) {
            $dirty | ForEach-Object { Write-Host $_ }
            throw "Tests left tracked or untracked files in the checkout."
          }

  dependency_contract_matrix:
    name: dependency contract (${{ matrix.target }} py${{ matrix.python }})
    needs: manifest_sync
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x64
            python: "3.12"
          - runner: windows-latest
            target: windows-x64
            python: "3.13"
          - runner: windows-latest
            target: windows-x64
            python: "3.14"
          - runner: ubuntu-latest
            target: linux-x64
            python: "3.12"
          - runner: ubuntu-latest
            target: linux-x64
            python: "3.13"
          - runner: ubuntu-latest
            target: linux-x64
            python: "3.14"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout synchronized source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ needs.manifest_sync.outputs.head_sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependency-contract tooling
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Validate native target contract and resolution command
        shell: bash
        run: |
          python -X utf8 -m latka_jazn.tools.dependency_studio --root . --json audit
          python -X utf8 -m latka_jazn.tools.dependency_studio --root . --json download \
            --profile core --profile archive --platform current \
            --python-version "${{ matrix.python }}" --dry-run

  finalization:
    name: release finalization
    if: github.event_name != 'pull_request'
    needs: [manifest_sync, verify_ubuntu, verify_windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      JAZN_NETWORK_TIME_FIRST: "0"
      JAZN_NETWORK_TIME_IN_TURN: "0"
      JAZN_ALLOW_NETWORK: "0"
      JAZN_DICTIONARY_ALLOW_NETWORK: "0"
      JAZN_MODEL_ADAPTER: "null"
      JAZN_RELEASE_VERSION: ${{ needs.manifest_sync.outputs.runtime_version }}
      JAZN_FINALIZATION_DIR: release-finalization
    steps:
      - name: Checkout synchronized source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ needs.manifest_sync.outputs.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          mkdir -p "$RUNNER_TEMP/$JAZN_FINALIZATION_DIR"

      - name: Verify clean release package once
        run: >-
          python -X utf8 run.py package-smoke --profile release --json
          | tee "$RUNNER_TEMP/$JAZN_FINALIZATION_DIR/package-smoke-release.json"

      - name: Clean checkout guard
        if: always()
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Upload finalization report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-finalization-failure-${{ needs.manifest_sync.outputs.runtime_version }}
          path: ${{ runner.temp }}/release-finalization/
          if-no-files-found: ignore
          retention-days: 3
