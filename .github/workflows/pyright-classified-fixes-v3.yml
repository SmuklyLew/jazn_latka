name: pyright-classified-fixes-v3

on:
  push:
    branches:
      - fix/checkpoint-2026-09-04-master-corrected-pylance-pyright-hardening

permissions:
  contents: write

jobs:
  apply_classified_fixes:
    name: apply classified Pyright fixes then validate
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout branch with persisted GitHub credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Apply the previously classified corrections only
        run: |
          set -euo pipefail
          python -X utf8 tools/_pyright_classified_fixer_20260904.py
          git diff --check
          git status --short

      - name: Set up Node.js for exact Pyright
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install project and exact checker
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[memory-rebuild-ui]" pytest
          npm install --global pyright@1.1.411
          python -m pip check
          pyright --version
          test "$(pyright --version | awk '{print $2}')" = "1.1.411"

      - name: Prove full active-tree Pyright is clean before committing
        run: pyright --project pyrightconfig.json

      - name: Run focused regressions for every corrected area
        run: >-
          python -X utf8 -m pytest
          -q -ra --tb=short
          tests/test_dependency_unpacked_wheel_bootstrap_v1632555.py
          tests/test_memory_rebuild_v4_protocol_engine.py
          tests/test_release_metadata_semantics_v163253.py
          tests/test_memory_rebuild.py
          tests/test_jazn_pack_generator_v89_distribution.py
          tests/test_jazn_pack_generator_v1001_public_api_contract.py

      - name: Compile complete active Python tree
        run: python -X utf8 -m compileall -q latka_jazn tests tools main.py run.py

      - name: Commit code corrections locally
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: integrate Pack Generator 10.1.86.0 with active-tree Pyright"
          fi

      - name: Synchronize canonical release metadata after code settles
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          python -X utf8 -m latka_jazn.tools.release_metadata_sync \
            --root . \
            --base-branch master \
            --write \
            --json
          python -X utf8 -m latka_jazn.tools.release_metadata_sync \
            --root . \
            --base-branch master \
            --check \
            --json
          git add SOURCE_PROVENANCE.json PACKAGE_INTEGRITY_MANIFEST.json
          if ! git diff --cached --quiet; then
            runtime_version="$(python -X utf8 -c 'from latka_jazn.version import PACKAGE_VERSION_FULL; print(PACKAGE_VERSION_FULL)')"
            git commit -m "release: synchronize canonical metadata for ${runtime_version}"
          fi
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Run full deterministic pytest on synchronized clean tree
        run: >-
          python -X utf8 -m pytest
          -q -ra --tb=short --durations=25
          -m "not live_model and not live_mcp"

      - name: Final compileall and clean-tree guard
        run: |
          set -euo pipefail
          python -X utf8 -m compileall -q latka_jazn tests tools main.py run.py
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Push validated code and metadata without force
        run: |
          set -euo pipefail
          remote_head="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          local_head="$(git rev-parse HEAD)"
          if [ "$local_head" = "$remote_head" ]; then
            echo "Validated branch already points at ${local_head}."
            exit 0
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
