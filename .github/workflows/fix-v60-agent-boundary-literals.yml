name: Fix v60 agent boundary literals

on:
  push:
    branches:
      - upgrade/v16.3.25.5.60-main-entrypoint-chatgpt-live-convergence
    paths:
      - .github/workflows/fix-v60-agent-boundary-literals.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Patch active host contracts and verify targeted tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          agents = Path('AGENTS.chatgpt.md')
          text = agents.read_text(encoding='utf-8')
          old = 'Dla każdej następnej wiadomości użytkownika:\n'
          new = 'Dla każdej następnej wiadomości użytkownika każdą bieżącą wiadomość przekaż w dokładnym brzmieniu przez już otwarty persistent bridge.\n\nDla każdej następnej wiadomości użytkownika:\n'
          if 'każdą bieżącą wiadomość przekaż w dokładnym brzmieniu' not in text:
              if old not in text:
                  raise SystemExit('AGENTS.chatgpt.md expected insertion point missing')
              text = text.replace(old, new, 1)
              agents.write_text(text, encoding='utf-8')

          loader = Path('docs/runtime/CHATGPT_PROJECT_INSTRUCTIONS.txt')
          text = loader.read_text(encoding='utf-8')
          old = 'Po uzyskaniu zweryfikowanego `active_root` traktuj `run.py` jako cienki starter użytkownika prowadzący bezpośrednio do centralnego `main.py`. To `main.py`, nie `run.py` ani host, jest właścicielem top-level dispatchu, lifecycle, routingu i finalizacji.\n'
          new = 'Po uzyskaniu zweryfikowanego `active_root` traktuj `run.py` jako cienki starter do `main.py`. `main.py` stanowi kanoniczne wykonawcze wejście systemu i jest właścicielem top-level dispatchu, lifecycle, routingu i finalizacji.\n'
          if 'kanoniczne wykonawcze wejście' not in text:
              if old not in text:
                  raise SystemExit('CHATGPT_PROJECT_INSTRUCTIONS expected replacement point missing')
              text = text.replace(old, new, 1)
              loader.write_text(text, encoding='utf-8')

          if len(loader.read_text(encoding='utf-8')) > 5000:
              raise SystemExit('CHATGPT_PROJECT_INSTRUCTIONS exceeded thin-loader 5000-char contract')
          PY
          python -X utf8 -m pytest -q tests/test_runtime_owned_agent_boundaries.py tests/test_v16325560_main_entrypoint_persistent_chatgpt.py
          git diff --check
          rm .github/workflows/fix-v60-agent-boundary-literals.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: preserve runtime-owned verbatim routing contracts'
          git push origin "HEAD:${GITHUB_REF_NAME}"
