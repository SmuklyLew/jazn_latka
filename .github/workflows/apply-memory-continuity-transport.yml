name: apply-memory-continuity-transport

on:
  push:
    branches:
      - fix/v15401-memory-wake-continuity-neuro-hardening-20260810

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Verify and apply signed transport
        shell: bash
        run: |
          set -euo pipefail
          cat docs/patches/.memory_continuity_transport.00 \
              docs/patches/.memory_continuity_transport.01 \
              docs/patches/.memory_continuity_transport.02 \
              docs/patches/.memory_continuity_transport.03 > /tmp/memory_continuity.patch.gz.b64
          test "$(wc -c < /tmp/memory_continuity.patch.gz.b64)" -eq 22556
          base64 -d /tmp/memory_continuity.patch.gz.b64 > /tmp/memory_continuity.patch.gz
          gzip -dc /tmp/memory_continuity.patch.gz > /tmp/memory_continuity.patch
          echo "db83e8864037fae9da392d9981a1860fb09e5231e55a1dd98f0ad38d6d6f34e9  /tmp/memory_continuity.patch" | sha256sum -c -
          git apply --check /tmp/memory_continuity.patch
          git apply /tmp/memory_continuity.patch
          rm -f docs/patches/.memory_continuity_transport.00
          rm -f docs/patches/.memory_continuity_transport.01
          rm -f docs/patches/.memory_continuity_transport.02
          rm -f docs/patches/.memory_continuity_transport.03
          rm -f .github/workflows/apply-memory-continuity-transport.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden memory continuity recovery and wake coverage"
          git push origin "HEAD:${GITHUB_REF_NAME}"
