name: Finalize memory test 04 HTML hardening

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feature/memory-sqlite-test-04'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/memory-sqlite-test-04
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Verify, assemble and apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/gzparts.sha256 <<'EOF'
          028d1b058c6a19ba375ecc6020ba6d5c75712c0f3df2ccb53abdc4b9a49f2f2e  tools/.temporary_memory_test04_gzpatch/part00.b64
          c5b7b35d4aaf7d40f262e542f130070126ca029347e15910ddeaa53ce63cdbb1  tools/.temporary_memory_test04_gzpatch/part01.b64
          424a2f67a7f0c0ed87868844bc7442ec2b9e62036ec0821c413af0850cb6d8b5  tools/.temporary_memory_test04_gzpatch/part02.b64
          54b71626b257a08be292b848279ccf418d986242ebd3bb29e3e4d7667e512c1e  tools/.temporary_memory_test04_gzpatch/part03.b64
          339cf1c2a17025f4ba65dd0e46b637519706e93ff1730c0d8840728d8f93b485  tools/.temporary_memory_test04_gzpatch/part04.b64
          6ba3b871a1aff01a789d95d7e9e1686ad066808b7ccf4b1d2b712eb94a0eba47  tools/.temporary_memory_test04_gzpatch/part05.b64
          1ac861aa42d48f5724d74bd61cd39209d57f5c7d44f8010937cd2512cdc487f8  tools/.temporary_memory_test04_gzpatch/part06.b64
          7a55795c0ba356df0ccf0f1e86e3a4f0419b9e5d49f9c20532454802319deb30  tools/.temporary_memory_test04_gzpatch/part07.b64
          f6ffdcb6f9bd9e71fb2379895e55f727f8cf5413bab3ef2fa5d30441f93e23af  tools/.temporary_memory_test04_gzpatch/part08.b64
          b7c9bdf1c607a9e88a282a7be3342a247022a28e60afd3e70e3e5efc719f1193  tools/.temporary_memory_test04_gzpatch/part09.b64
          790ee3b6bc233056c78cda8f077d80730563ffa411bd340890f209b002b915c5  tools/.temporary_memory_test04_gzpatch/part10.b64
          ed5d3b7e12024a8a6a30d5987d0a156d22d98b4150e3c552b9da3130d6887e99  tools/.temporary_memory_test04_gzpatch/part11.b64
          EOF
          sha256sum -c /tmp/gzparts.sha256
          cat tools/.temporary_memory_test04_gzpatch/part*.b64 > /tmp/memory-test04.patch.gz.b64
          echo "724080159577a7c45d84057bc47b9fd2a779393fe6cf67eb5748071fd371d7be  /tmp/memory-test04.patch.gz.b64" | sha256sum -c -
          base64 --decode /tmp/memory-test04.patch.gz.b64 | gzip -dc > /tmp/memory-test04.patch
          test "$(wc -c < /tmp/memory-test04.patch)" = "31137"
          echo "b8b35e832967c42d1d891e234b1883532510c32af3b856d9c90e2f4278e8e815  /tmp/memory-test04.patch" | sha256sum -c -
          git apply --exclude=.github/workflows/_temporary_export_memory_test04_checkout.yml --check --verbose /tmp/memory-test04.patch
          git apply --exclude=.github/workflows/_temporary_export_memory_test04_checkout.yml /tmp/memory-test04.patch
          rm -rf tools/.temporary_memory_test04_patch tools/.temporary_memory_test04_gzpatch
          rm -f .github/workflows/_temporary_export_memory_test04_checkout.yml
          git diff --check
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and test runner
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Validate implementation
        run: |
          python -X utf8 -m compileall -q latka_jazn tests main.py run.py
          python -X utf8 -m pytest -q --tb=short tests/test_memory_sqlite_test04.py tests/test_html_memory_ingest.py tests/test_memory_rebuild.py tests/test_memory_restore_tool.py tests/test_memory_rebuild_tool.py tests/test_memory_recovery_pipeline.py tests/test_memory_tier_store.py tests/test_memory_tiers.py tests/test_memory_tier_status.py
      - name: Commit validated code and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m "feat(memory): harden test 04 for HTML import dry-run"
      - name: Synchronize release metadata
        run: python -X utf8 -m latka_jazn.tools.release_metadata_sync --root . --base-branch master --write --json
      - name: Validate runtime package contracts
        run: |
          python -X utf8 run.py doctor --json
          python -X utf8 run.py package-smoke --profile system --json
          git diff --check
      - name: Commit metadata and push final branch
        shell: bash
        run: |
          set -euo pipefail
          git add PACKAGE_INTEGRITY_MANIFEST.json SOURCE_PROVENANCE.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): sync metadata for HTML-ready memory test 04"
          fi
          git push origin HEAD:feature/memory-sqlite-test-04
