name: Export assembled memory test 04 patch

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-patch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feature/memory-sqlite-test-04'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/memory-sqlite-test-04
          fetch-depth: 0
      - name: Assemble patch
        shell: bash
        run: |
          set -euo pipefail
          cat tools/.temporary_memory_test04_patch/part*.b64 | base64 --decode > memory-test04-remote.patch
          wc -c memory-test04-remote.patch
          sha256sum memory-test04-remote.patch
      - name: Upload exact assembled patch
        uses: actions/upload-artifact@v4
        with:
          name: memory-test04-remote-patch
          path: memory-test04-remote.patch
          if-no-files-found: error
          retention-days: 1
