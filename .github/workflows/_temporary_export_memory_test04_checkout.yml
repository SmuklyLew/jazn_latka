name: Diagnose memory test 04 patch parts

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feature/memory-sqlite-test-04'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/memory-sqlite-test-04
          fetch-depth: 0
      - name: Record exact patch-part diagnostics
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p tools/.temporary_memory_test04_patch
          {
            echo "parts:"
            wc -c tools/.temporary_memory_test04_patch/part*.b64
            echo "part_sha256:"
            sha256sum tools/.temporary_memory_test04_patch/part*.b64
            echo "combined_base64_chars:"
            cat tools/.temporary_memory_test04_patch/part*.b64 | wc -c
            echo "decode:"
            set +e
            cat tools/.temporary_memory_test04_patch/part*.b64 | base64 --decode > /tmp/memory-test04.patch 2>/tmp/decode.err
            echo "decode_rc=$?"
            cat /tmp/decode.err
            wc -c /tmp/memory-test04.patch
            sha256sum /tmp/memory-test04.patch
            echo "patch_tail:"
            tail -n 12 /tmp/memory-test04.patch
          } > tools/.temporary_memory_test04_patch/diagnostic.txt
          git add tools/.temporary_memory_test04_patch/diagnostic.txt
          git commit -m "ci: record memory test 04 patch-part diagnostic"
          git push origin HEAD:feature/memory-sqlite-test-04
