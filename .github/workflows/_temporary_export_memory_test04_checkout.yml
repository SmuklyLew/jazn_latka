name: Finalize memory test 04 HTML hardening

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feature/memory-sqlite-test-04'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/memory-sqlite-test-04
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Assemble and apply validated patch
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p tools/.temporary_memory_test04_patch
          : > /tmp/decode.err
          : > /tmp/apply.err
          cat tools/.temporary_memory_test04_patch/part*.b64 | base64 --decode > /tmp/memory-test04.patch 2>/tmp/decode.err
          decode_rc=$?
          git apply --exclude=.github/workflows/_temporary_export_memory_test04_checkout.yml --check --verbose /tmp/memory-test04.patch 2>/tmp/apply.err
          apply_rc=$?
          if [ "$decode_rc" -ne 0 ] || [ "$apply_rc" -ne 0 ]; then
            {
              echo "decode_rc=$decode_rc"
              echo "apply_rc=$apply_rc"
              echo "parts:"
              wc -c tools/.temporary_memory_test04_patch/part*.b64
              echo "patch:"
              wc -c /tmp/memory-test04.patch
              sha256sum /tmp/memory-test04.patch
              echo "decode_stderr:"
              cat /tmp/decode.err
              echo "apply_stderr:"
              cat /tmp/apply.err
            } > tools/.temporary_memory_test04_patch/diagnostic.txt
            git add tools/.temporary_memory_test04_patch/diagnostic.txt
            git commit -m "ci: record memory test 04 patch diagnostic"
            git push origin HEAD:feature/memory-sqlite-test-04
            exit 1
          fi
          set -e
          git apply --exclude=.github/workflows/_temporary_export_memory_test04_checkout.yml /tmp/memory-test04.patch
          rm -rf tools/.temporary_memory_test04_patch
          rm -f .github/workflows/_temporary_export_memory_test04_checkout.yml
          git diff --check
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate HTML and memory test suites
        run: |
          python -X utf8 -m compileall -q latka_jazn tests main.py run.py
          python -X utf8 -m pytest -q tests/test_memory_sqlite_test04.py tests/test_html_memory_ingest.py tests/test_memory_rebuild.py tests/test_memory_restore_tool.py tests/test_memory_rebuild_tool.py tests/test_memory_recovery_pipeline.py tests/test_memory_tier_store.py tests/test_memory_tiers.py tests/test_memory_tier_status.py
      - name: Synchronize release metadata
        run: python -X utf8 -m latka_jazn.tools.release_metadata_sync --root . --base-branch master --write --json
      - name: Commit and push final branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m "feat(memory): harden test 04 for HTML import dry-run"
          git push origin HEAD:feature/memory-sqlite-test-04
