name: v163255-finalize-v2

on:
  push:
    branches:
      - upgrade/v16.3.25.5-package-distribution-convergence-final

permissions:
  contents: write

concurrency:
  group: v163255-finalize-v2-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"
  JAZN_PATCH_B64_SHA256: fb5a6ab07d0eed63dc6b20e18214df5ee7d6257a7e0f48af5c371169ce9238c0
  JAZN_PATCH_XZ_SHA256: 32545bd0a6927420b975ecd20437faa4654e0433182914be6301a97ba91f400c
  JAZN_PATCH_SHA256: 75ef4a58da3a3da2ac4ab663e66ff208a9a71ff84c28708e8b43c05ff4ecd98d
  JAZN_BASE_SHA: a8b5fa4b57704edc99ec15cc6dc0122186a72ed9
  JAZN_FINAL_BRANCH: upgrade/v16.3.25.5-package-distribution-convergence-final

jobs:
  verify:
    name: verify-v2 ${{ matrix.runner }} py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            python: "3.12"
            full: "true"
            pyright: "false"
          - runner: windows-latest
            python: "3.14"
            full: "true"
            pyright: "false"
          - runner: ubuntu-latest
            python: "3.14"
            full: "false"
            pyright: "true"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    steps:
      - name: Checkout transport commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Node.js for Pyright
        if: matrix.pyright == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Reconstruct final tree and apply type hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          root = Path('.jazn-bootstrap-final/parts')
          files = sorted(path for path in root.iterdir() if path.is_file())
          if not files:
              raise SystemExit('missing patch transport parts')
          b64 = b''.join(path.read_bytes() for path in files)
          checks = [
              (b64, os.environ['JAZN_PATCH_B64_SHA256'], 'base64 transport'),
          ]
          for data, expected, label in checks:
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected:
                  raise SystemExit(f'{label} sha256 mismatch: {actual} != {expected}')
          compressed = base64.b64decode(b64, validate=True)
          if hashlib.sha256(compressed).hexdigest() != os.environ['JAZN_PATCH_XZ_SHA256']:
              raise SystemExit('xz transport sha256 mismatch')
          patch = lzma.decompress(compressed)
          if hashlib.sha256(patch).hexdigest() != os.environ['JAZN_PATCH_SHA256']:
              raise SystemExit('uncompressed patch sha256 mismatch')
          Path(os.environ.get('RUNNER_TEMP', '.')).joinpath('v163255-final.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/v163255-final.patch"
          git apply "$RUNNER_TEMP/v163255-final.patch"
          python .jazn-bootstrap-final/apply_pyright_fix.py
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/package-distribution-cleanroom.yml')
          text = path.read_text(encoding='utf-8')
          old = "branches: [master, 'upgrade/v16.3.25.5-package-distribution-convergence']"
          new = "branches: [master, 'upgrade/v16.3.25.5-package-distribution-convergence', 'upgrade/v16.3.25.5-package-distribution-convergence-final']"
          if old in text:
              text = text.replace(old, new, 1)
          old_if = "if: github.event_name == 'push' && github.ref_name == 'upgrade/v16.3.25.5-package-distribution-convergence'"
          new_if = "if: github.event_name == 'push' && (github.ref_name == 'upgrade/v16.3.25.5-package-distribution-convergence' || github.ref_name == 'upgrade/v16.3.25.5-package-distribution-convergence-final')"
          if old_if in text:
              text = text.replace(old_if, new_if, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          rm -rf .jazn-bootstrap-final
          rm -f .github/workflows/v163255-finalize.yml .github/workflows/v163255-finalize-v2.yml
          git diff --check

      - name: Install project dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[memory-rebuild-ui]" pytest pip-audit
          if [ "${{ matrix.pyright }}" = "true" ]; then npm install --global pyright@1.1.411; fi

      - name: Compile active Python
        shell: bash
        run: python -X utf8 -m compileall -q latka_jazn tests main.py run.py

      - name: Verify deterministic Pack Generator 8.8 bundle freshness
        shell: bash
        run: python -X utf8 tools/build_jazn_pack_generator_bundle.py --check

      - name: Static type audit
        if: matrix.pyright == 'true'
        shell: bash
        run: |
          pyright latka_jazn main.py run.py
          pyright tests/test_chatgpt_mcp_end_to_end_v96.py tests/test_dialogue_task_state_v154.py tests/test_host_finalized_session_continuity_v154.py tests/test_memory_cloud_sync_v155.py tests/test_memory_recall_timeout_hardening.py tools/jazn_pack_generator.py

      - name: Critical package-distribution regressions
        shell: bash
        run: >-
          python -X utf8 -m pytest -q -ra --tb=short
          tests/test_package_distribution_v163255.py
          tests/test_daemon_instance_identity_v163255.py
          tests/test_runtime_stability_daemon_status.py
          tests/test_dependency_studio_v1632539.py
          tests/test_archive_io_7z_encryption_v1638.py
          tests/test_archive_io_v1638.py
          tests/test_jazn_pack_generator_v88_import_isolation.py
          tests/test_jazn_pack_generator_v88_studio_portability.py
          tests/test_independent_memory_package_contract_v2.py

      - name: Full deterministic test suite
        if: matrix.full == 'true'
        shell: bash
        run: >-
          python -X utf8 -m pytest
          -q -ra --tb=short --durations=25
          -m "not live_model and not live_mcp"

  publish:
    name: publish clean v16.3.25.5 branch v2
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JAZN_NETWORK_TIME_FIRST: "0"
      JAZN_NETWORK_TIME_IN_TURN: "0"
      JAZN_ALLOW_NETWORK: "0"
      JAZN_DICTIONARY_ALLOW_NETWORK: "0"
      JAZN_MODEL_ADAPTER: "null"
    steps:
      - name: Checkout verified transport commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"

      - name: Reconstruct verified final tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          files = sorted(path for path in Path('.jazn-bootstrap-final/parts').iterdir() if path.is_file())
          b64 = b''.join(path.read_bytes() for path in files)
          assert hashlib.sha256(b64).hexdigest() == os.environ['JAZN_PATCH_B64_SHA256']
          compressed = base64.b64decode(b64, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == os.environ['JAZN_PATCH_XZ_SHA256']
          patch = lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == os.environ['JAZN_PATCH_SHA256']
          Path(os.environ['RUNNER_TEMP']).joinpath('v163255-final.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/v163255-final.patch"
          git apply "$RUNNER_TEMP/v163255-final.patch"
          python .jazn-bootstrap-final/apply_pyright_fix.py
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/package-distribution-cleanroom.yml')
          text = path.read_text(encoding='utf-8')
          old = "branches: [master, 'upgrade/v16.3.25.5-package-distribution-convergence']"
          new = "branches: [master, 'upgrade/v16.3.25.5-package-distribution-convergence', 'upgrade/v16.3.25.5-package-distribution-convergence-final']"
          if old in text:
              text = text.replace(old, new, 1)
          old_if = "if: github.event_name == 'push' && github.ref_name == 'upgrade/v16.3.25.5-package-distribution-convergence'"
          new_if = "if: github.event_name == 'push' && (github.ref_name == 'upgrade/v16.3.25.5-package-distribution-convergence' || github.ref_name == 'upgrade/v16.3.25.5-package-distribution-convergence-final')"
          if old_if in text:
              text = text.replace(old_if, new_if, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          rm -rf .jazn-bootstrap-final
          rm -f .github/workflows/v163255-finalize.yml .github/workflows/v163255-finalize-v2.yml
          git diff --check

      - name: Install release tooling
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[memory-rebuild-ui]" pytest

      - name: Create clean implementation commit directly on master base
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset --soft "$JAZN_BASE_SHA"
          git commit -m "release: implement 16.3.25.5 package distribution convergence"
          test "$(git rev-parse HEAD^)" = "$JAZN_BASE_SHA"

      - name: Synchronize canonical release metadata from final implementation tree
        shell: bash
        run: |
          set -euo pipefail
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          python -X utf8 -m latka_jazn.tools.release_metadata_sync --root . --base-branch master --write --json
          git add SOURCE_PROVENANCE.json PACKAGE_INTEGRITY_MANIFEST.json
          if ! git diff --cached --quiet; then
            git commit -m "release: synchronize canonical metadata for 16.3.25.5-package-distribution-convergence [skip ci]"
          fi
          python -X utf8 -m latka_jazn.tools.release_metadata_sync --root . --base-branch master --check --json

      - name: Verify clean release package
        shell: bash
        run: |
          set -euo pipefail
          python -X utf8 run.py package-smoke --profile release --json
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Atomically replace transport branch with clean verified history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$JAZN_FINAL_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push --force-with-lease="refs/heads/$JAZN_FINAL_BRANCH:$GITHUB_SHA" origin "HEAD:refs/heads/$JAZN_FINAL_BRANCH"
