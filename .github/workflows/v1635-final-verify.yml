name: v16.3.5 final release verification

on:
  push:
    branches:
      - 16.3.5-complex-dialogue-memory-routing-final-hardening

permissions:
  contents: read

concurrency:
  group: v1635-final-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      head_sha: ${{ steps.head.outputs.sha }}
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Synchronize metadata for verification workflow
        shell: bash
        run: |
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          python -X utf8 -m latka_jazn.tools.release_metadata_sync --root . --base-branch master --write --json
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOURCE_PROVENANCE.json PACKAGE_INTEGRITY_MANIFEST.json
          if ! git diff --cached --quiet; then
            git commit -m "release: synchronize metadata for v16.3.5 final verification [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Resolve verification HEAD
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  ubuntu:
    name: Ubuntu full deterministic and static gate
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout verification HEAD
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.head_sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[memory-rebuild-ui]" pytest
          npm install --global pyright@1.1.411
      - name: Compile all active Python
        run: python -X utf8 -m compileall -q latka_jazn tests main.py run.py
      - name: Pyright main code
        run: pyright latka_jazn main.py run.py
      - name: Pyright regression contracts
        run: >-
          pyright
          tests/test_chatgpt_mcp_end_to_end_v96.py
          tests/test_dialogue_task_state_v154.py
          tests/test_host_finalized_session_continuity_v154.py
          tests/test_memory_cloud_sync_v155.py
          tests/test_memory_recall_timeout_hardening.py
          tests/test_v1635_final_hardening.py
          tools/_jazn_pack_generator_memory_v2.py
          tools/jazn_pack_generator.py
      - name: Independent semantic route audit
        run: python -X utf8 -m latka_jazn.tools.semantic_route_audit --root . --json
      - name: Cognitive architecture audit
        run: python -X utf8 -m latka_jazn.tools.cognitive_architecture_audit --root . --json
      - name: Full deterministic pytest
        run: >-
          python -X utf8 -m pytest
          -q -ra --tb=short --durations=25
          --junitxml="${{ runner.temp }}/pytest-ubuntu.xml"
          -m "not live_model and not live_mcp"
      - name: Upload Ubuntu report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v1635-final-pytest-ubuntu-failure
          path: ${{ runner.temp }}/pytest-ubuntu.xml
          if-no-files-found: ignore
          retention-days: 3
      - name: Clean checkout guard
        if: always()
        shell: bash
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  windows:
    name: Windows runtime and path gate
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout verification HEAD
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.head_sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Canonical Windows runtime and path tests
        shell: pwsh
        run: >-
          python -X utf8 -m pytest
          -q -ra --tb=short
          --junitxml="${{ runner.temp }}/pytest-windows.xml"
          tests/test_release_workflow_hardening.py
          tests/test_runtime_stability_rest_cycle_v1542.py
          tests/test_rest_cycle_controller_v1542.py
          tests/test_rest_cycle_store_v1542.py
          tests/test_wake_rest_continuity_v1542.py
          tests/test_cognitive_truth_memory_integration_v15421.py
          tests/test_startup_stability.py
          tests/test_runtime_stability_package_smoke.py
          tests/test_release_hardening_safe_paths.py
          tests/test_zip_resource_limits.py
          tests/test_shard_manifest_fail_closed.py
          tests/test_dialogue_task_state_v154.py
          tests/test_host_finalized_session_continuity_v154.py
          tests/test_reasoning_orchestrator_v154.py
          tests/test_knowledge_fabric_v154.py
          tests/test_lexical_intelligence_v154.py
          tests/test_operational_learning_memory_v154.py
          tests/test_external_dictionary_v154.py
          tests/test_v1635_final_hardening.py
      - name: Turn atomicity and timeout regressions
        shell: pwsh
        run: >-
          python -X utf8 -m pytest
          -q -ra --tb=short --durations=20
          tests/test_turn_atomicity.py
          tests/test_turn_timeout_audit_nonblocking.py
          tests/test_runtime_stability_daemon_status.py
      - name: Upload Windows report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v1635-final-pytest-windows-failure
          path: ${{ runner.temp }}/pytest-windows.xml
          if-no-files-found: ignore
          retention-days: 3
      - name: Clean checkout guard
        if: always()
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dirty = @(git status --porcelain --untracked-files=all)
          if ($dirty.Count -gt 0) {
            $dirty | ForEach-Object { Write-Host $_ }
            throw "Tests left tracked or untracked files in the checkout."
          }

  finalization:
    name: Final doctor, package smoke and release build
    needs: [prepare, ubuntu, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      JAZN_NETWORK_TIME_FIRST: "0"
      JAZN_NETWORK_TIME_IN_TURN: "0"
      JAZN_ALLOW_NETWORK: "0"
      JAZN_DICTIONARY_ALLOW_NETWORK: "0"
      JAZN_MODEL_ADAPTER: "null"
    steps:
      - name: Checkout verified HEAD
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.head_sha }}
      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Doctor and system package smoke on verified tree
        run: |
          python -X utf8 run.py doctor --json
          python -X utf8 run.py package-smoke --profile system --json
      - name: Commit verification-workflow removal
        shell: bash
        run: |
          rm .github/workflows/v1635-final-verify.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: remove v16.3.5 final verification workflow [skip ci]"
      - name: Resynchronize final canonical metadata from clean tree
        shell: bash
        run: |
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          python -X utf8 -m latka_jazn.tools.release_metadata_sync --root . --base-branch master --write --json
      - name: Commit final metadata and push clean branch
        shell: bash
        run: |
          git diff --check
          git add SOURCE_PROVENANCE.json PACKAGE_INTEGRITY_MANIFEST.json
          if ! git diff --cached --quiet; then
            git commit -m "release: finalize canonical metadata for 16.3.5 [skip ci]"
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Verify final metadata idempotence
        run: python -X utf8 -m latka_jazn.tools.release_metadata_sync --root . --base-branch master --check --json
      - name: Doctor on final committed tree
        run: python -X utf8 run.py doctor --json
      - name: Release package smoke
        run: python -X utf8 run.py package-smoke --profile release --json
      - name: Build release bundle outside checkout
        run: >-
          python -X utf8 run.py release-build
          --root .
          --output "${{ runner.temp }}/jazn_latka_v16.3.5-release.zip"
          --json
      - name: Final clean checkout guard
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
