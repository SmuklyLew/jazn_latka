name: Apply v16.2.4 host tool provenance and memory autoload

on:
  pull_request:
    branches:
      - master
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.head_ref == 'fix/v16.2.4-host-tool-provenance-memory-autoload'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: fix/v16.2.4-host-tool-provenance-memory-autoload
          fetch-depth: 0

      - name: Reassemble and verify patch payload
        shell: bash
        run: |
          cat .github/.v1624-autoload/v16_2_4.patch.00 \
              .github/.v1624-autoload/v16_2_4.patch.01 \
              .github/.v1624-autoload/v16_2_4.patch.02 \
              .github/.v1624-autoload/v16_2_4.patch.03 \
              .github/.v1624-autoload/v16_2_4.patch.04 > /tmp/v16_2_4.patch
          sed -i 's/^ diff --git /diff --git /' /tmp/v16_2_4.patch
          echo 'e20f07fc9c2f5292cdd8a07f247460f83eeb61c8eb9948ecc1941a3b3e0c3a31  /tmp/v16_2_4.patch' | sha256sum -c -

      - name: Apply only to exact verified master base
        shell: bash
        run: |
          git checkout --detach 2a9010e80e94842887d41227357594eddb1a6b97
          git apply --check /tmp/v16_2_4.patch
          git apply /tmp/v16_2_4.patch
          git diff --check

      - name: Install project test environment
        shell: bash
        run: python -m pip install -e . pytest

      - name: Run targeted regression tests
        shell: bash
        run: |
          python -m pytest -q \
            tests/test_v1624_host_tool_provenance.py \
            tests/test_chatgpt_mcp_two_phase_protocol.py \
            tests/test_runtime_package_loader_contract.py \
            tests/test_v160_single_canonical_workspace_contract.py

      - name: Commit clean full update and replace staging branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/packaging/INDEPENDENT_MEMORY_PACKAGE_CONTRACT_V3.md \
                  docs/reports/JAZN_V16_2_4_HOST_TOOL_PROVENANCE_MEMORY_AUTOLOAD.md \
                  latka_jazn/bootstrap/chatgpt_recovery.py \
                  latka_jazn/cli.py \
                  latka_jazn/core/chat_command_contract.py \
                  latka_jazn/core/host_response_candidate_guard.py \
                  latka_jazn/core/response_candidate_evaluator.py \
                  latka_jazn/mcp/server.py \
                  latka_jazn/mcp/tools/jazn_finalize_reply.py \
                  latka_jazn/memory/graph_aware_retrieval.py \
                  latka_jazn/version.py \
                  tests/test_chatgpt_mcp_two_phase_protocol.py \
                  tests/test_runtime_package_loader_contract.py \
                  tests/test_v160_single_canonical_workspace_contract.py \
                  tests/test_v1624_host_tool_provenance.py
          git diff --cached --check
          git commit -m 'fix: host tool provenance and memory autoload for 16.2.4'
          git push --force origin HEAD:fix/v16.2.4-host-tool-provenance-memory-autoload
