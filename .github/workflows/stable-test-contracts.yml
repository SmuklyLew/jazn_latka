name: Stable test contracts

on:
  push:
    branches:
      - upgrade/v16.3.25.5.67-stable-test-contracts
    paths:
      - tools/jazn_tests_studio.py
      - tools/jazn_tests_studio/migrate_stable_test_contracts.py
      - .github/workflows/stable-test-contracts.yml
  pull_request:
    paths:
      - tests/**
      - tools/jazn_tests_studio.py
      - tools/jazn_tests_studio/**
      - pyproject.toml
      - latka_jazn/version.py
      - .github/workflows/stable-test-contracts.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[migration-final]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: upgrade/v16.3.25.5.67-stable-test-contracts
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Harden embedded release-token normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/jazn_tests_studio/migrate_stable_test_contracts.py')
          text = p.read_text(encoding='utf-8')
          needle = '        current = re.sub(r"^(test_)v(?:[3-9]\\d|[1-9]\\d{2,})_", r"\\1", current, flags=re.I)\n'
          replacement = needle + '        current = SYSTEM_RELEASE_TOKEN.sub("", current)\n        current = HIGH_RELEASE_TOKEN.sub("", current)\n'
          if 'current = HIGH_RELEASE_TOKEN.sub("", current)' not in text:
              if needle not in text:
                  raise SystemExit('normalization patch anchor not found')
              text = text.replace(needle, replacement, 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Apply stable-contract migration
        run: python -X utf8 tools/jazn_tests_studio/migrate_stable_test_contracts.py --apply
      - name: Compile migration surfaces
        run: |
          python -m py_compile tools/jazn_tests_studio.py
          python -m py_compile tools/jazn_tests_studio/migrate_stable_test_contracts.py
          python -m py_compile tests/test_test_suite_governance.py
      - name: Collect active suite
        run: python -m pytest --collect-only -q tests --ignore=tests/archive
      - name: Validate governance
        run: python -m pytest -q tests/test_test_suite_governance.py
      - name: Commit migrated suite
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: converge stable purpose-based contracts [migration-final]'
          git push origin HEAD:upgrade/v16.3.25.5.67-stable-test-contracts

  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Stable-contract checks
        run: python -X utf8 tools/jazn_tests_studio/migrate_stable_test_contracts.py --check
      - name: Compile Studio
        run: python -m py_compile tools/jazn_tests_studio.py tools/jazn_tests_studio/migrate_stable_test_contracts.py
      - name: Collect active suite
        run: python -m pytest --collect-only -q tests --ignore=tests/archive
      - name: Test governance
        run: python -m pytest -q tests/test_test_suite_governance.py
