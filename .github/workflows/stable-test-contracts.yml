name: Stable test contracts

on:
  push:
    branches:
      - master
      - "update/**"
      - "fix/**"
      - "hotfix/**"
      - "upgrade/**"
      - "release/**"
    paths:
      - tests/**
      - tools/jazn_tests_studio.py
      - tools/jazn_tests_studio/**
      - pyproject.toml
      - latka_jazn/version.py
      - .github/workflows/stable-test-contracts.yml
  pull_request:
    paths:
      - tests/**
      - tools/jazn_tests_studio.py
      - tools/jazn_tests_studio/**
      - pyproject.toml
      - latka_jazn/version.py
      - .github/workflows/stable-test-contracts.yml

permissions:
  contents: read

jobs:
  sync_catalog:
    name: Synchronize Test Studio catalog
    if: github.event_name == 'push' && github.ref_name != 'master'
    concurrency:
      group: jazn-branch-mutator-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.12'
      - name: Synchronize active Test Studio contracts
        run: python -X utf8 tools/jazn_tests_studio/sync_contract_catalog.py --write
      - name: Commit catalog update locally when required
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- tools/jazn_tests_studio/test_contracts.json; then
            echo "Test Studio contract catalog is already synchronized."
          else
            dirty_paths="$(
              git status --porcelain --untracked-files=all |
                sed -E 's/^.. //' |
                sed -E 's/^"//; s/"$//' |
                sort -u
            )"
            unexpected_paths="$(
              printf '%s\n' "$dirty_paths" |
                grep -Ev '^tools/jazn_tests_studio/test_contracts\.json$' || true
            )"
            if [ -n "$unexpected_paths" ]; then
              echo "Refusing catalog commit because unrelated paths are dirty:" >&2
              printf '%s\n' "$unexpected_paths" >&2
              exit 2
            fi
            git add tools/jazn_tests_studio/test_contracts.json
            git commit -m "test: synchronize Test Studio contract catalog"
          fi

      - name: Normalize origin URL for deterministic provenance
        shell: bash
        run: git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Synchronize canonical release metadata after catalog
        run: >-
          python -X utf8 -m latka_jazn.tools.release_metadata_sync
          --root .
          --base-branch master
          --write
          --json

      - name: Commit metadata after catalog and push generated sequence
        shell: bash
        run: |
          dirty_paths="$(
            git status --porcelain --untracked-files=all |
              sed -E 's/^.. //' |
              sed -E 's/^"//; s/"$//' |
              sort -u
          )"
          unexpected_paths="$(
            printf '%s\n' "$dirty_paths" |
              grep -Ev '^(PACKAGE_INTEGRITY_MANIFEST\.json|SOURCE_PROVENANCE\.json)$' || true
          )"
          if [ -n "$unexpected_paths" ]; then
            echo "Refusing generated-artifact push because unrelated paths are dirty:" >&2
            printf '%s\n' "$unexpected_paths" >&2
            exit 2
          fi

          runtime_version="$(
            python -X utf8 -c               'from latka_jazn.version import PACKAGE_VERSION_FULL; print(PACKAGE_VERSION_FULL)'
          )"
          if ! git diff --quiet -- SOURCE_PROVENANCE.json PACKAGE_INTEGRITY_MANIFEST.json; then
            git add SOURCE_PROVENANCE.json PACKAGE_INTEGRITY_MANIFEST.json
            git commit -m "release: synchronize canonical metadata for ${runtime_version} [skip ci]"
          fi

          target_branch="${GITHUB_REF#refs/heads/}"
          git fetch origin "${target_branch}"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/${target_branch}")" ]; then
            git push origin "HEAD:${target_branch}"
          else
            echo "No generated commits need to be pushed."
          fi

      - name: Verify canonical metadata is synchronized after generated catalog
        run: >-
          python -X utf8 -m latka_jazn.tools.release_metadata_sync
          --root .
          --base-branch master
          --check
          --json

  validate:
    name: Validate stable Test Studio contracts
    needs: sync_catalog
    if: >-
      always() &&
      (github.event_name == 'pull_request' ||
       needs.sync_catalog.result == 'success' ||
       needs.sync_catalog.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          # On branch pushes, validate the branch after the synchronization job
          # has had a chance to commit test_contracts.json. On PRs, keep the
          # event SHA/merge-ref semantics used by GitHub validation.
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.12'
      - name: Install test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Compile Test Studio
        run: |
          python -m py_compile tools/jazn_tests_studio.py
          python -m py_compile tools/jazn_tests_studio/progress_plugin.py
          python -m py_compile tools/jazn_tests_studio/sync_contract_catalog.py
      - name: Test live Test Studio runner
        run: python -X utf8 tools/jazn_tests_studio.py self-test
      - name: Audit GitHub Actions Node24 pins
        run: python -X utf8 tools/github_actions_node24_audit.py --root . --json
      - name: Collect active suite
        run: python -m pytest --collect-only -q tests --ignore=tests/archive
      - name: Materialize deterministic Test Studio catalog for PR validation
        if: github.event_name == 'pull_request'
        run: python -X utf8 tools/jazn_tests_studio/sync_contract_catalog.py --write
      - name: Verify deterministic Test Studio catalog
        run: python -X utf8 tools/jazn_tests_studio/sync_contract_catalog.py --check
      - name: Test governance
        run: python -m pytest -q tests/test_test_suite_governance.py
