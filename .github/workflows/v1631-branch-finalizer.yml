name: v16.3.1 branch finalizer

on:
  push:
    branches:
      - fix/v16.3.1-host-finalization-provenance-polish-nlp

permissions:
  contents: write

concurrency:
  group: v1631-branch-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified large-file edits
        run: python -X utf8 tools/_v1631_finalize_branch.py
      - name: Verify targeted source state
        shell: bash
        run: |
          grep -q 'client="chatgpt_daemon_bridge"' main.py
          ! grep -q 'client="chatgpt_bridge_one_shot_daemon_fast_path"' main.py
          grep -q 'host_tool_attestations_to_external_evidence' latka_jazn/core/chat_command_contract.py
          python -m compileall -q main.py latka_jazn/core/chat_command_contract.py
      - name: Commit finalized branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: complete host finalization binding and provenance wiring"
          git push origin HEAD:${GITHUB_REF_NAME}
