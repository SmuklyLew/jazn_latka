name: Materialize session-state compatibility fix

on:
  push:
    branches:
      - fix/ollama-session-state-compat

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Apply exact compatibility transformation
        run: python -X utf8 .github/patches/materialize_session_state_compat.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Verify focused regressions
        run: |
          python -X utf8 -m compileall -q latka_jazn/core/runtime_session.py
          python -X utf8 -m pytest -q --tb=short \
            tests/test_release_hardening_integrity_pipeline.py::test_process_user_text_restores_only_missing_timestamp_from_verified_contract \
            tests/test_release_hardening_integrity_pipeline.py::test_valid_process_user_text_has_consensus_across_public_layers

      - name: Remove one-shot materializer and commit source fix
        shell: bash
        run: |
          rm -f .github/patches/materialize_session_state_compat.py
          rm -f .github/workflows/materialize-session-state-compat.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix session-state update compatibility"

      - name: Synchronize canonical release metadata
        run: >-
          python -X utf8 -m latka_jazn.tools.release_metadata_sync
          --root . --base-branch master --write --json

      - name: Commit metadata and publish final branch
        shell: bash
        run: |
          git diff --check
          git add PACKAGE_INTEGRITY_MANIFEST.json SOURCE_PROVENANCE.json
          git commit -m "release: synchronize session-state compatibility metadata [skip ci]"
          git push origin HEAD:fix/ollama-session-state-compat
