name: v160-pylance-pack-hook-once

on:
  push:
    branches:
      - fix/v160-pylance-type-contracts

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: fix/v160-pylance-type-contracts

      - name: Make dynamic pack hooks statically explicit
        shell: bash
        run: |
          set -euo pipefail
          python -X utf8 - <<'PY'
          from pathlib import Path

          path = Path('tools/_jazn_pack_generator_memory_v2.py')
          text = path.read_text(encoding='utf-8')

          anchor = '_ORIG_RUN_PACK_WITH_PLANS = _core.run_pack_with_plans\n'
          replacement = anchor + '\n# Private compatibility helper used by the public entrypoint.\n_paint = _core._paint\n'
          if '_paint = _core._paint' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('unexpected _paint anchor count')
              text = text.replace(anchor, replacement, 1)

          old_cleanup = '_core.PackPlan.cleanup = _plan_cleanup'
          new_cleanup = 'setattr(_core.PackPlan, "cleanup", _plan_cleanup)'
          if old_cleanup in text:
              if text.count(old_cleanup) != 1:
                  raise SystemExit('unexpected PackPlan cleanup anchor count')
              text = text.replace(old_cleanup, new_cleanup, 1)
          elif new_cleanup not in text:
              raise SystemExit('PackPlan cleanup hook not found')

          old_plans = '_core.cleanup_plans = cleanup_plans'
          new_plans = 'setattr(_core, "cleanup_plans", cleanup_plans)'
          if old_plans in text:
              if text.count(old_plans) != 1:
                  raise SystemExit('unexpected cleanup_plans anchor count')
              text = text.replace(old_plans, new_plans, 1)
          elif new_plans not in text:
              raise SystemExit('cleanup_plans hook not found')

          path.write_text(text, encoding='utf-8')
          PY
          python -X utf8 -m py_compile tools/_jazn_pack_generator_memory_v2.py tools/jazn_pack_generator.py
          git diff --check

      - name: Remove one-shot workflow and commit patch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/v160-pylance-pack-hook-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/_jazn_pack_generator_memory_v2.py
          git diff --cached --check
          git commit -m "fix: make package generator hooks statically explicit"
          git push origin HEAD:fix/v160-pylance-type-contracts
