name: Apply conversation archive routing guard

on:
  push:
    branches:
      - fix/conversation-archive-routing-guard

permissions:
  contents: write

concurrency:
  group: conversation-archive-routing-guard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_BASE_SHA: 9108ab5b1ca31c54e6495a6f4d6ba273d22b9d0a
      PATCH_SHA256: c28c0d65ccf3c0aea04ac3551c923ac44ac6491952143dba1bd2a0643a1c059a
      PATCH_B64: 
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm branch lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" HEAD

      - name: Decode, verify and apply patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          payload = gzip.decompress(base64.b64decode(os.environ['PATCH_B64']))
          actual = hashlib.sha256(payload).hexdigest()
          expected = os.environ['PATCH_SHA256']
          if actual != expected:
              raise SystemExit(f'patch sha mismatch: {actual} != {expected}')
          Path('/tmp/conversation_archive_routing_guard.patch').write_bytes(payload)
          PY
          git apply --check /tmp/conversation_archive_routing_guard.patch
          git apply /tmp/conversation_archive_routing_guard.patch
          rm -f .github/workflows/apply-conversation-archive-routing-guard.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Validate update
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q latka_jazn tests
          python -m pytest -q tests/test_conversation_archive_routing_guard.py tests/test_current_line_v90_migration.py tests/test_semantic_routing_completion_v96.py
          python -m latka_jazn.tools.semantic_route_audit --root . --json
          git diff --check

      - name: Commit verified update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: disambiguate conversation archive recall routing'
          git push origin HEAD:fix/conversation-archive-routing-guard
