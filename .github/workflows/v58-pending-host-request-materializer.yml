name: v58-pending-host-request-materializer

on:
  push:
    branches:
      - fix/v16.3.25.5.58-pending-host-request-continuity-recovery

permissions:
  contents: write

jobs:
  materialize_main:
    name: materialize byte-exact v58 main.py
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch with persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Apply guarded v58 main.py patch
        shell: bash
        run: |
          set -euo pipefail
          before="$(git hash-object main.py)"
          test "$before" = "a60950eeea8711d3d682e084ae0c58f5cd337d4f"
          git apply --check .github/v58-main.patch
          git apply .github/v58-main.patch
          after="$(git hash-object main.py)"
          test "$after" = "447f1832bbe1c2e32f1c19c38bcbc5e620866355"
          python -m py_compile main.py
          git diff --check
          git rm .github/v58-main.patch .github/workflows/v58-pending-host-request-materializer.yml

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git commit -m "fix: materialize pending host request continuity"

      - name: Push without losing concurrent metadata synchronization
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            git fetch origin "$branch"
            git rebase "origin/$branch"
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
