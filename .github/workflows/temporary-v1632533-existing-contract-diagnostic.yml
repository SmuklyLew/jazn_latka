name: Temporary v16.3.25.3.3 existing contract diagnostic

on:
  push:
    branches:
      - fix/v16.3.25.3.3-chatgpt-package-discovery-bootstrap

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/v16.3.25.3.3-chatgpt-package-discovery-bootstrap
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Reuse corrected v4 repair step
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          path = Path('.github/workflows/temporary-v1632533-package-discovery-fix-v4.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          marker = '      - name: Apply v2 guarded repair and correct generated indentation'
          start = lines.index(marker)
          run_at = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
          body = []
          for line in lines[run_at + 1:]:
              if line.startswith('      - name:'):
                  break
              body.append(line)
          script = textwrap.dedent('\n'.join(body)) + '\n'
          Path('/tmp/apply-v1632533-v4.sh').write_text(script, encoding='utf-8')
          subprocess.run(['bash', '/tmp/apply-v1632533-v4.sh'], check=True)
          PY

      - name: Capture existing contract failure
        shell: bash
        run: |
          set +e
          REPORT=.repair-v1632533-existing-contract.txt
          python -m pytest -q tests/test_runtime_package_loader_contract.py > "$REPORT" 2>&1
          CODE=$?
          echo "EXIT=$CODE" >> "$REPORT"
          cat "$REPORT"
          git restore latka_jazn/packaging/split_zip_package.py latka_jazn/bootstrap/chatgpt_recovery.py latka_jazn/version.py
          rm -f tests/test_v1632533_chatgpt_package_discovery_bootstrap.py
          git add "$REPORT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: record existing loader contract failure"
          git push origin HEAD:fix/v16.3.25.3.3-chatgpt-package-discovery-bootstrap
