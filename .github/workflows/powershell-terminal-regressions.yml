name: powershell-terminal-regressions

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-powershell-regressions:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      JAZN_NETWORK_TIME_FIRST: "0"
      JAZN_NETWORK_TIME_IN_TURN: "0"
    steps:
      - name: Checkout source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install canonical runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[archive,memory-rebuild-ui]" pytest
          python -m pip check

      - name: Materialize canonical PR metadata locally
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: >-
          python -X utf8 -m latka_jazn.tools.release_metadata_sync
          --root .
          --base-branch master
          --write
          --json

      - name: Compile active Python
        shell: pwsh
        run: python -X utf8 -m compileall -q latka_jazn tests main.py run.py

      - name: Re-run exact PowerShell failure surface
        shell: pwsh
        run: >-
          python -X utf8 -m pytest
          -q -ra --tb=short --durations=25
          -m "not live_model and not live_mcp"
          tests/test_archive_io_v1638.py
          tests/test_pack_generator_archive_io_v1638.py
          tests/test_readiness_contract.py
          tests/test_release_completion.py
          tests/test_release_metadata_semantics_v163253.py
          tests/test_runtime_stability_wake_state.py
          tests/test_v16324_offline_provenance_readiness.py

      - name: Full deterministic suite in PowerShell
        shell: pwsh
        run: >-
          python -X utf8 -m pytest
          -q -ra --tb=short --durations=25
          -m "not live_model and not live_mcp"

      - name: Capture system package smoke report
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP "package-smoke-output.txt"
          $output = python -X utf8 run.py package-smoke --profile system --json 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          $output | Set-Content -LiteralPath $reportPath -Encoding utf8
          "exit_code=$exitCode" | Add-Content -LiteralPath $reportPath -Encoding utf8
          Write-Host $output
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Upload system package smoke report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-smoke-windows-report
          path: ${{ runner.temp }}/package-smoke-output.txt
          if-no-files-found: ignore

      - name: Clean checkout guard
        if: always()
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            git checkout -- SOURCE_PROVENANCE.json PACKAGE_INTEGRITY_MANIFEST.json
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dirty = @(git status --porcelain --untracked-files=all)
          if ($dirty.Count -gt 0) {
            $dirty | ForEach-Object { Write-Host $_ }
            throw "Regression tests left tracked or untracked files in the checkout."
          }
