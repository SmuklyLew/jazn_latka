name: powershell-terminal-regressions

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-powershell-regressions:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      JAZN_NETWORK_TIME_FIRST: "0"
      JAZN_NETWORK_TIME_IN_TURN: "0"
    steps:
      - name: Checkout source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12.9 (complete Windows Tcl/Tk)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.9"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install canonical runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[archive,memory-rebuild-ui]" pytest
          python -m pip check

      - name: Validate Tk assets and run real GUI tests in clean process
        shell: pwsh
        run: |
          python -X utf8 tools/windows/check_tk_runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 -m pytest -q -ra --tb=short tests/test_configuration_studio_gui_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Tcl/Tk has interpreter/thread-lifetime constraints. The 2700-test
      # omnibus session polluted native Tk startup (tcl_findLibrary) even
      # though the GUI test passed in a fresh Python process. Keep these
      # acceptance tests mandatory, but execute them before the omnibus suite
      # in their own Python interpreter; do not silently skip GUI coverage.
      - name: Run native Memory Studio GUI tests in isolated Python process
        shell: pwsh
        run: |
          python -X utf8 -m pytest -q -ra --tb=short tests/test_memory_desktop_actions_windows.py tests/test_memory_desktop_gui_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # PR events may race with source-branch catalog sync or check out a test
      # merge commit. Materialize the exact catalog in this ephemeral checkout
      # before verifying it; the clean-tree guard restores it after validation.
      # Never push generated files from this PR job.
      - name: Materialize Test Studio catalog locally for PR verification
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: python -X utf8 tools/jazn_tests_studio/sync_contract_catalog.py --write

      - name: Verify locally synchronized Test Studio catalog
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: python -X utf8 tools/jazn_tests_studio/sync_contract_catalog.py --check


      # The canonical release metadata generator intentionally refuses a dirty
      # working tree. Commit ONLY this generated catalog in the ephemeral PR
      # checkout, with no push; this gives the metadata generator a clean source
      # tree and mirrors the source branch's manifest_sync ordering.
      - name: Record synchronized PR catalog in a local-only Git commit
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $allowed = "tools/jazn_tests_studio/test_contracts.json"
          $unexpected = @(git diff --name-only | Where-Object { $_ -and $_ -ne $allowed })
          if ($unexpected.Count -gt 0) { throw "Unexpected dirty PR paths before local catalog commit: $unexpected" }
          git add -- $allowed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stagedUnexpected = @(git diff --cached --name-only | Where-Object { $_ -and $_ -ne $allowed })
          if ($stagedUnexpected.Count -gt 0) { throw "Unexpected staged paths before local catalog commit: $stagedUnexpected" }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "test: synchronize Test Studio catalog in ephemeral PR checkout"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } elseif ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          # No git push: this commit is a CI-only test fixture, never a repo update.

      - name: Materialize canonical PR metadata locally
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: >-
          python -X utf8 -m latka_jazn.tools.release_metadata_sync
          --root .
          --base-branch master
          --write
          --json

      - name: Compile active Python
        shell: pwsh
        run: python -X utf8 -m compileall -q -x 'tests[\\/]archive[\\/]' latka_jazn tests main.py run.py

      - name: Re-run exact PowerShell failure surface
        shell: pwsh
        run: >-
          python -X utf8 -m pytest
          -q -ra --tb=short --durations=25
          -m "not live_model and not live_mcp"
          tests/test_archive_io.py
          tests/test_pack_generator_archive_io.py
          tests/test_readiness_contract.py
          tests/test_release_completion.py
          tests/test_release_metadata_semantics.py
          tests/test_runtime_stability_wake_state.py
          tests/test_offline_provenance_readiness.py

      # The performance SLA is checked once in a fresh Python process.
      # A fixed wall-clock bound in the last 3% of a 2500+ test process
      # also measures prior test/plugin/GIL/Windows runner contention.
      # This does NOT relax the <5 s assertion or drop the test.
      - name: Verify isolated health-check latency and no semantic write
        shell: pwsh
        run: >-
          python -X utf8 -m pytest
          -q -ra --tb=short --durations=5
          -m "not live_model and not live_mcp"
          tests/test_turn_atomicity.py::test_isolated_health_check_is_fast_valid_and_has_no_semantic_write

      - name: Full deterministic suite in PowerShell
        shell: pwsh
        run: >-
          python -X utf8 -m pytest
          -q -ra --tb=short --durations=25
          -m "not live_model and not live_mcp"
          --ignore=tests/test_configuration_studio_gui_windows.py
          --ignore=tests/test_memory_desktop_actions_windows.py
          --ignore=tests/test_memory_desktop_gui_smoke.py
          --deselect=tests/test_turn_atomicity.py::test_isolated_health_check_is_fast_valid_and_has_no_semantic_write

      - name: Capture system package smoke report
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP "package-smoke-output.txt"
          $output = python -X utf8 run.py package-smoke --profile system --json 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          $output | Set-Content -LiteralPath $reportPath -Encoding utf8
          "exit_code=$exitCode" | Add-Content -LiteralPath $reportPath -Encoding utf8
          Write-Host $output
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Upload system package smoke report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-smoke-windows-report
          path: ${{ runner.temp }}/package-smoke-output.txt
          if-no-files-found: ignore

      - name: Clean checkout guard
        if: always()
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            git checkout -- SOURCE_PROVENANCE.json PACKAGE_INTEGRITY_MANIFEST.json tools/jazn_tests_studio/test_contracts.json
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dirty = @(git status --porcelain --untracked-files=all)
          if ($dirty.Count -gt 0) {
            $dirty | ForEach-Object { Write-Host $_ }
            throw "Regression tests left tracked or untracked files in the checkout."
          }
