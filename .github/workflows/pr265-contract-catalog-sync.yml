name: pr265-contract-catalog-sync

on:
  push:
    branches:
      - "fix/v16.3.25.5.71-pr265-ci-governance-repair"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr265-contract-catalog-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: fix/v16.3.25.5.71-pr265-ci-governance-repair

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Regenerate canonical Test Studio contract catalog
        shell: bash
        run: |
          python -X utf8 - <<'PY'
          import json
          from pathlib import Path
          from tools.jazn_tests_studio.migrate_stable_test_contracts import build_contract_catalog

          root = Path.cwd()
          catalog = build_contract_catalog(root)
          target = root / "tools" / "jazn_tests_studio" / "test_contracts.json"
          target.write_text(json.dumps(catalog, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(json.dumps({
              "active_definition_count": catalog["active_definition_count"],
              "target": target.as_posix(),
          }, ensure_ascii=False))
          PY

      - name: Verify catalog exactly matches active definitions
        shell: bash
        run: |
          python -X utf8 - <<'PY'
          import ast
          import json
          from pathlib import Path

          root = Path.cwd()
          definitions = set()
          for path in sorted((root / "tests").rglob("test_*.py")):
              if "archive" in path.parts:
                  continue
              tree = ast.parse(path.read_text(encoding="utf-8"))
              rel = path.relative_to(root).as_posix()
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name.startswith("test_"):
                      definitions.add(f"{rel}::{node.name}")
                  elif isinstance(node, ast.ClassDef) and node.name.startswith("Test"):
                      for child in node.body:
                          if isinstance(child, (ast.FunctionDef, ast.AsyncFunctionDef)) and child.name.startswith("test_"):
                              definitions.add(f"{rel}::{node.name}::{child.name}")

          payload = json.loads((root / "tools" / "jazn_tests_studio" / "test_contracts.json").read_text(encoding="utf-8"))
          contracts = payload["contracts"]
          assert set(contracts) == definitions, (sorted(definitions - set(contracts)), sorted(set(contracts) - definitions))
          missing_text = [nodeid for nodeid, item in contracts.items() if not item.get("purpose") or not item.get("expected")]
          assert not missing_text, missing_text
          print(f"verified {len(definitions)} active test contracts")
          PY
          git diff --check

      - name: Commit generated catalog only
        shell: bash
        run: |
          target_branch="fix/v16.3.25.5.71-pr265-ci-governance-repair"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/jazn_tests_studio/test_contracts.json
          if git diff --cached --quiet; then
            echo "Catalog already synchronized."
            exit 0
          fi
          git commit -m "test: synchronize Test Studio contract catalog [skip ci]"
          git pull --rebase origin "$target_branch"
          git push origin "HEAD:$target_branch"
