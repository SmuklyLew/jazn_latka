name: fix-v155-crypto-any
on:
  push:
    branches: [fix/local-first-memory-v155-crypto-typing]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/local-first-memory-v155-crypto-typing
          fetch-depth: 0
      - name: Add explicit Any import and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('latka_jazn/memory/memory_sync_crypto.py')
          text = p.read_text(encoding='utf-8')
          old = 'from typing import Mapping, Protocol\n'
          new = 'from typing import Any, Mapping, Protocol\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected typing import shape')
          p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          python -X utf8 -m compileall -q latka_jazn tests main.py run.py
          git diff --check
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latka_jazn/memory/memory_sync_crypto.py
          git commit -m "fix(memory): import Any for optional crypto modules"
          git push origin HEAD:fix/local-first-memory-v155-crypto-typing
