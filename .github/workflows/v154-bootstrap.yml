name: v15.4 architecture bootstrap

on:
  push:
    branches:
      - upgrade/v15.4.0.0-cognitive-architecture

permissions:
  contents: write

concurrency:
  group: v154-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-reviewed-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable baseline ancestry
        shell: bash
        run: |
          set -euo pipefail
          expected='b4b89616f45dae47c9f0841a617fdf48064ef462'
          git merge-base --is-ancestor "$expected" HEAD
          test "$(git merge-base "$expected" HEAD)" = "$expected"

      - name: Reassemble and verify reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .v154-bootstrap-parts/part_* > /tmp/v154.patch.gz.b64
          test "$(wc -c < /tmp/v154.patch.gz.b64)" -eq 66660
          base64 -d /tmp/v154.patch.gz.b64 > /tmp/v154.patch.gz
          printf '%s  %s\n' 'f6dfb5cbafde62d44797956b4d64d4d6425dcc46265c2882cc004d94051703a5' '/tmp/v154.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v154.patch.gz > /tmp/v154.patch
          git apply --check /tmp/v154.patch

      - name: Apply reviewed v15.4 source update
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/v154.patch
          python - <<'PY'
          from pathlib import Path
          for name in (
              'docs/plans/JAZN_V15_4_0_0_COGNITIVE_ARCHITECTURE.md',
              'docs/reports/JAZN_V15_4_0_0_IMPLEMENTATION_REPORT.md',
          ):
              path = Path(name)
              lines = path.read_text(encoding='utf-8').splitlines()
              path.write_text('\n'.join(line.rstrip() for line in lines).rstrip() + '\n', encoding='utf-8')
          PY
          rm -rf .v154-bootstrap-parts
          git checkout HEAD -- .github/workflows/release-hardening.yml

      - name: Static safety gates before push
        shell: bash
        run: |
          set -euo pipefail
          python -X utf8 -m compileall -q latka_jazn tests
          forbidden="$(git diff --name-only --diff-filter=ACMR HEAD -- | grep -E '(^memory/|(^|/)(runtime_write|runtime_audit|chat_context).*\.sqlite3($|-)|\.sqlite3-(wal|shm)$|\.zip($|\.)|capability\.token$)' || true)"
          if [ -n "$forbidden" ]; then
            echo 'Forbidden runtime/private/package artifacts in source update:' >&2
            printf '%s\n' "$forbidden" >&2
            exit 1
          fi

      - name: Commit source update without workflow mutation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'feat: upgrade Jaźń cognitive architecture to v15.4.0.0'
          git push origin HEAD:upgrade/v15.4.0.0-cognitive-architecture
