name: Bootstrap release-safe package generator v8.4

on:
  push:
    branches:
      - automation/release-safe-package-generator-v84-bootstrap
    paths:
      - .automation/release-safe-generator-v84/TRIGGER

permissions:
  contents: write

concurrency:
  group: bootstrap-release-safe-generator-v84
  cancel-in-progress: false

jobs:
  publish-clean-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      BASE_SHA: 6c6c3acc2485324e9a2e1b385811f17f5bebf7f7
      TARGET_BRANCH: fix/release-safe-package-generator-v84
      PATCH_SHA256: c7422ec11910d7edbf4261b5c0fc1685c59272e84105559612754bb661cbc5e5
    steps:
      - name: Checkout technical bootstrap branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Reconstruct and verify exact patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .automation/release-safe-generator-v84/chunks -maxdepth 1 -type f -name 'chunk-*' | wc -l)" -eq 101
          cat .automation/release-safe-generator-v84/chunks/chunk-* \
            | base64 --decode > "$RUNNER_TEMP/generator-v84.patch"
          echo "${PATCH_SHA256}  ${RUNNER_TEMP}/generator-v84.patch" | sha256sum --check -
          test "$(wc -c < "$RUNNER_TEMP/generator-v84.patch")" -eq 75477

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Apply and validate the clean source change
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$BASE_SHA"
          git switch --detach "$BASE_SHA"
          git switch -c "$TARGET_BRANCH"
          git apply --check "$RUNNER_TEMP/generator-v84.patch"
          git apply "$RUNNER_TEMP/generator-v84.patch"
          git diff --check

          git add -A
          git diff --cached --name-only | sort > "$RUNNER_TEMP/changed.txt"
          cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          latka_jazn/tools/package_integrity.py
          latka_jazn/tools/release_metadata_sync.py
          tests/test_jazn_pack_generator_v82_contract.py
          tests/test_jazn_pack_generator_v83_contract.py
          tests/test_jazn_pack_generator_v84_contract.py
          tests/test_package_integrity_canonical_worktree.py
          tests/test_release_metadata_generator_dirty_policy.py
          tools/jazn_pack_generator.py
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/expected.txt"
          sort -o "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/changed.txt"

          python -X utf8 -m compileall -q latka_jazn tests main.py run.py tools/jazn_pack_generator.py
          python -X utf8 tools/jazn_pack_generator.py self-test
          python -X utf8 -m pytest -q \
            tests/test_jazn_pack_generator_v82_contract.py \
            tests/test_jazn_pack_generator_v82_dashboard.py \
            tests/test_jazn_pack_generator_v84_contract.py \
            tests/test_package_integrity_canonical_worktree.py \
            tests/test_package_integrity_zip_verification.py \
            tests/test_release_metadata_generator_dirty_policy.py \
            tests/test_release_metadata_canonical_git.py \
            tests/test_runtime_stability_provenance.py

      - name: Commit clean generator source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(generator): preserve release metadata consistency"

      - name: Synchronize canonical release metadata
        shell: bash
        run: |
          set -euo pipefail
          python -X utf8 -m latka_jazn.tools.release_metadata_sync \
            --root . \
            --base-branch master \
            --write \
            --json

          git diff --name-only | sort > "$RUNNER_TEMP/metadata-changed.txt"
          printf '%s\n' PACKAGE_INTEGRITY_MANIFEST.json SOURCE_PROVENANCE.json \
            | sort > "$RUNNER_TEMP/metadata-expected.txt"
          diff -u "$RUNNER_TEMP/metadata-expected.txt" "$RUNNER_TEMP/metadata-changed.txt"
          git diff --check
          git add SOURCE_PROVENANCE.json PACKAGE_INTEGRITY_MANIFEST.json
          git commit -m "release: synchronize metadata for generator v8.4"

          python -X utf8 -m latka_jazn.tools.release_metadata_sync \
            --root . \
            --base-branch master \
            --check \
            --json
          test -z "$(git status --porcelain)"

      - name: Publish isolated clean branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
