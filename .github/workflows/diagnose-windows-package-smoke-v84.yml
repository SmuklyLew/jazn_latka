name: inspect-windows-package-smoke-v84-fix

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Extract failed focused-test log
        shell: bash
        run: |
          gh run view 30173836765 \
            --repo SmuklyLew/jazn_latka \
            --job 89719307310 \
            --log > "$RUNNER_TEMP/focused-test-failure.log"
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "focused-test-failure.log"
          lines = path.read_text(encoding="utf-8-sig", errors="replace").splitlines()
          selected = []
          marker = "\tRun focused regression tests\t"
          for line in lines:
              if marker in line:
                  selected.append(line.split(marker, 1)[1])
          excerpt = Path(os.environ["RUNNER_TEMP"]) / "focused-test-failure-excerpt.log"
          excerpt.write_text("\n".join(selected) + "\n", encoding="utf-8")
          print(excerpt.read_text(encoding="utf-8"))
          PY

      - name: Upload focused-test failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: focused-test-failure-v84
          path: ${{ runner.temp }}/focused-test-failure-excerpt.log
          retention-days: 2
