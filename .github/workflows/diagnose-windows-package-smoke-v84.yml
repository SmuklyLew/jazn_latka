name: inspect-windows-package-smoke-v84-compile

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    if: github.event.pull_request.number == 76
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Extract compile failure
        shell: bash
        run: |
          gh run view 30174082518 \
            --repo SmuklyLew/jazn_latka \
            --job 89719930964 \
            --log > "$RUNNER_TEMP/compile-failure.log"
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "compile-failure.log"
          lines = path.read_text(encoding="utf-8-sig", errors="replace").splitlines()
          selected = []
          marker = "\tCompile changed files\t"
          for line in lines:
              if marker in line:
                  selected.append(line.split(marker, 1)[1])
          excerpt = Path(os.environ["RUNNER_TEMP"]) / "compile-failure-excerpt.log"
          excerpt.write_text("\n".join(selected) + "\n", encoding="utf-8")
          print(excerpt.read_text(encoding="utf-8"))
          PY

      - name: Upload compile failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compile-failure-v84
          path: ${{ runner.temp }}/compile-failure-excerpt.log
          retention-days: 2
