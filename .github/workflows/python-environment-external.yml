name: External Python environment policy

on:
  push:
    branches:
      - "fix/v12717-external-python-policy-20261117"
      - "fix/v12718-autobiographical-memory-claim-truth-20261117"
    paths:
      - "latka_jazn/dependencies/environment_manager.py"
      - "latka_jazn/dependencies/environment.py"
      - "tools/jazn_run_studio/**"
      - "run_studio.py"
      - "tests/test_external_python_environment_policy.py"
      - "tests/test_external_python_mutation_guards.py"
      - "tests/test_private_python_handoff_guard.py"
      - "tests/test_studio_python_handoff_behavior.py"
      - ".github/workflows/python-environment-external.yml"
  pull_request:
    paths:
      - "latka_jazn/dependencies/environment_manager.py"
      - "latka_jazn/dependencies/environment.py"
      - "tools/jazn_run_studio/**"
      - "run_studio.py"
      - "tests/test_external_python_environment_policy.py"
      - "tests/test_external_python_mutation_guards.py"
      - "tests/test_private_python_handoff_guard.py"
      - "tests/test_studio_python_handoff_behavior.py"
      - ".github/workflows/python-environment-external.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-python-regressions:
    name: External Pythons (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install test-only optional GUI profile
        run: python -m pip install -e ".[run-studio]" pytest
      - name: Compile targeted source
        run: >-
          python -m compileall -q
          latka_jazn/dependencies/environment_manager.py
          latka_jazn/dependencies/environment.py
          tools/jazn_run_studio/core.py
          tools/jazn_run_studio/first_run.py
          run_studio.py
          tests/test_external_python_environment_policy.py
          tests/test_external_python_mutation_guards.py
          tests/test_private_python_handoff_guard.py
          tests/test_studio_python_handoff_behavior.py
      - name: Verify External is read-only and legacy behavior survives
        run: >-
          python -X utf8 -m pytest -q -ra --tb=short
          tests/test_external_python_environment_policy.py
          tests/test_external_python_mutation_guards.py
          tests/test_private_python_handoff_guard.py
          tests/test_studio_python_handoff_behavior.py
          tests/test_private_python_selection.py
      - name: Verify whitespace
        run: git diff --check
