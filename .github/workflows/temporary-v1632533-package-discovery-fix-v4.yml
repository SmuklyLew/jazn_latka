name: Temporary v16.3.25.3.3 package discovery repair v4

on:
  push:
    branches:
      - fix/v16.3.25.3.3-chatgpt-package-discovery-bootstrap

permissions:
  contents: write

jobs:
  apply-validate-and-self-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/v16.3.25.3.3-chatgpt-package-discovery-bootstrap
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Apply v2 guarded repair and correct generated indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          source = Path('.github/workflows/temporary-v1632533-package-discovery-fix-v2.yml')
          lines = source.read_text(encoding='utf-8').splitlines()
          marker = '      - name: Apply guarded source repair'
          start = lines.index(marker)
          run_at = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
          body = []
          for line in lines[run_at + 1:]:
              if line.startswith('      - name:'):
                  break
              body.append(line)
          script = textwrap.dedent('\n'.join(body)) + '\n'
          Path('/tmp/apply-v1632533.sh').write_text(script, encoding='utf-8')
          subprocess.run(['bash', '/tmp/apply-v1632533.sh'], check=True)

          path = Path('latka_jazn/bootstrap/chatgpt_recovery.py')
          rows = path.read_text(encoding='utf-8').splitlines()

          def indent_range(start_text: str, end_text: str, spaces: int, *, occurrence: int = 1, include_end: bool = False) -> None:
              starts = [i for i, row in enumerate(rows) if row.strip() == start_text]
              if len(starts) < occurrence:
                  raise SystemExit(f'missing indentation start: {start_text!r}')
              start_idx = starts[occurrence - 1]
              end_idx = next(
                  i for i in range(start_idx + 1, len(rows))
                  if rows[i].strip() == end_text
              )
              stop = end_idx + 1 if include_end else end_idx
              prefix = ' ' * spaces
              for idx in range(start_idx, stop):
                  if rows[idx].strip():
                      rows[idx] = prefix + rows[idx]

          indent_range(
              'runtime_profiles = frozenset({"system", "combined", "unknown"})',
              'preflight = runtime_preflight(destination)',
              4,
          )
          indent_range(
              'if incoming_zip_name is not None:',
              'if auto_attach_memory:',
              8,
          )
          indent_range(
              'if incoming_zip_name is None:',
              'package_set = incoming_package_set or load_package_set_metadata(parts_dir, zip_name)',
              4,
              include_end=True,
          )
          path.write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY

      - name: Compile active Python
        run: python -m compileall -q latka_jazn tests main.py run.py

      - name: Run new package discovery regressions
        run: python -m pytest -q tests/test_v1632533_chatgpt_package_discovery_bootstrap.py

      - name: Run existing runtime package loader contract
        run: python -m pytest -q tests/test_runtime_package_loader_contract.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit validated repair and remove temporary diagnostics
        shell: bash
        run: |
          git rm .github/workflows/temporary-v1632533-package-discovery-fix.yml
          git rm .github/workflows/temporary-v1632533-package-discovery-fix-v2.yml
          git rm .github/workflows/temporary-v1632533-package-discovery-diagnostic.yml
          git rm .github/workflows/temporary-v1632533-package-discovery-fix-v4.yml
          git rm .repair-v1632533-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latka_jazn/packaging/split_zip_package.py latka_jazn/bootstrap/chatgpt_recovery.py latka_jazn/version.py tests/test_v1632533_chatgpt_package_discovery_bootstrap.py
          git diff --cached --check
          git commit -m "fix: repair ChatGPT package discovery bootstrap"
          git push origin HEAD:fix/v16.3.25.3.3-chatgpt-package-discovery-bootstrap
