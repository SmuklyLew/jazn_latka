name: temporary-package-distribution-convergence

on:
  push:
    branches:
      - upgrade/v16.3.25.3.15-package-distribution-convergence
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      JAZN_RELEASE_BASE_BRANCH: master
      JAZN_NETWORK_TIME_FIRST: "0"
      JAZN_NETWORK_TIME_IN_TURN: "0"
      JAZN_ALLOW_NETWORK: "0"
      JAZN_DICTIONARY_ALLOW_NETWORK: "0"
      JAZN_MODEL_ADAPTER: "null"
    steps:
      - name: Checkout convergence branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: upgrade/v16.3.25.3.15-package-distribution-convergence

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Set up Node for Pyright
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Validate and apply convergence driver
        shell: bash
        run: |
          python -X utf8 tools/_fix_scaffold.py
          python -X utf8 -m py_compile tools/_apply_distribution_convergence.py
          python -X utf8 tools/_apply_distribution_convergence.py
          rm -f tools/_apply_distribution_convergence.py tools/_fix_scaffold.py .github/workflows/_temporary_distribution_convergence.yml

      - name: Install development validation dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[memory-rebuild-ui]" pytest
          npm install --global pyright@1.1.411

      - name: Synchronize canonical release metadata
        shell: bash
        run: >-
          python -X utf8 -m latka_jazn.tools.release_metadata_sync
          --root . --base-branch master --write --json

      - name: Generator bundle freshness
        run: python -X utf8 tools/build_jazn_pack_generator_bundle.py --check

      - name: Compile active Python
        run: python -X utf8 -m compileall -q latka_jazn tests tools/build_jazn_pack_generator_bundle.py main.py run.py

      - name: Focused convergence regression suite
        run: >-
          python -X utf8 -m pytest -q -ra --tb=short
          tests/test_package_distribution_convergence_v16325315.py
          tests/test_release_completion.py
          tests/test_runtime_package_loader_contract.py
          tests/test_release_hardening_safe_paths.py
          tests/test_zip_resource_limits.py
          tests/test_dependency_studio_v1632539.py
          tests/test_independent_memory_package_contract_v2.py
          tests/test_jazn_pack_generator_v84_contract.py
          tests/test_jazn_pack_generator_v82_contract.py
          tests/test_jazn_pack_generator_v16311_profiles.py
          tests/test_jazn_pack_generator_two_file_bundle_v87.py
          tests/test_jazn_pack_generator_v87_studio_portability.py

      - name: Static type audit of convergence surface
        run: >-
          pyright
          latka_jazn/packaging/package_plan.py
          latka_jazn/packaging/package_set_contract.py
          latka_jazn/packaging/memory_transaction.py
          latka_jazn/dependencies/release_artifact.py
          latka_jazn/tools/safe_paths.py
          tools/build_jazn_pack_generator_bundle.py
          tools/jazn_pack_generator.py

      - name: Full deterministic suite
        run: >-
          python -X utf8 -m pytest
          -q -ra --tb=short --durations=30
          -m "not live_model and not live_mcp"

      - name: Runtime diagnostics on prepared tree
        run: |
          python -X utf8 run.py doctor --json
          python -X utf8 run.py package-smoke --profile system --json
          git diff --check

      - name: Commit validated implementation locally
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "upgrade: converge package distribution contracts v16.3.25.3.15"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Validate clean release artifact before push
        shell: bash
        run: |
          python -X utf8 run.py package-smoke --profile release --json
          python -X utf8 run.py release-build --output "$RUNNER_TEMP/jazn-convergence-release.zip" --json
          test -f "$RUNNER_TEMP/jazn-convergence-release.zip"
          test -f "$RUNNER_TEMP/jazn-convergence-release.zip.package.json"
          test -f "$RUNNER_TEMP/jazn-convergence-release.zip.parts.sha256"
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Push validated convergence commit
        shell: bash
        run: git push origin HEAD:upgrade/v16.3.25.3.15-package-distribution-convergence
