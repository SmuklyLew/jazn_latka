name: apply-v15420-rest-dream-patch

on:
  push:
    branches:
      - update/v15420-rest-replay-dream-continuity-20260811
    paths:
      - .github/workflows/apply-v15420-rest-dream-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: update/v15420-rest-replay-dream-continuity-20260811

      - name: Verify transport scope and reconstruct patch
        shell: bash
        run: |
          set -euo pipefail
          base=b0c19d46db371c9362dca82b5cc23bc2dae21945
          git merge-base --is-ancestor "$base" HEAD
          unexpected="$(git diff --name-only "$base"...HEAD | grep -Ev '^\.github/(v15420_patch_.*\.b64|workflows/apply-v15420-rest-dream-patch\.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected pre-existing branch changes:" >&2
            echo "$unexpected" >&2
            exit 2
          fi

          cat > /tmp/v15420.fragments.sha256 <<'EOF'
          27894571c54e21ce1d92f7ff5e7960ab2a580adc00636734782812f63f46890c  .github/v15420_patch_00.b64
          eb4f0540c942c7e888ae0d3e3439360343335a40487e4842ec71585dad6e1c00  .github/v15420_patch_01_00.b64
          0edb819e0626e381922f28b07a22ca3195e8c060a7b5e151f0eaa114693507fd  .github/v15420_patch_01_01.b64
          20391aafae0584733322e28bea5d7d7f0e51d19eb91bdc1bccda7db8cc5899c6  .github/v15420_patch_01_02.b64
          b500a54df84a2d0829b64341634ca5dd654982d04236e303ca6b5aa871d90d7c  .github/v15420_patch_01_03.b64
          b1139841b9e6687cee1eebfc54cc9852ca143b0a683544265b74d26d6ca558c5  .github/v15420_patch_02_00_00.b64
          1a0ac06c03d1c16796d252dc8606dc743fe614f94fcda23e962e8b4bd235ddaf  .github/v15420_patch_02_00_01.b64
          9f896a6ed1176a38bbabc8aa6b5f5961e8ac460164389b95e637d9a6a6cf90c2  .github/v15420_patch_02_00_02.b64
          ef967dd0c9862db923865305095be4d0a1eebfa65000740a00a5bde62e85a815  .github/v15420_patch_02_00_03_00.b64
          7272506fc4d53dbcbe3a7a096bfaa7416551747f0b838d523d52473394a8de1c  .github/v15420_patch_02_00_03_01.b64
          b0fa02212744b31778a6d7dc7da030ca4539711047a43f7c6162730aa37df3da  .github/v15420_patch_02_00_03_02.b64
          e74c913d937413ecd59f1f8e9b1af68670e6297588db90585b418eaac1a251c2  .github/v15420_patch_02_01.b64
          2879f65632d03fc7c7f55eb08b1784660b048c8f548321e2ef491ab0d52642aa  .github/v15420_patch_02_02.b64
          583d77e6d3a6017a4fc8a99c065b723607f80977625da354c5191c23deef772a  .github/v15420_patch_02_03.b64
          96165abfc52c9a68e8b6e644b5449beba825877cfaba198a871e6a1cab0a475c  .github/v15420_patch_03.b64
          EOF
          sha256sum -c /tmp/v15420.fragments.sha256

          cat \
            .github/v15420_patch_00.b64 \
            .github/v15420_patch_01_00.b64 \
            .github/v15420_patch_01_01.b64 \
            .github/v15420_patch_01_02.b64 \
            .github/v15420_patch_01_03.b64 \
            .github/v15420_patch_02_00_00.b64 \
            .github/v15420_patch_02_00_01.b64 \
            .github/v15420_patch_02_00_02.b64 \
            .github/v15420_patch_02_00_03_00.b64 \
            .github/v15420_patch_02_00_03_01.b64 \
            .github/v15420_patch_02_00_03_02.b64 \
            .github/v15420_patch_02_01.b64 \
            .github/v15420_patch_02_02.b64 \
            .github/v15420_patch_02_03.b64 \
            .github/v15420_patch_03.b64 \
            > /tmp/v15420.patch.gz.b64

          test "$(wc -c < /tmp/v15420.patch.gz.b64 | tr -d ' ')" = "46388"
          base64 -d /tmp/v15420.patch.gz.b64 | gzip -dc > /tmp/v15420.patch
          echo '54e17acc965f4887bc7b917adffa57cf69f669a48b7f12553ff8af168bf9301a  /tmp/v15420.patch' | sha256sum -c -
          git apply --check /tmp/v15420.patch

      - name: Apply verified update and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/v15420.patch
          rm -f .github/v15420_patch_*.b64
          rm -f .github/workflows/apply-v15420-rest-dream-patch.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add auditable rest replay and dream continuity'
          git push origin HEAD:update/v15420-rest-replay-dream-continuity-20260811
