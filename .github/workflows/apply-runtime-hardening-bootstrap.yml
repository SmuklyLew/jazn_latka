name: apply-runtime-hardening-bootstrap

on:
  push:
    branches:
      - update/runtime-hardening-bootstrap
    paths:
      - .github/runtime-hardening-ready

permissions:
  contents: write

concurrency:
  group: runtime-hardening-bootstrap
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.repository == 'SmuklyLew/jazn_latka'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_SHA: 30a30593901e0b8d24ba6f443f8f67d91d5078e1
      TARGET_BRANCH: update/v15.1.0.3.90-runtime-hardening
      PATCH_PAYLOAD_BLOB_SHA: ed54cb7abc503d5116a5c67988ffdba3b75e7c34
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      JAZN_NETWORK_TIME_FIRST: '0'
      JAZN_NETWORK_TIME_IN_TURN: '0'
      JAZN_ALLOW_NETWORK: '0'
      JAZN_DICTIONARY_ALLOW_NETWORK: '0'
      JAZN_MODEL_ADAPTER: 'null'
    steps:
      - name: Checkout verified bootstrap payload
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: update/runtime-hardening-bootstrap
          fetch-depth: 1
          path: bootstrap

      - name: Checkout target branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: update/v15.1.0.3.90-runtime-hardening
          fetch-depth: 0
          path: target

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            target/requirements.txt
            target/pyproject.toml

      - name: Decode and verify exact patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          actual_blob_sha="$(git -C bootstrap hash-object .github/runtime-hardening.patch.gz.b64)"
          echo "payload_blob_sha=${actual_blob_sha}"
          test "${actual_blob_sha}" = "${PATCH_PAYLOAD_BLOB_SHA}"
          python - <<'PY'
          from __future__ import annotations
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          source = Path('bootstrap/.github/runtime-hardening.patch.gz.b64')
          encoded = source.read_text(encoding='ascii')
          compressed = base64.b64decode(encoded, validate=False)
          patch = gzip.decompress(compressed)
          output = Path('runtime-hardening.patch')
          output.write_bytes(patch)
          print(f'patch_bytes={len(patch)}')
          print(f'patch_sha256={hashlib.sha256(patch).hexdigest()}')
          PY
          test "$(git -C target rev-parse HEAD)" = "${BASE_SHA}"
          git -C target diff --quiet
          git -C target diff --cached --quiet
          if git -C target apply --check --whitespace=nowarn ../runtime-hardening.patch; then
            echo 'mode=plain' >> "${GITHUB_OUTPUT}"
          elif git -C target apply --3way --check --whitespace=nowarn ../runtime-hardening.patch; then
            echo 'mode=threeway' >> "${GITHUB_OUTPUT}"
          else
            echo 'Patch does not apply in plain or three-way mode.' >&2
            git -C target apply --check --verbose --whitespace=nowarn ../runtime-hardening.patch || true
            exit 1
          fi

      - name: Apply patch and enforce repository boundaries
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.patch.outputs.mode }}" = 'threeway' ]; then
            git -C target apply --3way --whitespace=nowarn ../runtime-hardening.patch
          else
            git -C target apply --whitespace=nowarn ../runtime-hardening.patch
          fi
          git -C target diff --check
          test -z "$(git -C target status --porcelain -- memory workspace_runtime '*.sqlite' '*.sqlite3' '*.db' '*.zip' '*.log')"
          test -z "$(git -C target diff --name-only -- .archives)"

      - name: Install test environment
        working-directory: target
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile active Python
        working-directory: target
        run: python -X utf8 -m compileall -q latka_jazn tests main.py run.py

      - name: Run full non-live test suite
        working-directory: target
        run: >-
          python -X utf8 -m pytest -q -ra --tb=short
          -m "not live_model and not live_mcp"

      - name: Commit validated runtime update
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .github latka_jazn main.py pyproject.toml requirements.txt tests
          forbidden="$({ git diff --cached --name-only || true; } | grep -E '^(memory/|workspace_runtime/|.*\.(sqlite3?|db)(-|$)|.*\.zip(\.|$)|.*\.log$)' || true)"
          test -z "$forbidden"
          test -z "$(git diff --cached --name-only -- .archives)"
          git diff --cached --check
          git commit -m "fix: harden runtime contracts and persistence"

      - name: Synchronize canonical release metadata
        working-directory: target
        run: >-
          python -X utf8 -m latka_jazn.tools.release_metadata_sync
          --root . --base-branch master --write --json --no-progress

      - name: Commit canonical release metadata
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git add SOURCE_PROVENANCE.json PACKAGE_INTEGRITY_MANIFEST.json
          git diff --cached --check
          git commit -m "release: synchronize canonical metadata for v15.1.0.3.90"

      - name: Verify metadata, doctor and package smoke
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python -X utf8 -m latka_jazn.tools.release_metadata_sync \
            --root . --base-branch master --check --json --no-progress
          python -X utf8 run.py doctor --json
          python -X utf8 run.py package-smoke --profile system --json
          python -X utf8 run.py package-smoke --profile release --json
          python -X utf8 -m pytest -q tests/test_runtime_full_turn.py
          python -X utf8 -m pytest -q tests/test_single_source_version_manifest_contract.py
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Push validated commits to target branch
        working-directory: target
        run: git push origin "HEAD:${TARGET_BRANCH}"
