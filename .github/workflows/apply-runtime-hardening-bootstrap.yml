name: apply-runtime-hardening-bootstrap

on:
  push:
    branches:
      - update/runtime-hardening-bootstrap
    paths:
      - .github/runtime-hardening-ready

permissions:
  contents: write

concurrency:
  group: runtime-hardening-recovery-v4
  cancel-in-progress: true

jobs:
  recover-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout bootstrap history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: update/runtime-hardening-bootstrap
          fetch-depth: 0
      - name: Recover verified transport v4
        shell: bash
        run: python -X utf8 .github/scripts/recover_runtime_hardening_v4.py
      - name: Commit recovery result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/runtime-hardening-patch-v3/part-0005.b64 \
                  .github/runtime-hardening-patch-v4 \
                  .github/runtime-hardening-recover-v4-status.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'ci: recover verified runtime hardening transport v4'
          git push origin HEAD:update/runtime-hardening-bootstrap
