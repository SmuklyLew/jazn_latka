name: apply-v1634-hardening

on:
  push:
    branches:
      - 16.3.4-complex-dialogue-memory-routing-hardening-go-true
    paths:
      - ".github/v1634-payload/**"
      - ".github/workflows/apply-v1634-hardening.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Assemble verify and apply payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github/v1634-payload -maxdepth 1 -type f -name 'part*' | wc -l)" -eq 6
          cat .github/v1634-payload/part* > /tmp/v1634.patch.gz.b64
          echo "95313616ea2d7c6e6efb32d3aef83d82462d9e464a09f7140b996d2c2256434c  /tmp/v1634.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/v1634.patch.gz.b64 > /tmp/v1634.patch.gz
          echo "a7eddb6fc41b2297d7ae30c5661425eea013552105578b9b5147e40dd55ac305  /tmp/v1634.patch.gz" | sha256sum -c -
          gzip -dc /tmp/v1634.patch.gz > /tmp/v1634.patch
          echo "3e83eed84cb36ddeffa80cfb2cd863e352994fc061827d89bd4f61430417021c  /tmp/v1634.patch" | sha256sum -c -
          patch --dry-run -p0 < /tmp/v1634.patch
          patch -p0 < /tmp/v1634.patch
          rm -rf .github/v1634-payload .github/workflows/apply-v1634-hardening.yml

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[memory-rebuild-ui]" pytest

      - name: Compile Python tree
        run: python -X utf8 -m compileall -q latka_jazn tests main.py run.py

      - name: Run hardening regression suite
        run: >-
          python -X utf8 -m pytest -q
          tests/test_v1634_complex_dialogue_memory_routing.py
          tests/test_nlp_capability_contract.py
          tests/test_semantic_routing_completion_v96.py
          tests/test_conversation_archive_routing_guard.py
          tests/test_quoted_control_text_routing.py
          tests/test_v1630_dialogue_memory_anchor.py
          tests/test_code_health_regressions.py

      - name: Commit hardening update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: harden complex dialogue memory routing for 16.3.4"
          git push origin HEAD:16.3.4-complex-dialogue-memory-routing-hardening-go-true

      - name: Synchronize canonical release metadata
        shell: bash
        run: |
          set -euo pipefail
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          python -X utf8 -m latka_jazn.tools.release_metadata_sync --root . --base-branch master --write --json

      - name: Commit release metadata when changed
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- PACKAGE_INTEGRITY_MANIFEST.json SOURCE_PROVENANCE.json; then
            git add PACKAGE_INTEGRITY_MANIFEST.json SOURCE_PROVENANCE.json
            git commit -m "release: synchronize canonical metadata for 16.3.4-complex-dialogue-memory-routing-hardening [skip ci]"
            git push origin HEAD:16.3.4-complex-dialogue-memory-routing-hardening-go-true
          fi
