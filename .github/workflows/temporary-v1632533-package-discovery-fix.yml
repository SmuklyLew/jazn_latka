name: Temporary v16.3.25.3.3 package discovery repair

on:
  push:
    branches:
      - fix/v16.3.25.3.3-chatgpt-package-discovery-bootstrap

permissions:
  contents: write

concurrency:
  group: temporary-v1632533-package-discovery-fix
  cancel-in-progress: false

jobs:
  apply-validate-and-self-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/v16.3.25.3.3-chatgpt-package-discovery-bootstrap
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply guarded source repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          split_path = "latka_jazn/packaging/split_zip_package.py"
          split_text = Path(split_path).read_text(encoding="utf-8")

          old_sidecar_block = '''def _find_package_sidecar(parts_dir: Path, base_zip_name: str) -> tuple[Path | None, dict[str, Any] | None]:
              exact = parts_dir / f"{base_zip_name}.package.json"
              if exact.is_file():
                  return exact, _read_package_sidecar(exact)

              matches: list[tuple[Path, dict[str, Any]]] = []
              for candidate in sorted(parts_dir.glob("*.json")):
                  if candidate == exact or ".package" not in candidate.name:
                      continue
                  try:
                      payload = _read_package_sidecar(candidate)
                      declared_name = sanitize_zip_name(str(payload.get("package_name") or ""))
                  except (OSError, UnicodeError, json.JSONDecodeError, TypeError, ValueError):
                      continue
                  if declared_name == base_zip_name:
                      matches.append((candidate, payload))
              if len(matches) > 1:
                  raise ValueError(
                      "Niejednoznaczne sidecary package.json dla paczki "
                      f"{base_zip_name!r}: " + ", ".join(path.name for path, _ in matches)
                  )
              return matches[0] if matches else (None, None)
          '''
          old_sidecar_block = textwrap.dedent(old_sidecar_block)
          new_sidecar_block = '''def discover_package_sidecars(parts_dir: Path) -> list[tuple[Path, dict[str, Any]]]:
              """Return valid current package sidecars, including host-renamed uploads.

              Chat hosts may rename ``archive.zip.package.json`` to forms such as
              ``archive.zip.package(1).json``. Discovery therefore uses the declared
              ``package_name`` as canonical identity instead of trusting the upload name.
              """

              directory = Path(parts_dir).expanduser().resolve()
              discovered: list[tuple[Path, dict[str, Any]]] = []
              for candidate in sorted(directory.glob("*.json")):
                  if ".package" not in candidate.name:
                      continue
                  try:
                      payload = _read_package_sidecar(candidate)
                      sanitize_zip_name(str(payload.get("package_name") or ""))
                  except (OSError, UnicodeError, json.JSONDecodeError, TypeError, ValueError):
                      continue
                  discovered.append((candidate, payload))
              return discovered


          def _find_package_sidecar(parts_dir: Path, base_zip_name: str) -> tuple[Path | None, dict[str, Any] | None]:
              exact = parts_dir / f"{base_zip_name}.package.json"
              if exact.is_file():
                  return exact, _read_package_sidecar(exact)

              matches: list[tuple[Path, dict[str, Any]]] = []
              for candidate, payload in discover_package_sidecars(parts_dir):
                  if candidate == exact:
                      continue
                  declared_name = sanitize_zip_name(str(payload.get("package_name") or ""))
                  if declared_name == base_zip_name:
                      matches.append((candidate, payload))
              if len(matches) > 1:
                  raise ValueError(
                      "Niejednoznaczne sidecary package.json dla paczki "
                      f"{base_zip_name!r}: " + ", ".join(path.name for path, _ in matches)
                  )
              return matches[0] if matches else (None, None)
          '''
          new_sidecar_block = textwrap.dedent(new_sidecar_block)
          if split_text.count(old_sidecar_block) != 1:
              raise SystemExit("split_zip_package.py: _find_package_sidecar target drifted")
          split_text = split_text.replace(old_sidecar_block, new_sidecar_block, 1)

          old_infer = '''def infer_base_zip_name(parts_dir: Path, base_zip_name: str | None = None) -> str:
              parts_dir = Path(parts_dir).expanduser().resolve()

              if base_zip_name:
                  return sanitize_zip_name(base_zip_name)

              current_sidecars = sorted(parts_dir.glob("*.zip.package.json"))
              legacy_sidecars = sorted(parts_dir.glob("*.zip.manifest.json"))
              sidecar_names = {
                  path.name[: -len(".package.json")]
                  for path in current_sidecars
              } | {
                  path.name[: -len(".manifest.json")]
                  for path in legacy_sidecars
              }
              for candidate in sorted(parts_dir.glob("*.json")):
                  if candidate in current_sidecars or ".package" not in candidate.name:
                      continue
                  try:
                      payload = _read_package_sidecar(candidate)
                      declared_name = sanitize_zip_name(str(payload.get("package_name") or ""))
                  except (OSError, UnicodeError, json.JSONDecodeError, TypeError, ValueError):
                      continue
                  sidecar_names.add(declared_name)
              if len(sidecar_names) == 1:
                  return next(iter(sidecar_names))

              groups: dict[str, int] = {}
              for part in parts_dir.glob("*.zip.[0-9][0-9][0-9]"):
                  base = part.name[:-4]
                  groups[base] = groups.get(base, 0) + 1

              if len(groups) == 1:
                  return next(iter(groups))

              if not sidecar_names and not groups:
                  raise FileNotFoundError(f"Nie znaleziono części ZIP w folderze: {parts_dir}")

              raise ValueError(
                  "W folderze jest więcej niż jedna możliwa paczka. "
                  "Podaj nazwę przez base_zip_name / --zip-name."
              )
          '''
          old_infer = textwrap.dedent(old_infer)
          new_infer = '''def infer_base_zip_name(
              parts_dir: Path,
              base_zip_name: str | None = None,
              *,
              allowed_profiles: set[str] | frozenset[str] | None = None,
          ) -> str:
              """Infer one canonical package name without letting another profile hijack it.

              Besides canonical sidecars and ``.zip.001`` volumes, this understands
              checksum-only transfers where ChatGPT receives a complete ``.zip`` plus
              ``*.parts.sha256``. Host-renamed checksum sidecars are resolved from their
              declared filenames rather than from the renamed sidecar filename itself.
              """

              parts_dir = Path(parts_dir).expanduser().resolve()

              if base_zip_name:
                  return sanitize_zip_name(base_zip_name)

              profile_filter = (
                  {str(item).strip().lower() for item in allowed_profiles}
                  if allowed_profiles is not None
                  else None
              )
              all_sidecar_names: set[str] = set()
              sidecar_names: set[str] = set()
              blocked_sidecar_names: set[str] = set()
              for _candidate, payload in discover_package_sidecars(parts_dir):
                  declared_name = sanitize_zip_name(str(payload.get("package_name") or ""))
                  profile = str(payload.get("profile") or "unknown").strip().lower()
                  all_sidecar_names.add(declared_name)
                  if profile_filter is None or profile in profile_filter:
                      sidecar_names.add(declared_name)
                  else:
                      blocked_sidecar_names.add(declared_name)

              legacy_sidecars = sorted(parts_dir.glob("*.zip.manifest.json"))
              legacy_names = {
                  path.name[: -len(".manifest.json")]
                  for path in legacy_sidecars
              }
              if profile_filter is None or "unknown" in profile_filter:
                  sidecar_names.update(legacy_names)
              all_sidecar_names.update(legacy_names)

              checksum_names: set[str] = set()
              for checksum in sorted(parts_dir.glob("*.sha256")):
                  if ".parts" not in checksum.name:
                      continue
                  declared_bases: set[str] = set()
                  for _digest, filename in parse_sha256sum_file(checksum):
                      lower = filename.lower()
                      if re.search(r"\.zip\.\d{3}$", lower):
                          declared_bases.add(filename[:-4])
                      elif lower.endswith(".zip"):
                          declared_bases.add(filename)
                  if len(declared_bases) == 1:
                      checksum_names.update(declared_bases)

              groups: dict[str, int] = {}
              for part in parts_dir.glob("*.zip.[0-9][0-9][0-9]"):
                  base = part.name[:-4]
                  groups[base] = groups.get(base, 0) + 1

              fallback_names = (checksum_names | set(groups)) - blocked_sidecar_names
              candidate_names = sidecar_names | fallback_names
              if len(candidate_names) == 1:
                  return next(iter(candidate_names))

              if not candidate_names:
                  if all_sidecar_names or checksum_names or groups:
                      raise FileNotFoundError(
                          "Nie znaleziono paczki zgodnej z wymaganym profilem w folderze: "
                          f"{parts_dir}"
                      )
                  raise FileNotFoundError(f"Nie znaleziono części ZIP w folderze: {parts_dir}")

              raise ValueError(
                  "W folderze jest więcej niż jedna możliwa paczka: "
                  + ", ".join(sorted(candidate_names))
                  + ". Podaj nazwę przez base_zip_name / --zip-name."
              )
          '''
          new_infer = textwrap.dedent(new_infer)
          if split_text.count(old_infer) != 1:
              raise SystemExit("split_zip_package.py: infer_base_zip_name target drifted")
          split_text = split_text.replace(old_infer, new_infer, 1)

          old_order = '''    for index, part in enumerate(expected, start=1):
              suffix = f".{index:03d}"
              if not part.filename.endswith(suffix):
                  raise ValueError(f"Nieciągła albo błędna kolejność części: oczekiwano {suffix}, jest {part.filename}")

              part_path = parts_dir / part.filename
          '''
          old_order = textwrap.dedent(old_order)
          new_order = '''    single_complete_zip = len(expected) == 1 and expected[0].filename == base_zip_name
              for index, part in enumerate(expected, start=1):
                  suffix = f".{index:03d}"
                  if not single_complete_zip and not part.filename.endswith(suffix):
                      raise ValueError(f"Nieciągła albo błędna kolejność części: oczekiwano {suffix}, jest {part.filename}")

                  part_path = parts_dir / part.filename
          '''
          new_order = textwrap.dedent(new_order)
          if split_text.count(old_order) != 1:
              raise SystemExit("split_zip_package.py: validate_package_parts order target drifted")
          split_text = split_text.replace(old_order, new_order, 1)
          Path(split_path).write_text(split_text, encoding="utf-8")

          recovery_path = "latka_jazn/bootstrap/chatgpt_recovery.py"
          recovery = Path(recovery_path).read_text(encoding="utf-8")
          old_import = '''    extract_independent_zip_set_resumable,
              extract_joined_zip_resumable,
              infer_base_zip_name,
          '''
          old_import = textwrap.dedent(old_import)
          new_import = '''    discover_package_sidecars,
              extract_independent_zip_set_resumable,
              extract_joined_zip_resumable,
              infer_base_zip_name,
          '''
          new_import = textwrap.dedent(new_import)
          if recovery.count(old_import) != 1:
              raise SystemExit("chatgpt_recovery.py: import target drifted")
          recovery = recovery.replace(old_import, new_import, 1)

          old_memory_loop = '''    candidates: list[dict[str, Any]] = []
              for sidecar_path in sorted(directory.glob("*.package.json")):
                  payload = _read_json(sidecar_path)
                  if not isinstance(payload, dict):
                      continue
                  if str(payload.get("profile") or "").strip().lower() != "memory":
                      continue
          '''
          old_memory_loop = textwrap.dedent(old_memory_loop)
          new_memory_loop = '''    candidates: list[dict[str, Any]] = []
              for sidecar_path, payload in discover_package_sidecars(directory):
                  if str(payload.get("profile") or "").strip().lower() != "memory":
                      continue
          '''
          new_memory_loop = textwrap.dedent(new_memory_loop)
          if recovery.count(old_memory_loop) != 1:
              raise SystemExit("chatgpt_recovery.py: memory discovery target drifted")
          recovery = recovery.replace(old_memory_loop, new_memory_loop, 1)

          old_report_end = '''        "auto_attach_memory": bool(auto_attach_memory),
                  "memory_zip_name": memory_zip_name,
              }

              preflight = runtime_preflight(destination)
          '''
          old_report_end = textwrap.dedent(old_report_end)
          new_report_end = '''        "auto_attach_memory": bool(auto_attach_memory),
                  "memory_zip_name": memory_zip_name,
              }

              runtime_profiles = frozenset({"system", "combined", "unknown"})
              incoming_zip_name: str | None = None
              incoming_package_set: dict[str, Any] | None = None
              try:
                  incoming_zip_name = infer_base_zip_name(
                      parts_dir,
                      base_zip_name,
                      allowed_profiles=runtime_profiles,
                  )
                  incoming_package_set = load_package_set_metadata(parts_dir, incoming_zip_name)
                  report["incoming_runtime_package"] = {
                      "present": True,
                      "base_zip_name": incoming_zip_name,
                      "package_set": incoming_package_set,
                  }
              except FileNotFoundError as exc:
                  report["incoming_runtime_package"] = {
                      "present": False,
                      "reason": str(exc),
                  }
              except ValueError as exc:
                  report["incoming_runtime_package"] = {
                      "present": True,
                      "ambiguous": True,
                      "error": str(exc),
                  }
                  return RecoveryResult(
                      ok=False,
                      state="runtime_package_discovery_ambiguous",
                      active_root=str(destination),
                      report=report,
                      exit_code=8,
                  )

              preflight = runtime_preflight(destination)
          '''
          new_report_end = textwrap.dedent(new_report_end)
          if recovery.count(old_report_end) != 1:
              raise SystemExit("chatgpt_recovery.py: incoming discovery insertion target drifted")
          recovery = recovery.replace(old_report_end, new_report_end, 1)

          old_reuse_gate = '''    if preflight.structure_ok and preflight.manifest_ok and preflight.provenance_ok and not force_reextract:
                  if auto_attach_memory:
          '''
          old_reuse_gate = textwrap.dedent(old_reuse_gate)
          new_reuse_gate = '''    if preflight.structure_ok and preflight.manifest_ok and preflight.provenance_ok and not force_reextract:
                  if incoming_zip_name is not None:
                      incoming_version = str((incoming_package_set or {}).get("package_version") or "").strip()
                      active_version = str(preflight.version or "").strip()
                      same_release = bool(
                          incoming_version
                          and active_version
                          and incoming_version.lstrip("v") == active_version.lstrip("v")
                      )
                      if not same_release:
                          report["replacement_blocked"] = {
                              "ok": False,
                              "reason": "incoming_system_package_requires_new_destination",
                              "incoming_base_zip_name": incoming_zip_name,
                              "incoming_package_version": incoming_version or None,
                              "active_version": active_version or None,
                              "destination": str(destination),
                              "recovery_hint": (
                                  "Wskaż nowy, wersjonowany katalog destination dla nowej paczki. "
                                  "Loader nie może po cichu zignorować nowego system ZIP ani nadpisać "
                                  "zweryfikowanego active_root."
                              ),
                          }
                          return RecoveryResult(
                              ok=False,
                              state="incoming_package_requires_new_destination",
                              active_root=str(destination),
                              report=report,
                              exit_code=9,
                          )
                  if auto_attach_memory:
          '''
          new_reuse_gate = textwrap.dedent(new_reuse_gate)
          if recovery.count(old_reuse_gate) != 1:
              raise SystemExit("chatgpt_recovery.py: reuse gate target drifted")
          recovery = recovery.replace(old_reuse_gate, new_reuse_gate, 1)

          old_zip_discovery = '''    zip_name = infer_base_zip_name(parts_dir, base_zip_name)
              report["base_zip_name"] = zip_name
              package_set = load_package_set_metadata(parts_dir, zip_name)
          '''
          old_zip_discovery = textwrap.dedent(old_zip_discovery)
          new_zip_discovery = '''    if incoming_zip_name is None:
                  memory_only = _discover_memory_package(parts_dir, memory_zip_name)
                  report["memory_only_discovery"] = {
                      key: value for key, value in memory_only.items() if key != "sidecar"
                  }
                  if memory_only.get("ok") is True and memory_only.get("state") == "memory_package_discovered":
                      report["profile_gate"] = {
                          "ok": False,
                          "reason": "memory_profile_is_not_a_runtime_root",
                          "truth_boundary": (
                              "Paczka memory może zostać dołączona wyłącznie do osobno zweryfikowanego systemu; "
                              "sama nie zawiera startowego active_root."
                          ),
                      }
                      return RecoveryResult(
                          ok=False,
                          state="memory_profile_rejected",
                          active_root=str(destination),
                          report=report,
                          exit_code=8,
                      )
                  raise FileNotFoundError(f"Nie znaleziono systemowej paczki ZIP w folderze: {parts_dir}")
              zip_name = incoming_zip_name
              report["base_zip_name"] = zip_name
              package_set = incoming_package_set or load_package_set_metadata(parts_dir, zip_name)
          '''
          new_zip_discovery = textwrap.dedent(new_zip_discovery)
          if recovery.count(old_zip_discovery) != 1:
              raise SystemExit("chatgpt_recovery.py: final zip discovery target drifted")
          recovery = recovery.replace(old_zip_discovery, new_zip_discovery, 1)
          Path(recovery_path).write_text(recovery, encoding="utf-8")

          version_path = Path("latka_jazn/version.py")
          version = version_path.read_text(encoding="utf-8")
          version = version.replace(
              '# v16.3.25.3.2 hardens the ChatGPT project loader capability/bootstrap semantics\n# without consuming the v16.3.25.4 Memory Rebuild release slot.\nDISTRIBUTION_VERSION = "16.3.25.3.2"\nPACKAGE_VERSION = "16.3.25.3.2"\nPACKAGE_RELEASE_NAME = "chatgpt-loader-capability-bootstrap"',
              '# v16.3.25.3.3 repairs deterministic ChatGPT package discovery/bootstrap\n# without consuming the v16.3.25.4 Memory Rebuild release slot.\nDISTRIBUTION_VERSION = "16.3.25.3.3"\nPACKAGE_VERSION = "16.3.25.3.3"\nPACKAGE_RELEASE_NAME = "chatgpt-package-discovery-bootstrap"',
              1,
          )
          if 'PACKAGE_VERSION = "16.3.25.3.3"' not in version:
              raise SystemExit("version.py: version bump target drifted")
          version_path.write_text(version, encoding="utf-8")

          test_path = Path("tests/test_v1632533_chatgpt_package_discovery_bootstrap.py")
          test_path.write_text(textwrap.dedent(r'''
              from __future__ import annotations

              import hashlib
              import json
              from pathlib import Path
              import zipfile

              from latka_jazn.bootstrap import chatgpt_recovery as recovery_module
              from latka_jazn.bootstrap.chatgpt_recovery import (
                  RuntimePreflightReport,
                  _discover_memory_package,
                  recover_chatgpt_runtime,
              )
              from latka_jazn.packaging.split_zip_package import (
                  infer_base_zip_name,
                  load_package_expectations,
                  validate_package_parts,
              )


              def _sha256(path: Path) -> str:
                  return hashlib.sha256(path.read_bytes()).hexdigest()


              def _write_memory_sidecar_renamed_by_host(parts_dir: Path) -> str:
                  package_name = "jazn_latka_v15.0.3.222-RUN-HOTFIX_memory.zip"
                  canonical_part = f"{package_name}.001"
                  uploaded_part = parts_dir / f"{package_name}(1).001"
                  uploaded_part.write_bytes(b"legacy-memory-part")
                  payload = {
                      "schema_version": "jazn_package_set/v2",
                      "package_name": package_name,
                      "profile": "memory",
                      "archive_format": "binary",
                      "package_version": "v15.0.3.222-RUN-HOTFIX",
                      "outputs": [
                          {
                              "part_no": 1,
                              "filename": canonical_part,
                              "size_bytes": uploaded_part.stat().st_size,
                              "sha256": _sha256(uploaded_part),
                              "is_complete_zip": False,
                          }
                      ],
                  }
                  (parts_dir / f"{package_name}.package(1).json").write_text(
                      json.dumps(payload), encoding="utf-8"
                  )
                  (parts_dir / f"{package_name}.parts(1).sha256").write_text(
                      f"{_sha256(uploaded_part)}  {canonical_part}\n", encoding="utf-8"
                  )
                  return package_name


              def _write_complete_system_zip_with_parts_sha(parts_dir: Path) -> str:
                  package_name = "jazn_latka_v16.3.25.3.3-chatgpt-package-discovery-bootstrap.zip"
                  archive = parts_dir / package_name
                  with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
                      zf.writestr("run.py", "print('system runtime')\n")
                      zf.writestr("latka_jazn/version.py", "PACKAGE_VERSION_FULL = '16.3.25.3.3-chatgpt-package-discovery-bootstrap'\n")
                  (parts_dir / f"{package_name}.parts.sha256").write_text(
                      f"{_sha256(archive)}  {package_name}\n", encoding="utf-8"
                  )
                  return package_name


              def test_runtime_discovery_ignores_old_memory_profile_and_finds_checksum_only_system_zip(
                  tmp_path: Path,
              ) -> None:
                  memory_name = _write_memory_sidecar_renamed_by_host(tmp_path)
                  system_name = _write_complete_system_zip_with_parts_sha(tmp_path)

                  selected = infer_base_zip_name(
                      tmp_path,
                      allowed_profiles=frozenset({"system", "combined", "unknown"}),
                  )

                  assert selected == system_name
                  assert selected != memory_name


              def test_memory_autodiscovery_accepts_chatgpt_renamed_package_sidecar(tmp_path: Path) -> None:
                  package_name = _write_memory_sidecar_renamed_by_host(tmp_path)

                  result = _discover_memory_package(tmp_path)

                  assert result["ok"] is True
                  assert result["state"] == "memory_package_discovered"
                  assert result["package_name"] == package_name
                  assert str(result["sidecar_path"]).endswith(".package(1).json")


              def test_single_complete_zip_listed_by_parts_sha_is_a_valid_package_part(tmp_path: Path) -> None:
                  package_name = _write_complete_system_zip_with_parts_sha(tmp_path)

                  expected, _, source = load_package_expectations(tmp_path, package_name)
                  validated, _, validated_source = validate_package_parts(tmp_path, package_name)

                  assert source == "parts.sha256"
                  assert validated_source == "parts.sha256"
                  assert [item.filename for item in expected] == [package_name]
                  assert [item.filename for item in validated] == [package_name]


              def test_verified_old_destination_does_not_silently_ignore_new_system_package(
                  tmp_path: Path,
                  monkeypatch,
              ) -> None:
                  system_name = _write_complete_system_zip_with_parts_sha(tmp_path / "parts")
                  destination = tmp_path / "active-old"
                  destination.mkdir()
                  preflight = RuntimePreflightReport(
                      ok=True,
                      active_root=str(destination),
                      structure_ok=True,
                      manifest_ok=True,
                      provenance_ok=True,
                      marker_ok=True,
                      start_file="run.py",
                      version="16.3.25.3.2-chatgpt-loader-capability-bootstrap",
                      manifest_version="16.3.25.3.2-chatgpt-loader-capability-bootstrap",
                      marker_path=str(tmp_path / "workspace_runtime" / "JAZN_ACTIVE_RUNTIME.json"),
                  )
                  monkeypatch.setattr(recovery_module, "runtime_preflight", lambda *_args, **_kwargs: preflight)

                  result = recover_chatgpt_runtime(
                      parts_dir=tmp_path / "parts",
                      destination=destination,
                      start_runtime_daemon=False,
                      auto_attach_memory=False,
                  )

                  assert result.ok is False
                  assert result.state == "incoming_package_requires_new_destination"
                  assert result.exit_code == 9
                  assert result.report["replacement_blocked"]["incoming_base_zip_name"] == system_name
                  assert result.report["replacement_blocked"]["reason"] == "incoming_system_package_requires_new_destination"
