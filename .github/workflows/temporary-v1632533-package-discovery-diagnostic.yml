name: Temporary v16.3.25.3.3 package discovery diagnostic

on:
  push:
    branches:
      - fix/v16.3.25.3.3-chatgpt-package-discovery-bootstrap

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/v16.3.25.3.3-chatgpt-package-discovery-bootstrap
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Reuse v2 guarded source repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          path = Path('.github/workflows/temporary-v1632533-package-discovery-fix-v2.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          marker = '      - name: Apply guarded source repair'
          try:
              start = lines.index(marker)
          except ValueError as exc:
              raise SystemExit('v2 apply step not found') from exc
          run_at = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
          body = []
          for line in lines[run_at + 1:]:
              if line.startswith('      - name:'):
                  break
              body.append(line)
          script = textwrap.dedent('\n'.join(body)) + '\n'
          Path('/tmp/apply-v1632533.sh').write_text(script, encoding='utf-8')
          subprocess.run(['bash', '/tmp/apply-v1632533.sh'], check=True)
          PY

      - name: Capture compile and regression diagnostics
        shell: bash
        run: |
          set +e
          REPORT=.repair-v1632533-diagnostics.txt
          : > "$REPORT"
          echo '=== compileall ===' >> "$REPORT"
          python -m compileall -q latka_jazn tests main.py run.py >> "$REPORT" 2>&1
          echo "EXIT=$?" >> "$REPORT"

          echo '=== new regression: mixed profile discovery ===' >> "$REPORT"
          python -m pytest -q tests/test_v1632533_chatgpt_package_discovery_bootstrap.py::test_runtime_discovery_ignores_old_memory_profile_and_finds_checksum_only_system_zip >> "$REPORT" 2>&1
          echo "EXIT=$?" >> "$REPORT"

          echo '=== new regression: renamed memory sidecar ===' >> "$REPORT"
          python -m pytest -q tests/test_v1632533_chatgpt_package_discovery_bootstrap.py::test_memory_autodiscovery_accepts_chatgpt_renamed_package_sidecar >> "$REPORT" 2>&1
          echo "EXIT=$?" >> "$REPORT"

          echo '=== new regression: complete zip plus parts sha ===' >> "$REPORT"
          python -m pytest -q tests/test_v1632533_chatgpt_package_discovery_bootstrap.py::test_single_complete_zip_listed_by_parts_sha_is_a_valid_package_part >> "$REPORT" 2>&1
          echo "EXIT=$?" >> "$REPORT"

          echo '=== new regression: stale destination reuse ===' >> "$REPORT"
          python -m pytest -q tests/test_v1632533_chatgpt_package_discovery_bootstrap.py::test_verified_old_destination_does_not_silently_ignore_new_system_package >> "$REPORT" 2>&1
          echo "EXIT=$?" >> "$REPORT"

          echo '=== existing loader contract ===' >> "$REPORT"
          python -m pytest -q tests/test_runtime_package_loader_contract.py >> "$REPORT" 2>&1
          echo "EXIT=$?" >> "$REPORT"

          echo '=== diff check ===' >> "$REPORT"
          git diff --check >> "$REPORT" 2>&1
          echo "EXIT=$?" >> "$REPORT"

          cat "$REPORT"

          git restore latka_jazn/packaging/split_zip_package.py latka_jazn/bootstrap/chatgpt_recovery.py latka_jazn/version.py
          rm -f tests/test_v1632533_chatgpt_package_discovery_bootstrap.py
          git add "$REPORT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: record v16.3.25.3.3 repair diagnostics"
          git push origin HEAD:fix/v16.3.25.3.3-chatgpt-package-discovery-bootstrap
