name: temporary-sync-v16324-version-contracts

on:
  push:
    branches:
      - upgrade/v16.3.24-package-provenance-bootstrap-hardening

permissions:
  contents: write

jobs:
  sync-contracts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: upgrade/v16.3.24-package-provenance-bootstrap-hardening

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[memory-rebuild-ui]" pytest

      - name: Update only stale version assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          generator_tests = [
              Path('tests/test_independent_memory_package_contract_v2.py'),
              Path('tests/test_jazn_pack_generator_v16311_profiles.py'),
              Path('tests/test_jazn_pack_generator_v82_contract.py'),
              Path('tests/test_jazn_pack_generator_v84_contract.py'),
          ]
          release_tests = [
              Path('tests/test_memory_rebuild_p0_studio.py'),
              Path('tests/test_memory_rebuild_settings_persistence.py'),
              Path('tests/test_memory_rebuild_studio.py'),
              Path('tests/test_v16310_host_memory_root_regressions.py'),
          ]

          for path in generator_tests:
              text = path.read_text(encoding='utf-8')
              version_old = (
                  'generator.GENERATOR_VERSION == "8.5"'
                  if 'independent_memory' in path.name or 'v16311' in path.name or 'v84_contract' in path.name
                  else 'module.GENERATOR_VERSION == "8.5"'
              )
              version_new = version_old.replace('"8.5"', '"8.6"')
              schema_old = (
                  'generator.SETTINGS_SCHEMA == "jazn_pack_generator_settings/v8.5"'
                  if 'independent_memory' in path.name or 'v16311' in path.name or 'v84_contract' in path.name
                  else 'module.SETTINGS_SCHEMA == "jazn_pack_generator_settings/v8.5"'
              )
              schema_new = schema_old.replace('/v8.5"', '/v8.6"')
              version_count = text.count(version_old)
              schema_count = text.count(schema_old)
              if version_count != 1 or schema_count != 1:
                  raise SystemExit(
                      f'{path}: expected one stale generator version/schema; '
                      f'got version={version_count}, schema={schema_count}'
                  )
              text = text.replace(version_old, version_new, 1)
              text = text.replace(schema_old, schema_new, 1)

              if path.name == 'test_independent_memory_package_contract_v2.py':
                  name_old = 'test_generator_keeps_v85_public_identity_and_uses_v3_memory_contract'
                  name_new = 'test_generator_keeps_v86_public_identity_and_uses_v3_memory_contract'
                  name_count = text.count(name_old)
                  if name_count != 1:
                      raise SystemExit(f'{path}: expected one stale v85 test name, got {name_count}')
                  text = text.replace(name_old, name_new, 1)

              path.write_text(text, encoding='utf-8', newline='\n')

          old_version = '16.3.23-persistent-runtime-lifecycle-observability-hardening'
          new_version = '16.3.24-package-provenance-bootstrap-hardening'
          old_name = 'test_release_version_tracks_v16322_active_runtime_subject_root_hardening'
          new_name = 'test_release_version_tracks_v16324_package_provenance_bootstrap_hardening'
          for path in release_tests:
              text = path.read_text(encoding='utf-8')
              version_count = text.count(old_version)
              name_count = text.count(old_name)
              if version_count != 1 or name_count != 1:
                  raise SystemExit(
                      f'{path}: expected one stale release version/name; '
                      f'got version={version_count}, name={name_count}'
                  )
              text = text.replace(old_version, new_version, 1)
              text = text.replace(old_name, new_name, 1)
              path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Run exact failing test files
        run: >-
          python -X utf8 -m pytest -q -ra --tb=short
          tests/test_independent_memory_package_contract_v2.py
          tests/test_jazn_pack_generator_v16311_profiles.py
          tests/test_jazn_pack_generator_v82_contract.py
          tests/test_jazn_pack_generator_v84_contract.py
          tests/test_memory_rebuild_p0_studio.py
          tests/test_memory_rebuild_settings_persistence.py
          tests/test_memory_rebuild_studio.py
          tests/test_v16310_host_memory_root_regressions.py

      - name: Commit synchronized contracts and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/_temporary_sync_v16324_version_contracts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_independent_memory_package_contract_v2.py \
            tests/test_jazn_pack_generator_v16311_profiles.py \
            tests/test_jazn_pack_generator_v82_contract.py \
            tests/test_jazn_pack_generator_v84_contract.py \
            tests/test_memory_rebuild_p0_studio.py \
            tests/test_memory_rebuild_settings_persistence.py \
            tests/test_memory_rebuild_studio.py \
            tests/test_v16310_host_memory_root_regressions.py
          git diff --cached --check
          git commit -m "test(v16.3.24): synchronize generator and release version contracts"
          git push origin HEAD:upgrade/v16.3.24-package-provenance-bootstrap-hardening
