name: jazn-run-studio

on:
  push:
    branches: ["integrate/v127-4-five-branches-jss-tpa-runtime-20261113", "fix/v116034946-worktree-tpa-isolation-20261026", "fix/jazn-v11603494-5-heart-system-mcp-windows-acceptance-20261026", "fix/jazn-v11603494-system-studio-diagnostics-20261026", "codex/jazn-run-studio", "fix/jazn-run-studio-windows-daemon-shutdown-20261023", "fix/jazn-run-studio-mcp-events-readiness-20261024", "fix/jazn-studio-p4-p5-evidence-gates-20261024", "fix/jazn-studio-part2-verified-ui-20261024", "fix/jazn-tpa-workbench-v11603486-20261025", "upgrade/v16-3-25-5-116-0-34-88-native-studios"]
  pull_request:
    branches: [master, fix/jazn-v11603494-5-heart-system-mcp-windows-acceptance-20261026, fix/jazn-v11603493-system-studio-hardening-20261025, fix/jazn-v11603494-system-studio-diagnostics-20261026, fix/jazn-studio-local-acceptance-20261024]
    paths:
      - "tools/jazn_run_studio/**"
      - "latka_jazn/dependencies/**"
      - "latka_jazn/tools/jss_prerequisite_setup.py"
      - "tests/test_jss_root_*.py"
      - "tests/test_jss_first_run_provisioning_qt.py"
      - "tests/test_dependency_run_studio_glibc_policy.py"
      - "tests/test_jazn_tpa_windows_acceptance.py"
      - "docs/project/TPA_WINDOWS_V105_V106_ACCEPTANCE.md"
      - "docs/tools/JAZN_DEPENDENCY_STUDIO.md"
      - "jazn_run_studio.py"
      - "run_studio.py"
      - "tests/test_heart_system*.py"
      - "tests/test_daemon_shutdown_ack_before_teardown.py"
      - "tests/test_daemon_shutdown_http_body.py"
      - "latka_jazn/core/runtime_daemon.py"
      - "latka_jazn/core/model_guided_speech_runtime.py"
      - "latka_jazn/model_adapters/factory.py"
      - "tests/test_speech_adapter_route_resolution.py"
      - "tests/test_jss_manual_evidence_commit.py"
      - "tests/test_jazn_run_studio.py"
      - "tests/test_jss_evidence*.py"
      - "tests/test_jss_pytest_evidence_plugin.py"
      - "tests/test_jss_test_evidence_dependency_profile.py"
      - "tests/test_jss_tpa_compact_filters_qt.py"
      - "tests/test_jss_tpa_async_persistence_qt.py"
      - "tests/test_jss_tpa_io_runnable_lifetime.py"
      - "tests/test_jss_qt_completion_ownership.py"
      - "tests/test_archive_recall_ollama_jss_status_recovery.py"
      - "tests/test_jss_tpa_invalid_interpreter_qt.py"
      - "tests/test_jss_tpa_manual_async_qt.py"
      - "tests/test_jazn_tpa_safe_executor.py"
      - "tests/test_jazn_tpa_live_full_gate.py"
      - "tests/test_tpa_live_phase_and_transport.py"
      - "tests/test_jazn_tpa_staging_authority.py"
      - "tests/test_jazn_run_studio_configuration_native_qt.py"
      - "tests/test_jazn_run_studio_version_native_qt.py"
      - "tests/test_jazn_run_studio_config_root_migration_qt.py"
      - "tests/test_jazn_operator_profile_migration_toctou.py"
      - "tests/test_jazn_run_studio_mcp_events.py"
      - "tests/test_jazn_archive_brotli_security_floor.py"
      - "tests/test_jazn_run_studio_integrations.py"
      - "tests/test_jazn_run_studio_env_guard.py"
      - "tests/test_jazn_run_studio_chat_contract.py"
      - "tests/test_jazn_chat_terminal_recovery.py"
      - "tests/test_jazn_run_studio_lifecycle_results.py"
      - "tests/test_jazn_run_studio_http_framing.py"
      - "tests/test_jazn_run_studio_layout.py"
      - "tests/test_jazn_run_studio_p5_artifact_evidence.py"
      - "tests/test_jazn_run_studio_utf8.py"
      - "tests/test_jazn_run_studio_memory_view.py"
      - "tests/test_memory_operator_report.py"
      - "tests/test_memory_evidence_compact_layout.py"
      - "tests/test_memory_readiness_pin_diagnostics.py"
      - "latka_jazn/tools/memory_rebuild_app/p1_operator_report.py"
      - "latka_jazn/cli.py"
      - "pyproject.toml"
      - "latka_jazn/resources/dependencies/profiles.json"
      - ".github/workflows/jazn-run-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      # Preserve Python thread traces when Qt aborts after pytest has passed.
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[run-studio,memory-rebuild-ui,archive,mcp-http]" pytest pyright==1.1.414
      - name: Install Qt Linux graphics libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m compileall -q tools/jazn_run_studio jazn_run_studio.py run_studio.py
      - name: ROOT-local JSS setup and safety regressions
        run: >-
          python -m pytest -q
          tests/test_jss_root_local_dependencies.py
          tests/test_jss_root_prerequisite_setup.py
          tests/test_jss_first_run_provisioning_qt.py
          tests/test_dependency_run_studio_glibc_policy.py
          tests/test_jazn_tpa_windows_acceptance.py
      - name: Materialize and verify native optional test evidence wheels
        run: >-
          python -X utf8 -m latka_jazn.tools.dependency_studio
          --root . --wheelhouse-root "${{ runner.temp }}/test-evidence-wheelhouse" --json
          download --profile test-evidence --platform current --python-version "${{ matrix.python }}"
          > "${{ runner.temp }}/test-evidence-download.json"
      - name: Durable evidence and read-only Qt history contracts
        env:
          JAZN_TEST_EVIDENCE_DIR: ${{ runner.temp }}/jss-evidence-runs
        run: >-
          python -X utf8 -m pytest -q -ra
          -p tools.jazn_run_studio.test_evidence_plugin
          --junitxml="${{ runner.temp }}/jss-evidence-contracts.xml"
          tests/test_jss_evidence_archive.py
          tests/test_jss_evidence_platform.py
          tests/test_jss_evidence_phase_identity.py
          tests/test_jss_evidence_store_paging.py
          tests/test_jss_evidence_index_stability.py
          tests/test_jss_evidence_redaction_scaling.py
          tests/test_speech_adapter_route_resolution.py
          tests/test_jss_manual_evidence_commit.py
          tests/test_jss_evidence_history_qt.py
          tests/test_jss_evidence_history_pagination_qt.py
          tests/test_jss_evidence_initial_index.py
          tests/test_jss_evidence_receipt_recovery.py
          tests/test_tpa_evidence_immutable_authority.py
          tests/test_jss_pytest_evidence_plugin.py
          tests/test_jss_test_evidence_dependency_profile.py
          tests/test_jss_tpa_compact_filters_qt.py
          tests/test_jss_tpa_async_persistence_qt.py
          tests/test_jss_tpa_io_runnable_lifetime.py
          tests/test_jss_qt_completion_ownership.py
          tests/test_jss_tpa_invalid_interpreter_qt.py
          tests/test_jss_tpa_manual_async_qt.py
          tests/test_jazn_tpa_compact_layout_qt.py
      - name: Preserve evidence contracts on every outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jss-evidence-${{ matrix.os }}-py${{ matrix.python }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/jss-evidence-contracts.xml
            ${{ runner.temp }}/jss-evidence-runs/**
            ${{ runner.temp }}/test-evidence-download.json
            ${{ runner.temp }}/test-evidence-wheelhouse/**/JAZN_WHEELHOUSE_REQUIREMENTS.txt
            ${{ runner.temp }}/test-evidence-wheelhouse/**/JAZN_WHEELHOUSE_MANIFEST.json
          if-no-files-found: error
          retention-days: 7
      - run: python -m pytest -q tests/test_heart_visual_system_qt.py tests/test_heart_service_visual_readability_qt.py tests/test_version_bound_contract_fields.py tests/test_package_integrity_canonical_worktree.py
      - run: python -m pytest -q tests/test_jazn_tpa_staging_authority.py
      - run: python -m pytest -q tests/test_jazn_acceptance_resume_profile.py tests/test_jazn_workspace_layout_isolation.py tests/test_jazn_tpa_safe_executor.py
      - run: python -m pytest -q tests/test_jazn_tpa_evidence.py tests/test_jazn_tpa_execution_qt.py tests/test_heart_system_xampp_console.py tests/test_heart_system_xampp_console_qt.py tests/test_jazn_tpa_live_full_gate.py tests/test_tpa_live_phase_and_transport.py tests/test_jazn_tpa_compact_layout_qt.py tests/test_jazn_tpa_log_scope_qt.py tests/test_jazn_tpa_corrupt_evidence.py tests/test_jazn_tpa_action_evidence.py
      - run: python -m pytest -q tests/test_heart_system_helper_payload.py tests/test_heart_system_dashboard.py tests/test_heart_system_dashboard_qt.py tests/test_heart_system_diagnostics.py tests/test_heart_system_workspace_qt.py tests/test_heart_system_public_restart.py tests/test_heart_system_coverage_encoding.py tests/test_archive_recall_ollama_jss_status_recovery.py
      - run: python -m pytest -q tests/test_jazn_run_studio_configuration_native_qt.py tests/test_jazn_run_studio_version_native_qt.py tests/test_jazn_run_studio_config_root_migration_qt.py tests/test_jazn_operator_profile_migration_toctou.py
      - run: python -m pytest -q tests/test_jazn_tpa_workbench_layout_diagnostics.py
      - run: python -m pytest -q tests/test_daemon_shutdown_ack_before_teardown.py tests/test_daemon_shutdown_http_body.py tests/test_jazn_run_studio.py tests/test_jss_startup_dependency_mcp_profile.py tests/test_jazn_run_studio_integrations.py tests/test_jazn_run_studio_env_guard.py tests/test_jazn_run_studio_chat_contract.py tests/test_jazn_run_studio_build_import.py tests/test_jazn_run_studio_delivery_ack.py tests/test_jazn_chat_terminal_recovery.py tests/test_jazn_run_studio_bundle_integrity.py tests/test_jazn_run_studio_lifecycle_results.py tests/test_jazn_run_studio_http_framing.py tests/test_jazn_run_studio_layout.py tests/test_jazn_run_studio_part2_operator_qt.py tests/test_jazn_run_studio_part2_collapsed_qt.py tests/test_jazn_run_studio_part2_refresh_qt.py tests/test_jazn_run_studio_part2_error_journal.py tests/test_single_canonical_version_alias.py tests/test_jazn_run_studio_utf8.py tests/test_jazn_run_studio_mcp_events.py tests/test_jazn_run_studio_p5_artifact_evidence.py tests/test_jazn_run_studio_native_test_catalog_qt.py tests/test_jss_batch_pytest_qt.py tests/test_jss_test_retirement.py tests/test_jss_test_retirement_checks.py tests/test_jazn_archive_brotli_security_floor.py
      - run: python -m pytest -q tests/test_jazn_tpa_safe_executor.py tests/test_jazn_tpa_workbench_layout_diagnostics.py tests/test_jazn_run_studio_local_acceptance.py tests/test_jazn_run_studio_12_manual_studio_gates.py tests/test_jazn_run_studio_workbench_qt.py
      - run: python -m pytest -q tests/test_jazn_run_studio_memory_view.py tests/test_memory_operator_report.py tests/test_memory_evidence_compact_layout.py tests/test_memory_readiness_pin_diagnostics.py
      - run: python tools/jazn_run_studio/check_types.py
      - run: python -X utf8 run_studio.py --check
      - run: python -X utf8 jazn_run_studio.py --check
      - run: python -X utf8 run_studio.py --gui-smoke
      - run: python -X utf8 jazn_run_studio.py --gui-smoke
      - run: git diff --check

  package:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[run-studio]" pyinstaller==6.22.3
      - run: python tools/jazn_run_studio/build.py --output "${{ runner.temp }}/studio-build"
      - name: Verify actual onedir manifest before GUI smoke
        run: python -c "from pathlib import Path; from tools.jazn_run_studio.p5_artifact_evidence import verify_frozen_bundle_manifest as verify; assert verify(Path(r'${{ runner.temp }}/studio-build/dist/JaznRunStudio'))[0], 'bundle_inventory_invalid'"
      - name: Verify frozen GUI against explicit SYSTEM and interpreter
        shell: pwsh
        run: |
          $env:JAZN_ROOT = (Get-Location).Path
          $env:JAZN_STUDIO_PYTHON = (Get-Command python).Source
          $exe = "${{ runner.temp }}/studio-build/dist/JaznRunStudio/JaznRunStudio.exe"
          $job = Start-Process -FilePath $exe -ArgumentList '--gui-smoke' -WindowStyle Hidden -PassThru
          if (-not $job.WaitForExit(30000)) { $job.Kill(); throw 'Frozen GUI timeout' }
          if ($job.ExitCode -ne 0) { throw "Frozen GUI failed: $($job.ExitCode)" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: JaznRunStudio-Windows
          path: ${{ runner.temp }}/studio-build/dist/JaznRunStudio/
          if-no-files-found: error
          retention-days: 7

  root_venv_offline:
    name: ROOT/.venv offline setup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Install baseline builder (not installer dependencies)
        run: python -m pip install -e . pytest
      - name: Download verified native core+run-studio wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          if python -X utf8 -m latka_jazn.tools.dependency_studio \
            --root . --wheelhouse-root local_resources/wheelhouse --json \
            download --profile core --profile run-studio \
            --python-version 3.14 --platform current > "$RUNNER_TEMP/jss-download.json"; then
            :
          else
            download_status=$?
            echo "ROOT/.venv wheelhouse download failed (exit=$download_status)." >&2
            cat "$RUNNER_TEMP/jss-download.json" >&2
            exit "$download_status"
          fi
          bundle="$(python -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["bundle_dir"])' "$RUNNER_TEMP/jss-download.json")"
          python -X utf8 -m latka_jazn.tools.dependency_studio --root . --json verify --bundle "$bundle"
          echo "JAZN_VERIFIED_BUNDLE=$bundle" >> "$GITHUB_ENV"
      - name: Install and verify ROOT/.venv entirely offline
        shell: bash
        run: |
          set -euo pipefail
          python -X utf8 -m latka_jazn.tools.dependency_studio \
            --root . --json install --bundle "$JAZN_VERIFIED_BUNDLE" --offline
          python -X utf8 -c 'from latka_jazn.dependencies.environment import managed_environment_status; report=managed_environment_status("."); print(report); assert report["ready"]'
          if [ "$RUNNER_OS" = Windows ]; then
            .venv/Scripts/python.exe -m pip check
          else
            .venv/bin/python -m pip check
          fi
