name: jazn-run-studio

on:
  push:
    branches: ["fix/jazn-v11603494-5-heart-system-mcp-windows-acceptance-20261026", "fix/jazn-v11603494-system-studio-diagnostics-20261026", "codex/jazn-run-studio", "fix/jazn-run-studio-windows-daemon-shutdown-20261023", "fix/jazn-run-studio-mcp-events-readiness-20261024", "fix/jazn-studio-p4-p5-evidence-gates-20261024", "fix/jazn-studio-part2-verified-ui-20261024", "fix/jazn-tpa-workbench-v11603486-20261025", "upgrade/v16-3-25-5-116-0-34-88-native-studios"]
  pull_request:
    branches: [master, fix/jazn-v11603493-system-studio-hardening-20261025, fix/jazn-v11603494-system-studio-diagnostics-20261026, fix/jazn-studio-local-acceptance-20261024]
    paths:
      - "tools/jazn_run_studio/**"
      - "jazn_run_studio.py"
      - "run_studio.py"
      - "tests/test_heart_system*.py"
      - "tests/test_daemon_shutdown_ack_before_teardown.py"
      - "tests/test_daemon_shutdown_http_body.py"
      - "latka_jazn/core/runtime_daemon.py"
      - "tests/test_jazn_run_studio.py"
      - "tests/test_jazn_tpa_safe_executor.py"
      - "tests/test_jazn_run_studio_configuration_native_qt.py"
      - "tests/test_jazn_run_studio_version_native_qt.py"
      - "tests/test_jazn_run_studio_config_root_migration_qt.py"
      - "tests/test_jazn_operator_profile_migration_toctou.py"
      - "tests/test_jazn_run_studio_mcp_events.py"
      - "tests/test_jazn_archive_brotli_security_floor.py"
      - "tests/test_jazn_run_studio_integrations.py"
      - "tests/test_jazn_run_studio_env_guard.py"
      - "tests/test_jazn_run_studio_chat_contract.py"
      - "tests/test_jazn_run_studio_lifecycle_results.py"
      - "tests/test_jazn_run_studio_http_framing.py"
      - "tests/test_jazn_run_studio_layout.py"
      - "tests/test_jazn_run_studio_p5_artifact_evidence.py"
      - "tests/test_jazn_run_studio_utf8.py"
      - "tests/test_jazn_run_studio_memory_view.py"
      - "tests/test_memory_operator_report.py"
      - "tests/test_memory_evidence_compact_layout.py"
      - "tests/test_memory_readiness_pin_diagnostics.py"
      - "latka_jazn/tools/memory_rebuild_app/p1_operator_report.py"
      - "latka_jazn/cli.py"
      - "pyproject.toml"
      - "latka_jazn/resources/dependencies/profiles.json"
      - ".github/workflows/jazn-run-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[run-studio,memory-rebuild-ui,archive,mcp-http]" pytest pyright==1.1.414
      - name: Install Qt Linux graphics libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m compileall -q tools/jazn_run_studio jazn_run_studio.py run_studio.py
      - run: python -m pytest -q tests/test_heart_system_helper_payload.py tests/test_heart_system_dashboard.py tests/test_heart_system_dashboard_qt.py tests/test_heart_system_diagnostics.py tests/test_heart_system_workspace_qt.py tests/test_heart_system_public_restart.py tests/test_heart_system_coverage_encoding.py
      - run: python -m pytest -q tests/test_jazn_run_studio_configuration_native_qt.py tests/test_jazn_run_studio_version_native_qt.py tests/test_jazn_run_studio_config_root_migration_qt.py tests/test_jazn_operator_profile_migration_toctou.py
      - run: python -m pytest -q tests/test_jazn_tpa_workbench_layout_diagnostics.py
      - run: python -m pytest -q tests/test_daemon_shutdown_ack_before_teardown.py tests/test_daemon_shutdown_http_body.py tests/test_jazn_run_studio.py tests/test_jazn_run_studio_integrations.py tests/test_jazn_run_studio_env_guard.py tests/test_jazn_run_studio_chat_contract.py tests/test_jazn_run_studio_build_import.py tests/test_jazn_run_studio_delivery_ack.py tests/test_jazn_run_studio_bundle_integrity.py tests/test_jazn_run_studio_lifecycle_results.py tests/test_jazn_run_studio_http_framing.py tests/test_jazn_run_studio_layout.py tests/test_jazn_run_studio_part2_operator_qt.py tests/test_jazn_run_studio_part2_collapsed_qt.py tests/test_jazn_run_studio_part2_refresh_qt.py tests/test_jazn_run_studio_part2_error_journal.py tests/test_single_canonical_version_alias.py tests/test_jazn_run_studio_utf8.py tests/test_jazn_run_studio_mcp_events.py tests/test_jazn_run_studio_p5_artifact_evidence.py tests/test_jazn_run_studio_native_test_catalog_qt.py tests/test_jazn_archive_brotli_security_floor.py
      - run: python -m pytest -q tests/test_jazn_tpa_safe_executor.py tests/test_jazn_tpa_workbench_layout_diagnostics.py tests/test_jazn_run_studio_local_acceptance.py tests/test_jazn_run_studio_12_manual_studio_gates.py tests/test_jazn_run_studio_workbench_qt.py
      - run: python -m pytest -q tests/test_jazn_run_studio_memory_view.py tests/test_memory_operator_report.py tests/test_memory_evidence_compact_layout.py tests/test_memory_readiness_pin_diagnostics.py
      - run: python tools/jazn_run_studio/check_types.py
      - run: python -X utf8 run_studio.py --check
      - run: python -X utf8 jazn_run_studio.py --check
      - run: python -X utf8 run_studio.py --gui-smoke
      - run: python -X utf8 jazn_run_studio.py --gui-smoke
      - run: git diff --check

  package:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[run-studio]" pyinstaller==6.22.3
      - run: python tools/jazn_run_studio/build.py --output "${{ runner.temp }}/studio-build"
      - name: Verify actual onedir manifest before GUI smoke
        run: python -c "from pathlib import Path; from tools.jazn_run_studio.p5_artifact_evidence import verify_frozen_bundle_manifest as verify; assert verify(Path(r'${{ runner.temp }}/studio-build/dist/JaznRunStudio'))[0], 'bundle_inventory_invalid'"
      - name: Verify frozen GUI against explicit SYSTEM and interpreter
        shell: pwsh
        run: |
          $env:JAZN_ROOT = (Get-Location).Path
          $env:JAZN_STUDIO_PYTHON = (Get-Command python).Source
          $exe = "${{ runner.temp }}/studio-build/dist/JaznRunStudio/JaznRunStudio.exe"
          $job = Start-Process -FilePath $exe -ArgumentList '--gui-smoke' -WindowStyle Hidden -PassThru
          if (-not $job.WaitForExit(30000)) { $job.Kill(); throw 'Frozen GUI timeout' }
          if ($job.ExitCode -ne 0) { throw "Frozen GUI failed: $($job.ExitCode)" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: JaznRunStudio-Windows
          path: ${{ runner.temp }}/studio-build/dist/JaznRunStudio/
          if-no-files-found: error
          retention-days: 7
