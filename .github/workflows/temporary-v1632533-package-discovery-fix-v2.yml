name: Temporary v16.3.25.3.3 package discovery repair v2

on:
  push:
    branches:
      - fix/v16.3.25.3.3-chatgpt-package-discovery-bootstrap

permissions:
  contents: write

concurrency:
  group: temporary-v1632533-package-discovery-fix-v2
  cancel-in-progress: false

jobs:
  apply-validate-and-self-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/v16.3.25.3.3-chatgpt-package-discovery-bootstrap
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply guarded source repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          def replace_section(text: str, start: str, end: str, replacement: str, label: str) -> str:
              if text.count(start) != 1:
                  raise SystemExit(f"{label}: start marker count={text.count(start)}")
              start_at = text.index(start)
              end_at = text.index(end, start_at)
              return text[:start_at] + replacement.rstrip() + "\n\n" + text[end_at + 1:]

          split_path = Path("latka_jazn/packaging/split_zip_package.py")
          split = split_path.read_text(encoding="utf-8")

          sidecar_replacement = textwrap.dedent('''
          def discover_package_sidecars(parts_dir: Path) -> list[tuple[Path, dict[str, Any]]]:
              """Return valid current package sidecars, including host-renamed uploads.

              Chat hosts may rename ``archive.zip.package.json`` to forms such as
              ``archive.zip.package(1).json``. The declared ``package_name`` remains
              the canonical identity; the upload filename is only transport metadata.
              """

              directory = Path(parts_dir).expanduser().resolve()
              discovered: list[tuple[Path, dict[str, Any]]] = []
              for candidate in sorted(directory.glob("*.json")):
                  if ".package" not in candidate.name:
                      continue
                  try:
                      payload = _read_package_sidecar(candidate)
                      sanitize_zip_name(str(payload.get("package_name") or ""))
                  except (OSError, UnicodeError, json.JSONDecodeError, TypeError, ValueError):
                      continue
                  discovered.append((candidate, payload))
              return discovered


          def _find_package_sidecar(parts_dir: Path, base_zip_name: str) -> tuple[Path | None, dict[str, Any] | None]:
              exact = parts_dir / f"{base_zip_name}.package.json"
              if exact.is_file():
                  return exact, _read_package_sidecar(exact)

              matches: list[tuple[Path, dict[str, Any]]] = []
              for candidate, payload in discover_package_sidecars(parts_dir):
                  if candidate == exact:
                      continue
                  declared_name = sanitize_zip_name(str(payload.get("package_name") or ""))
                  if declared_name == base_zip_name:
                      matches.append((candidate, payload))
              if len(matches) > 1:
                  raise ValueError(
                      "Niejednoznaczne sidecary package.json dla paczki "
                      f"{base_zip_name!r}: " + ", ".join(path.name for path, _ in matches)
                  )
              return matches[0] if matches else (None, None)
          ''').lstrip()
          split = replace_section(
              split,
              "def _find_package_sidecar(",
              "\ndef load_package_set_metadata(",
              sidecar_replacement,
              "split:_find_package_sidecar",
          )

          infer_replacement = textwrap.dedent('''
          def infer_base_zip_name(
              parts_dir: Path,
              base_zip_name: str | None = None,
              *,
              allowed_profiles: set[str] | frozenset[str] | None = None,
          ) -> str:
              """Infer one canonical package without allowing another profile to hijack it.

              Discovery accepts current and host-renamed package sidecars, canonical
              split volumes and checksum-only transfers. For ``*.parts.sha256`` the
              filenames declared inside the checksum file are authoritative, so a
              host rename such as ``.parts(1).sha256`` does not change package identity.
              """

              parts_dir = Path(parts_dir).expanduser().resolve()
              if base_zip_name:
                  return sanitize_zip_name(base_zip_name)

              profile_filter = (
                  {str(item).strip().lower() for item in allowed_profiles}
                  if allowed_profiles is not None
                  else None
              )
              all_sidecar_names: set[str] = set()
              sidecar_names: set[str] = set()
              blocked_sidecar_names: set[str] = set()
              for _candidate, payload in discover_package_sidecars(parts_dir):
                  declared_name = sanitize_zip_name(str(payload.get("package_name") or ""))
                  profile = str(payload.get("profile") or "unknown").strip().lower()
                  all_sidecar_names.add(declared_name)
                  if profile_filter is None or profile in profile_filter:
                      sidecar_names.add(declared_name)
                  else:
                      blocked_sidecar_names.add(declared_name)

              legacy_names = {
                  path.name[: -len(".manifest.json")]
                  for path in sorted(parts_dir.glob("*.zip.manifest.json"))
              }
              all_sidecar_names.update(legacy_names)
              if profile_filter is None or "unknown" in profile_filter:
                  sidecar_names.update(legacy_names)

              checksum_names: set[str] = set()
              for checksum in sorted(parts_dir.glob("*.sha256")):
                  if ".parts" not in checksum.name:
                      continue
                  declared_bases: set[str] = set()
                  for _digest, filename in parse_sha256sum_file(checksum):
                      lower = filename.lower()
                      if re.search(r"\.zip\.\d{3}$", lower):
                          declared_bases.add(filename[:-4])
                      elif lower.endswith(".zip"):
                          declared_bases.add(filename)
                  if len(declared_bases) == 1:
                      checksum_names.update(declared_bases)

              split_names = {
                  part.name[:-4]
                  for part in parts_dir.glob("*.zip.[0-9][0-9][0-9]")
              }
              fallback_names = (checksum_names | split_names) - blocked_sidecar_names
              candidate_names = sidecar_names | fallback_names
              if len(candidate_names) == 1:
                  return next(iter(candidate_names))
              if not candidate_names:
                  if all_sidecar_names or checksum_names or split_names:
                      raise FileNotFoundError(
                          "Nie znaleziono paczki zgodnej z wymaganym profilem w folderze: "
                          f"{parts_dir}"
                      )
                  raise FileNotFoundError(f"Nie znaleziono części ZIP w folderze: {parts_dir}")
              raise ValueError(
                  "W folderze jest więcej niż jedna możliwa paczka: "
                  + ", ".join(sorted(candidate_names))
                  + ". Podaj nazwę przez base_zip_name / --zip-name."
              )
          ''').lstrip()
          split = replace_section(
              split,
              "def infer_base_zip_name(",
              "\ndef load_package_expectations(",
              infer_replacement,
              "split:infer_base_zip_name",
          )

          validate_start = split.index("def validate_package_parts(")
          validate_end = split.index("\ndef join_split_package_to_zip(", validate_start)
          validate_block = split[validate_start:validate_end]
          loop_marker = "    for index, part in enumerate(expected, start=1):\n"
          if validate_block.count(loop_marker) != 1:
              raise SystemExit("split:validate loop marker drifted")
          validate_block = validate_block.replace(
              loop_marker,
              "    single_complete_zip = len(expected) == 1 and expected[0].filename == base_zip_name\n"
              + loop_marker,
              1,
          )
          order_marker = "        if not part.filename.endswith(suffix):\n"
          if validate_block.count(order_marker) != 1:
              raise SystemExit("split:validate suffix marker drifted")
          validate_block = validate_block.replace(
              order_marker,
              "        if not single_complete_zip and not part.filename.endswith(suffix):\n",
              1,
          )
          split = split[:validate_start] + validate_block + split[validate_end:]
          split_path.write_text(split, encoding="utf-8")

          recovery_path = Path("latka_jazn/bootstrap/chatgpt_recovery.py")
          recovery = recovery_path.read_text(encoding="utf-8")
          import_marker = "    extract_independent_zip_set_resumable,\n"
          if recovery.count(import_marker) != 1:
              raise SystemExit("recovery: import marker drifted")
          recovery = recovery.replace(
              import_marker,
              "    discover_package_sidecars,\n" + import_marker,
              1,
          )

          memory_replacement = textwrap.dedent('''
          def _discover_memory_package(parts_dir: Path, explicit_zip_name: str | None = None) -> dict[str, Any]:
              """Discover exactly one sidecar-declared memory package beside the system package."""

              directory = Path(parts_dir).expanduser().resolve()
              candidates: list[dict[str, Any]] = []
              for sidecar_path, payload in discover_package_sidecars(directory):
                  if str(payload.get("profile") or "").strip().lower() != "memory":
                      continue
                  package_name = str(payload.get("package_name") or "").strip()
                  if package_name:
                      candidates.append(
                          {
                              "package_name": package_name,
                              "sidecar_path": str(sidecar_path),
                              "sidecar": payload,
                          }
                      )
              if explicit_zip_name:
                  wanted = str(explicit_zip_name).strip()
                  matches = [item for item in candidates if item["package_name"] == wanted]
                  if len(matches) != 1:
                      return {
                          "ok": False,
                          "state": "explicit_memory_package_not_found",
                          "requested": wanted,
                          "candidate_names": [item["package_name"] for item in candidates],
                      }
                  return {"ok": True, "state": "memory_package_discovered", **matches[0]}
              if not candidates:
                  return {"ok": True, "state": "memory_package_not_present", "package_name": None}
              if len(candidates) > 1:
                  return {
                      "ok": False,
                      "state": "memory_package_ambiguous",
                      "candidate_names": [item["package_name"] for item in candidates],
                  }
              return {"ok": True, "state": "memory_package_discovered", **candidates[0]}
          ''').lstrip()
          recovery = replace_section(
              recovery,
              "def _discover_memory_package(",
              "\ndef _memory_package_requires_v3_repack(",
              memory_replacement,
              "recovery:_discover_memory_package",
          )

          impl_start = recovery.index("def _recover_chatgpt_runtime_impl(")
          impl_end = recovery.index("\ndef recover_chatgpt_runtime(", impl_start)
          impl = recovery[impl_start:impl_end]
          preflight_marker = "    preflight = runtime_preflight(destination)\n"
          if impl.count(preflight_marker) != 1:
              raise SystemExit("recovery: preflight marker drifted")
          incoming_block = textwrap.dedent('''
              runtime_profiles = frozenset({"system", "combined", "unknown"})
              incoming_zip_name: str | None = None
              incoming_package_set: dict[str, Any] | None = None
              try:
                  incoming_zip_name = infer_base_zip_name(
                      parts_dir,
                      base_zip_name,
                      allowed_profiles=runtime_profiles,
                  )
                  incoming_package_set = load_package_set_metadata(parts_dir, incoming_zip_name)
                  report["incoming_runtime_package"] = {
                      "present": True,
                      "base_zip_name": incoming_zip_name,
                      "package_set": incoming_package_set,
                  }
              except FileNotFoundError as exc:
                  report["incoming_runtime_package"] = {"present": False, "reason": str(exc)}
              except ValueError as exc:
                  report["incoming_runtime_package"] = {
                      "present": True,
                      "ambiguous": True,
                      "error": str(exc),
                  }
                  return RecoveryResult(
                      ok=False,
                      state="runtime_package_discovery_ambiguous",
                      active_root=str(destination),
                      report=report,
                      exit_code=8,
                  )

          ''')
          impl = impl.replace(preflight_marker, incoming_block + preflight_marker, 1)

          reuse_marker = "    if preflight.structure_ok and preflight.manifest_ok and preflight.provenance_ok and not force_reextract:\n"
          if impl.count(reuse_marker) != 1:
              raise SystemExit("recovery: reuse marker drifted")
          reuse_block = textwrap.dedent('''
                  if incoming_zip_name is not None:
                      incoming_version = str((incoming_package_set or {}).get("package_version") or "").strip()
                      active_version = str(preflight.version or "").strip()
                      same_release = bool(
                          incoming_version
                          and active_version
                          and incoming_version.lstrip("v") == active_version.lstrip("v")
                      )
                      if not same_release:
                          report["replacement_blocked"] = {
                              "ok": False,
                              "reason": "incoming_system_package_requires_new_destination",
                              "incoming_base_zip_name": incoming_zip_name,
                              "incoming_package_version": incoming_version or None,
                              "active_version": active_version or None,
                              "destination": str(destination),
                              "recovery_hint": (
                                  "Wskaż nowy, wersjonowany katalog destination dla nowej paczki. "
                                  "Loader nie może po cichu zignorować nowego system ZIP ani nadpisać "
                                  "zweryfikowanego active_root."
                              ),
                          }
                          return RecoveryResult(
                              ok=False,
                              state="incoming_package_requires_new_destination",
                              active_root=str(destination),
                              report=report,
                              exit_code=9,
                          )
          ''')
          impl = impl.replace(reuse_marker, reuse_marker + reuse_block, 1)

          zip_marker = (
              "    zip_name = infer_base_zip_name(parts_dir, base_zip_name)\n"
              "    report[\"base_zip_name\"] = zip_name\n"
              "    package_set = load_package_set_metadata(parts_dir, zip_name)\n"
          )
          if impl.count(zip_marker) != 1:
              raise SystemExit("recovery: final discovery marker drifted")
          zip_replacement = textwrap.dedent('''
              if incoming_zip_name is None:
                  memory_only = _discover_memory_package(parts_dir, memory_zip_name)
                  report["memory_only_discovery"] = {
                      key: value for key, value in memory_only.items() if key != "sidecar"
                  }
                  if memory_only.get("ok") is True and memory_only.get("state") == "memory_package_discovered":
                      report["profile_gate"] = {
                          "ok": False,
                          "reason": "memory_profile_is_not_a_runtime_root",
                          "truth_boundary": (
                              "Paczka memory może zostać dołączona wyłącznie do osobno zweryfikowanego systemu; "
                              "sama nie zawiera startowego active_root."
                          ),
                      }
                      return RecoveryResult(
                          ok=False,
                          state="memory_profile_rejected",
                          active_root=str(destination),
                          report=report,
                          exit_code=8,
                      )
                  raise FileNotFoundError(f"Nie znaleziono systemowej paczki ZIP w folderze: {parts_dir}")
              zip_name = incoming_zip_name
              report["base_zip_name"] = zip_name
              package_set = incoming_package_set or load_package_set_metadata(parts_dir, zip_name)
          ''')
          impl = impl.replace(zip_marker, zip_replacement, 1)
          recovery = recovery[:impl_start] + impl + recovery[impl_end:]
          recovery_path.write_text(recovery, encoding="utf-8")

          version_path = Path("latka_jazn/version.py")
          version = version_path.read_text(encoding="utf-8")
          old_version = (
              '# v16.3.25.3.2 hardens the ChatGPT project loader capability/bootstrap semantics\n'
              '# without consuming the v16.3.25.4 Memory Rebuild release slot.\n'
              'DISTRIBUTION_VERSION = "16.3.25.3.2"\n'
              'PACKAGE_VERSION = "16.3.25.3.2"\n'
              'PACKAGE_RELEASE_NAME = "chatgpt-loader-capability-bootstrap"'
          )
          new_version = (
              '# v16.3.25.3.3 repairs deterministic ChatGPT package discovery/bootstrap\n'
              '# without consuming the v16.3.25.4 Memory Rebuild release slot.\n'
              'DISTRIBUTION_VERSION = "16.3.25.3.3"\n'
              'PACKAGE_VERSION = "16.3.25.3.3"\n'
              'PACKAGE_RELEASE_NAME = "chatgpt-package-discovery-bootstrap"'
          )
          if version.count(old_version) != 1:
              raise SystemExit("version: bump marker drifted")
          version_path.write_text(version.replace(old_version, new_version, 1), encoding="utf-8")

          test_path = Path("tests/test_v1632533_chatgpt_package_discovery_bootstrap.py")
          test_path.write_text(textwrap.dedent(r'''
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path
          import zipfile

          from latka_jazn.bootstrap import chatgpt_recovery as recovery_module
          from latka_jazn.bootstrap.chatgpt_recovery import (
              RuntimePreflightReport,
              _discover_memory_package,
              recover_chatgpt_runtime,
          )
          from latka_jazn.packaging.split_zip_package import (
              infer_base_zip_name,
              load_package_expectations,
              validate_package_parts,
          )


          def _sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()


          def _write_memory_sidecar_renamed_by_host(parts_dir: Path) -> str:
              parts_dir.mkdir(parents=True, exist_ok=True)
              package_name = "jazn_latka_v15.0.3.222-RUN-HOTFIX_memory.zip"
              canonical_part = f"{package_name}.001"
              uploaded_part = parts_dir / f"{package_name}(1).001"
              uploaded_part.write_bytes(b"legacy-memory-part")
              payload = {
                  "schema_version": "jazn_package_set/v2",
                  "package_name": package_name,
                  "profile": "memory",
                  "archive_format": "binary",
                  "package_version": "v15.0.3.222-RUN-HOTFIX",
                  "outputs": [{
                      "part_no": 1,
                      "filename": canonical_part,
                      "size_bytes": uploaded_part.stat().st_size,
                      "sha256": _sha256(uploaded_part),
                      "is_complete_zip": False,
                  }],
              }
              (parts_dir / f"{package_name}.package(1).json").write_text(json.dumps(payload), encoding="utf-8")
              (parts_dir / f"{package_name}.parts(1).sha256").write_text(
                  f"{_sha256(uploaded_part)}  {canonical_part}\n", encoding="utf-8"
              )
              return package_name


          def _write_complete_system_zip_with_parts_sha(parts_dir: Path) -> str:
              parts_dir.mkdir(parents=True, exist_ok=True)
              package_name = "jazn_latka_v16.3.25.3.3-chatgpt-package-discovery-bootstrap.zip"
              archive = parts_dir / package_name
              with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
                  zf.writestr("run.py", "print('system runtime')\n")
                  zf.writestr(
                      "latka_jazn/version.py",
                      "PACKAGE_VERSION_FULL = '16.3.25.3.3-chatgpt-package-discovery-bootstrap'\n",
                  )
              (parts_dir / f"{package_name}.parts.sha256").write_text(
                  f"{_sha256(archive)}  {package_name}\n", encoding="utf-8"
              )
              return package_name


          def test_runtime_discovery_ignores_old_memory_profile_and_finds_checksum_only_system_zip(tmp_path: Path) -> None:
              memory_name = _write_memory_sidecar_renamed_by_host(tmp_path)
              system_name = _write_complete_system_zip_with_parts_sha(tmp_path)
              selected = infer_base_zip_name(
                  tmp_path,
                  allowed_profiles=frozenset({"system", "combined", "unknown"}),
              )
              assert selected == system_name
              assert selected != memory_name


          def test_memory_autodiscovery_accepts_chatgpt_renamed_package_sidecar(tmp_path: Path) -> None:
              package_name = _write_memory_sidecar_renamed_by_host(tmp_path)
              result = _discover_memory_package(tmp_path)
              assert result["ok"] is True
              assert result["state"] == "memory_package_discovered"
              assert result["package_name"] == package_name
              assert str(result["sidecar_path"]).endswith(".package(1).json")


          def test_single_complete_zip_listed_by_parts_sha_is_a_valid_package_part(tmp_path: Path) -> None:
              package_name = _write_complete_system_zip_with_parts_sha(tmp_path)
              expected, _, source = load_package_expectations(tmp_path, package_name)
              validated, _, validated_source = validate_package_parts(tmp_path, package_name)
              assert source == "parts.sha256"
              assert validated_source == "parts.sha256"
              assert [item.filename for item in expected] == [package_name]
              assert [item.filename for item in validated] == [package_name]


          def test_verified_old_destination_does_not_silently_ignore_new_system_package(tmp_path: Path, monkeypatch) -> None:
              parts_dir = tmp_path / "parts"
              system_name = _write_complete_system_zip_with_parts_sha(parts_dir)
              destination = tmp_path / "active-old"
              destination.mkdir()
              preflight = RuntimePreflightReport(
                  ok=True,
                  active_root=str(destination),
                  structure_ok=True,
                  manifest_ok=True,
                  provenance_ok=True,
                  marker_ok=True,
                  start_file="run.py",
                  version="16.3.25.3.2-chatgpt-loader-capability-bootstrap",
                  manifest_version="16.3.25.3.2-chatgpt-loader-capability-bootstrap",
                  marker_path=str(tmp_path / "workspace_runtime" / "JAZN_ACTIVE_RUNTIME.json"),
              )
              monkeypatch.setattr(recovery_module, "runtime_preflight", lambda *_args, **_kwargs: preflight)
              result = recover_chatgpt_runtime(
                  parts_dir=parts_dir,
                  destination=destination,
                  start_runtime_daemon=False,
                  auto_attach_memory=False,
              )
              assert result.ok is False
              assert result.state == "incoming_package_requires_new_destination"
              assert result.exit_code == 9
              assert result.report["replacement_blocked"]["incoming_base_zip_name"] == system_name
              assert result.report["replacement_blocked"]["reason"] == "incoming_system_package_requires_new_destination"
          ''').lstrip(), encoding="utf-8")
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile and run focused regressions
        run: |
          python -m compileall -q latka_jazn tests main.py run.py
          python -m pytest -q tests/test_v1632533_chatgpt_package_discovery_bootstrap.py tests/test_runtime_package_loader_contract.py
          git diff --check

      - name: Commit validated repair and remove applicators
        shell: bash
        run: |
          git rm .github/workflows/temporary-v1632533-package-discovery-fix.yml
          git rm .github/workflows/temporary-v1632533-package-discovery-fix-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latka_jazn/packaging/split_zip_package.py latka_jazn/bootstrap/chatgpt_recovery.py latka_jazn/version.py tests/test_v1632533_chatgpt_package_discovery_bootstrap.py
          git diff --cached --check
          git commit -m "fix: repair ChatGPT package discovery bootstrap"
          git push origin HEAD:fix/v16.3.25.3.3-chatgpt-package-discovery-bootstrap
